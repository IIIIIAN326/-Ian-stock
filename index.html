<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<title>IAN STOCK</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:#07090d;
  color:#f5f7fa;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans TC",Arial,sans-serif;
}

body{
  padding-bottom:105px;
}

button,input,select{
  font:inherit;
}

button{
  border:0;
}

.app{
  max-width:920px;
  margin:auto;
  padding:18px 16px 120px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.logo{
  font-size:29px;
  font-weight:900;
  letter-spacing:.5px;
}

.status{
  border:1px solid #235e43;
  color:#42d392;
  border-radius:20px;
  padding:7px 11px;
  font-size:12px;
}

.status.red{
  color:#ff6875;
  border-color:#71303a;
}

.search{
  width:100%;
  height:54px;
  border-radius:18px;
  background:#11151d;
  border:1px solid #252d39;
  color:#fff;
  padding:0 18px;
  outline:none;
  margin-bottom:14px;
}

.market-switch{
  display:flex;
  gap:4px;
  background:#11151d;
  padding:4px;
  border-radius:16px;
}

.market-switch button{
  flex:1;
  height:50px;
  background:transparent;
  color:#8c96a5;
  border-radius:13px;
  font-weight:800;
}

.market-switch button.active{
  background:#202631;
  color:#fff;
}

.section-title{
  font-size:25px;
  font-weight:900;
  margin:30px 0 14px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.card,
.metric,
.stock-card,
.ai-box,
.trade,
.chart-box,
.notice{
  background:#11151d;
  border:1px solid #252d39;
  border-radius:20px;
}

.card{
  padding:18px;
}

.card-title{
  color:#8d97a6;
  font-size:14px;
}

.big{
  margin-top:7px;
  font-size:26px;
  font-weight:900;
}

.green{
  color:#42d392!important;
}

.red{
  color:#ff6875!important;
}

.gray{
  color:#8993a2!important;
}

.stock-card{
  padding:18px;
  margin-bottom:10px;
  cursor:pointer;
}

.stock-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.stock-name{
  font-size:19px;
  font-weight:900;
}

.stock-symbol{
  color:#8993a2;
  margin-top:5px;
}

.stock-price{
  font-size:22px;
  font-weight:900;
  text-align:right;
}

.stock-change{
  text-align:right;
  margin-top:4px;
}

.empty{
  text-align:center;
  padding:35px 10px;
  color:#8993a2;
}

.hidden{
  display:none!important;
}

.back{
  background:#1a202a;
  color:#fff;
  border-radius:13px;
  padding:10px 16px;
  margin-bottom:14px;
}

.detail{
  background:#11151d;
  border:1px solid #252d39;
  border-radius:22px;
  padding:20px;
}

.detail-name{
  font-size:28px;
  font-weight:900;
}

.detail-symbol{
  color:#8993a2;
  margin-top:4px;
}

.detail-price{
  font-size:43px;
  font-weight:900;
  margin-top:17px;
}

.detail-change{
  font-size:17px;
  margin-top:5px;
}

.action-row{
  display:flex;
  gap:8px;
  margin-top:16px;
  flex-wrap:wrap;
}

.action-btn{
  background:#202631;
  color:#fff;
  padding:11px 15px;
  border-radius:13px;
  font-weight:700;
}

.range-tabs{
  display:flex;
  gap:7px;
  overflow:auto;
  margin:14px 0;
}

.range-tabs button{
  flex:none;
  background:#11151d;
  border:1px solid #252d39;
  color:#8993a2;
  border-radius:13px;
  padding:9px 13px;
}

.range-tabs button.active{
  background:#202631;
  color:#fff;
}

.chart-box{
  padding:10px;
  overflow:hidden;
}

#priceChart{
  width:100%;
  height:310px;
  display:block;
}

.metric{
  padding:17px;
}

.metric-label{
  color:#8993a2;
  font-size:13px;
}

.metric-value{
  margin-top:7px;
  font-size:22px;
  font-weight:900;
}

.ai-box{
  padding:19px;
  margin-bottom:12px;
}

.ai-title{
  font-size:20px;
  font-weight:900;
}

.ai-score{
  font-size:36px;
  font-weight:900;
  margin-top:10px;
}

.ai-tag{
  display:inline-block;
  margin-top:8px;
  margin-right:5px;
  padding:6px 11px;
  border:1px solid #286846;
  color:#42d392;
  border-radius:20px;
  font-size:13px;
}

.list{
  margin:12px 0 0;
  padding-left:20px;
  line-height:1.8;
  color:#c4cad3;
}

.trade{
  padding:18px;
}

.trade input{
  width:100%;
  height:48px;
  border-radius:13px;
  background:#090c11;
  border:1px solid #252d39;
  color:#fff;
  padding:0 13px;
  margin:5px 0;
  outline:none;
}

.primary{
  width:100%;
  height:50px;
  border-radius:14px;
  background:#f5f7fa;
  color:#07090d;
  font-weight:900;
  margin-top:7px;
}

.alert-card{
  background:#11151d;
  border:1px solid #252d39;
  border-radius:18px;
  padding:16px;
  margin-bottom:10px;
}

.notice{
  padding:14px;
  color:#8993a2;
  line-height:1.6;
}

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:100;
  background:rgba(7,9,13,.97);
  border-top:1px solid #252d39;
  backdrop-filter:blur(18px);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
}

.bottom-inner{
  max-width:920px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:4px;
}

.nav{
  min-height:64px;
  background:transparent;
  color:#778190;
  border-radius:16px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:4px;
}

.nav.active{
  background:#1a202a;
  color:#fff;
}

.nav-icon{
  font-size:21px;
}

.nav-text{
  font-size:11px;
  font-weight:800;
}

@media(min-width:700px){
  .grid{
    grid-template-columns:repeat(3,1fr);
  }
}
</style>
</head>

<body>

<div class="app">

<header class="header">
  <div class="logo">IAN STOCK</div>
  <div id="status" class="status">● SYSTEM</div>
</header>

<input
  id="search"
  class="search"
  placeholder="搜尋股票代號或公司名稱，例如 2330 / NVDA"
>

<div id="searchResults"></div>

<!-- 首頁 -->
<section id="homePage">

  <div class="market-switch">

    <button id="twBtn"
      class="active"
      onclick="setMarket('TW')">
      🇹🇼 台股
    </button>

    <button id="usBtn"
      onclick="setMarket('US')">
      🇺🇸 美股
    </button>

  </div>

  <div class="section-title">
    市場脈動
  </div>

  <div class="grid">

    <div class="card">
      <div class="card-title">台灣加權指數</div>
      <div id="twii" class="big">載入中</div>
    </div>

    <div class="card">
      <div class="card-title">NASDAQ</div>
      <div id="nasdaq" class="big">載入中</div>
    </div>

    <div class="card">
      <div class="card-title">S&P 500</div>
      <div id="sp500" class="big">載入中</div>
    </div>

    <div class="card">
      <div class="card-title">USD / TWD</div>
      <div id="usdtwd" class="big">載入中</div>
    </div>

  </div>

  <div class="section-title">
    熱門股票
  </div>

  <div id="hotStocks"></div>

</section>


<!-- 搜尋 -->
<section id="searchPage" class="hidden">

  <div class="section-title">
    搜尋股票
  </div>

  <div class="notice">
    可搜尋股票代號或公司名稱。
  </div>

  <div style="height:12px"></div>

  <div id="allStocks"></div>

</section>


<!-- 自選 -->
<section id="watchPage" class="hidden">

  <div class="section-title">
    ⭐ 自選股
  </div>

  <div id="watchList"></div>

</section>


<!-- 投資組合 -->
<section id="portfolioPage" class="hidden">

  <div class="section-title">
    投資組合
  </div>

  <div class="grid">

    <div class="card">
      <div class="card-title">現金</div>
      <div id="cash" class="big">
        NT$1,000,000
      </div>
    </div>

    <div class="card">
      <div class="card-title">持倉市值</div>
      <div id="positionValue" class="big">
        NT$0
      </div>
    </div>

    <div class="card">
      <div class="card-title">未實現損益</div>
      <div id="pnl" class="big">
        NT$0
      </div>
    </div>

    <div class="card">
      <div class="card-title">報酬率</div>
      <div id="roi" class="big">
        0%
      </div>
    </div>

  </div>

  <div class="section-title">
    模擬交易
  </div>

  <div class="trade">

    <input
      id="tradeSymbol"
      placeholder="股票代號，例如 2330 / NVDA"
    >

    <input
      id="tradeShares"
      type="number"
      placeholder="股數"
    >

    <input
      id="tradePrice"
      type="number"
      placeholder="買入價格"
    >

    <button
      class="primary"
      onclick="buyStock()">
      模擬買入
    </button>

  </div>

  <div class="section-title">
    持倉
  </div>

  <div id="positions"></div>

</section>


<!-- 警報 -->
<section id="alertsPage" class="hidden">

  <div class="section-title">
    🔔 價格警報
  </div>

  <div class="trade">

    <input
      id="alertSymbol"
      placeholder="股票代號，例如 NVDA"
    >

    <input
      id="alertPrice"
      type="number"
      placeholder="觸發價格"
    >

    <select
      id="alertType"
      style="
      width:100%;
      height:48px;
      margin:5px 0;
      border-radius:13px;
      background:#090c11;
      border:1px solid #252d39;
      color:white;
      padding:0 12px;
      "
    >

      <option value="above">
        價格高於
      </option>

      <option value="below">
        價格低於
      </option>

    </select>

    <button
      class="primary"
      onclick="createAlert()">
      建立警報
    </button>

  </div>

  <div class="section-title">
    我的警報
  </div>

  <div id="alertList"></div>

</section>


<!-- AI -->
<section id="aiPage" class="hidden">

  <div class="section-title">
    🤖 IAN AI
  </div>

  <div class="notice">
    IAN AI 根據歷史行情與技術指標產生分析摘要。
  </div>

  <div style="height:12px"></div>

  <input
    id="aiSymbol"
    class="search"
    placeholder="輸入 NVDA / AAPL / 2330"
  >

  <button
    class="primary"
    onclick="runAI()">
    開始分析
  </button>

  <div id="aiResult" style="margin-top:14px"></div>

</section>


<!-- 股票詳細頁 -->
<section id="detailPage" class="hidden">

  <button
    class="back"
    onclick="showPage('home')">
    ← 返回
  </button>

  <div id="detail"></div>

</section>

</div>


<!-- 底部導航 -->
<nav class="bottom">

<div class="bottom-inner">

<button
  id="navHome"
  class="nav active"
  onclick="showPage('home')">

  <div class="nav-icon">⌂</div>
  <div class="nav-text">首頁</div>

</button>

<button
  id="navSearch"
  class="nav"
  onclick="showPage('search')">

  <div class="nav-icon">⌕</div>
  <div class="nav-text">搜尋</div>

</button>

<button
  id="navWatch"
  class="nav"
  onclick="showPage('watch')">

  <div class="nav-icon">☆</div>
  <div class="nav-text">自選</div>

</button>

<button
  id="navPortfolio"
  class="nav"
  onclick="showPage('portfolio')">

  <div class="nav-icon">▣</div>
  <div class="nav-text">投資組合</div>

</button>

<button
  id="navAlerts"
  class="nav"
  onclick="showPage('alerts')">

  <div class="nav-icon">♢</div>
  <div class="nav-text">警報</div>

</button>

<button
  id="navAI"
  class="nav"
  onclick="showPage('ai')">

  <div class="nav-icon">AI</div>
  <div class="nav-text">AI</div>

</button>

</div>
</nav>


<script>

const API =
  "https://ian-stock-api.onrender.com";


let market = "TW";

let watchlist =
  JSON.parse(
    localStorage.getItem(
      "ian_watchlist"
    ) || "[]"
  );

let positions =
  JSON.parse(
    localStorage.getItem(
      "ian_positions"
    ) || "[]"
  );

let alerts =
  JSON.parse(
    localStorage.getItem(
      "ian_alerts"
    ) || "[]"
  );


const stocks = [

  {symbol:"2330",name:"台積電",market:"TW"},
  {symbol:"2317",name:"鴻海",market:"TW"},
  {symbol:"2454",name:"聯發科",market:"TW"},
  {symbol:"2303",name:"聯電",market:"TW"},
  {symbol:"2308",name:"台達電",market:"TW"},
  {symbol:"2382",name:"廣達",market:"TW"},
  {symbol:"2603",name:"長榮",market:"TW"},
  {symbol:"2615",name:"萬海",market:"TW"},
  {symbol:"2881",name:"富邦金",market:"TW"},
  {symbol:"2882",name:"國泰金",market:"TW"},

  {symbol:"NVDA",name:"NVIDIA",market:"US"},
  {symbol:"AAPL",name:"Apple",market:"US"},
  {symbol:"MSFT",name:"Microsoft",market:"US"},
  {symbol:"AMZN",name:"Amazon",market:"US"},
  {symbol:"GOOGL",name:"Alphabet",market:"US"},
  {symbol:"META",name:"Meta",market:"US"},
  {symbol:"TSLA",name:"Tesla",market:"US"},
  {symbol:"AMD",name:"AMD",market:"US"},
  {symbol:"AVGO",name:"Broadcom",market:"US"},
  {symbol:"TSM",name:"Taiwan Semiconductor",market:"US"},
  {symbol:"NFLX",name:"Netflix",market:"US"},
  {symbol:"COST",name:"Costco",market:"US"},
  {symbol:"ORCL",name:"Oracle",market:"US"},
  {symbol:"INTC",name:"Intel",market:"US"},
  {symbol:"QCOM",name:"Qualcomm",market:"US"}

];


function save(){

  localStorage.setItem(
    "ian_watchlist",
    JSON.stringify(watchlist)
  );

  localStorage.setItem(
    "ian_positions",
    JSON.stringify(positions)
  );

  localStorage.setItem(
    "ian_alerts",
    JSON.stringify(alerts)
  );
}


function num(v){

  if(
    v === null ||
    v === undefined ||
    !Number.isFinite(Number(v))
  ){
    return "待資料";
  }

  return Number(v).toLocaleString(
    "zh-TW",
    {
      maximumFractionDigits:2
    }
  );
}


function money(v){

  return "NT$" +
    Number(v || 0).toLocaleString(
      "zh-TW",
      {
        maximumFractionDigits:2
      }
    );
}


function color(v){

  if(Number(v)>0)
    return "green";

  if(Number(v)<0)
    return "red";

  return "gray";
}


async function api(path){

  const response =
    await fetch(
      API + path
    );

  if(!response.ok){
    throw new Error(
      "API " + response.status
    );
  }

  return response.json();
}


/* =========================
   PAGE
========================= */

function showPage(page){

  const pages = [
    "home",
    "search",
    "watch",
    "portfolio",
    "alerts",
    "ai",
    "detail"
  ];

  pages.forEach(
    p => {

      const el =
        document.getElementById(
          p + "Page"
        );

      if(el){

        el.classList.toggle(
          "hidden",
          p !== page
        );

      }

    }
  );


  document
    .querySelectorAll(".nav")
    .forEach(
      x =>
        x.classList.remove(
          "active"
        )
    );


  const nav = {

    home:"navHome",
    search:"navSearch",
    watch:"navWatch",
    portfolio:"navPortfolio",
    alerts:"navAlerts",
    ai:"navAI"

  };


  if(nav[page]){

    document
      .getElementById(
        nav[page]
      )
      .classList.add(
        "active"
      );

  }


  if(page === "search")
    renderAll();

  if(page === "watch")
    renderWatch();

  if(page === "portfolio")
    renderPortfolio();

  if(page === "alerts")
    renderAlerts();

  window.scrollTo(0,0);
}


/* =========================
   MARKET
========================= */

function setMarket(m){

  market = m;

  document
    .getElementById("twBtn")
    .classList.toggle(
      "active",
      m === "TW"
    );

  document
    .getElementById("usBtn")
    .classList.toggle(
      "active",
      m === "US"
    );

  loadHot();
}


/* =========================
   STATUS
========================= */

async function loadStatus(){

  try{

    const d =
      await api(
        "/api/status"
      );

    const el =
      document.getElementById(
        "status"
      );


    if(
      d.yahooFinance === "OK" &&
      d.history === "OK"
    ){

      el.textContent =
        "● LIVE DATA";

      el.className =
        "status";

    }else{

      el.textContent =
        "● API ERROR";

      el.className =
        "status red";

    }

  }catch{

    document
      .getElementById(
        "status"
      )
      .textContent =
      "● OFFLINE";

  }
}


/* =========================
   MARKET DATA
========================= */

async function loadMarket(){

  try{

    const d =
      await api(
        "/api/market"
      );


    document
      .getElementById("twii")
      .textContent =
      num(
        d.taiwan?.price
      );


    document
      .getElementById("nasdaq")
      .textContent =
      num(
        d.nasdaq?.price
      );


    document
      .getElementById("sp500")
      .textContent =
      num(
        d.sp500?.price
      );


    document
      .getElementById("usdtwd")
      .textContent =
      num(
        d.usdTwd?.price
      );

  }catch(e){

    console.log(e);

  }
}


/* =========================
   HOT STOCKS
========================= */

async function loadHot(){

  const box =
    document.getElementById(
      "hotStocks"
    );


  const list =
    stocks
      .filter(
        s =>
          s.market === market
      )
      .slice(0,8);


  box.innerHTML =
    `<div class="empty">行情載入中...</div>`;


  try{

    const d =
      await api(
        "/api/quotes?symbols=" +
        list
          .map(
            s=>s.symbol
          )
          .join(",")
      );


    box.innerHTML = "";


    list.forEach(
      stock => {

        const q =
          (d.results || [])
            .find(
              x =>
                x.symbol ===
                stock.symbol
            );


        const el =
          document.createElement(
            "div"
          );


        el.className =
          "stock-card";


        el.innerHTML = `

          <div class="stock-top">

            <div>

              <div class="stock-name">
                ${stock.name}
              </div>

              <div class="stock-symbol">
                ${stock.symbol}
              </div>

            </div>

            <div>

              <div class="stock-price">
                ${
                  q
                    ? num(q.price)
                    : "待資料"
                }
              </div>

              <div class="
                stock-change
                ${
                  q
                    ? color(q.changePct)
                    : "gray"
                }
              ">
                ${
                  q
                    ? (
                        q.changePct >= 0
                          ? "+"
                          : ""
                      ) +
                      num(q.changePct) +
                      "%"
                    : "待資料"
                }
              </div>

            </div>

          </div>

        `;


        el.onclick =
          () =>
            openStock(
              stock.symbol
            );


        box.appendChild(el);

      }
    );

  }catch{

    box.innerHTML =
      `<div class="empty">行情暫時無法取得</div>`;

  }
}


/* =========================
   SEARCH
========================= */

let searchTimer;


document
  .getElementById("search")
  .addEventListener(
    "input",
    function(){

      clearTimeout(
        searchTimer
      );


      const q =
        this.value
          .trim()
          .toUpperCase();


      if(!q){

        document
          .getElementById(
            "searchResults"
          )
          .innerHTML = "";

        return;
      }


      searchTimer =
        setTimeout(
          async()=>{

            try{

              const d =
                await api(
                  "/api/search?q=" +
                  encodeURIComponent(q)
                );


              const box =
                document.getElementById(
                  "searchResults"
                );


              box.innerHTML = "";


              (d.results || [])
                .slice(0,8)
                .forEach(
                  s => {

                    const el =
                      document.createElement(
                        "div"
                      );


                    el.className =
                      "stock-card";


                    el.innerHTML = `

/* =========================
   K LINE
========================= */

function drawChart(
  rows,
  indicators
){

  const canvas =
    document.getElementById(
      "priceChart"
    );


  if(!canvas)
    return;


  const box =
    canvas.parentElement;


  const width =
    Math.max(
      280,
      box.clientWidth - 20
    );

  const height = 310;

  const ratio =
    window.devicePixelRatio || 1;


  canvas.width =
    width * ratio;

  canvas.height =
    height * ratio;

  canvas.style.width =
    width + "px";

  canvas.style.height =
    height + "px";


  const ctx =
    canvas.getContext(
      "2d"
    );


  ctx.scale(
    ratio,
    ratio
  );


  ctx.clearRect(
    0,
    0,
    width,
    height
  );


  if(!rows.length)
    return;


  const data =
    rows.slice(-100);


  const highs =
    data.map(
      x=>Number(x.high)
    );


  const lows =
    data.map(
      x=>Number(x.low)
    );


  const max =
    Math.max(...highs);

  const min =
    Math.min(...lows);

  const range =
    max-min || 1;


  const padding = 25;

  const chartHeight =
    height-padding*2;


  function y(price){

    return (
      padding +
      (max-price) /
      range *
      chartHeight
    );

  }


  ctx.strokeStyle =
    "#252d39";

  ctx.lineWidth=1;


  for(
    let i=0;
    i<5;
    i++
  ){

    const yy =
      padding +
      i *
      chartHeight/4;


    ctx.beginPath();

    ctx.moveTo(
      0,
      yy
    );

    ctx.lineTo(
      width,
      yy
    );

    ctx.stroke();

  }


  const candleWidth =
    Math.max(
      3,
      width/data.length*.62
    );


  data.forEach(
    (row,i)=>{

      const x =
        i *
        width/data.length +
        width/data.length/2;


      const open =
        Number(row.open);

      const close =
        Number(row.close);

      const high =
        Number(row.high);

      const low =
        Number(row.low);


      const up =
        close>=open;


      ctx.strokeStyle =
        up
          ? "#42d392"
          : "#ff6875";

      ctx.fillStyle =
        up
          ? "#42d392"
          : "#ff6875";


      ctx.beginPath();

      ctx.moveTo(
        x,
        y(high)
      );

      ctx.lineTo(
        x,
        y(low)
      );

      ctx.stroke();


      const top =
        y(
          Math.max(
            open,
            close
          )
        );

      const bottom =
        y(
          Math.min(
            open,
            close
          )
        );


      ctx.fillRect(
        x-candleWidth/2,
        top,
        candleWidth,
        Math.max(
          1,
          bottom-top
        )
      );

    }
  );


  drawLine(
    ctx,
    data,
    20,
    y,
    width
  );


  drawLine(
    ctx,
    data,
    60,
    y,
    width
  );


  if(
    indicators
      .supportResistance
      ?.support
  ){

    drawHorizontal(
      ctx,
      y(
        indicators
          .supportResistance
          .support
      ),
      width
    );

  }


  if(
    indicators
      .supportResistance
      ?.resistance
  ){

    drawHorizontal(
      ctx,
      y(
        indicators
          .supportResistance
          .resistance
      ),
      width
    );

  }

}


function movingAverage(
  data,
  index,
  period
){

  if(
    index<period-1
  )
    return null;


  let sum=0;


  for(
    let i=index-period+1;
    i<=index;
    i++
  ){

    sum +=
      Number(
        data[i].close
      );

  }


  return sum/period;
}


function drawLine(
  ctx,
  data,
  period,
  y,
  width
){

  ctx.strokeStyle =
    "#d6b85a";

  ctx.lineWidth=1.5;


  let started=false;


  data.forEach(
    (row,i)=>{

      const value =
        movingAverage(
          data,
          i,
          period
        );


      if(value===null)
        return;


      const x =
        i *
        width/data.length +
        width/data.length/2;


      const yy =
        y(value);


      if(!started){

        ctx.beginPath();

        ctx.moveTo(
          x,
          yy
        );

        started=true;

      }else{

        ctx.lineTo(
          x,
          yy
        );

      }

    }
  );


  if(started)
    ctx.stroke();
}


function drawHorizontal(
  ctx,
  y,
  width
){

  ctx.save();

  ctx.setLineDash(
    [6,6]
  );

  ctx.strokeStyle =
    "#778190";

  ctx.beginPath();

  ctx.moveTo(
    0,
    y
  );

  ctx.lineTo(
    width,
    y
  );

  ctx.stroke();

  ctx.restore();
}

async function buyStock(){

  const symbol =
    document
      .getElementById(
        "tradeSymbol"
      )
      .value
      .trim()
      .toUpperCase();


  const shares =
    Number(
      document
        .getElementById(
          "tradeShares"
        )
        .value
    );


  const price =
    Number(
      document
        .getElementById(
          "tradePrice"
        )
        .value
    );


  if(
    !symbol ||
    shares<=0 ||
    price<=0
  ){

    alert(
      "請輸入完整資料"
    );

    return;
  }


  const existing =
    positions.find(
      x =>
        x.symbol ===
        symbol
    );


  if(existing){

    const oldCost =
      existing.shares *
      existing.avgPrice;


    existing.shares +=
      shares;


    existing.avgPrice =
      (
        oldCost +
        shares*price
      ) /
      existing.shares;

  }else{

    positions.push({

      symbol,

      shares,

      avgPrice:
        price

    });

  }


  save();

  renderPortfolio();


  document
    .getElementById(
      "tradeSymbol"
    )
    .value="";

  document
    .getElementById(
      "tradeShares"
    )
    .value="";

  document
    .getElementById(
      "tradePrice"
    )
    .value="";

}


async function renderPortfolio(){

  const box =
    document.getElementById(
      "positions"
    );


  if(!positions.length){

    box.innerHTML =
      `<div class="empty">
        目前沒有模擬持倉
      </div>`;

    return;
  }


  try{

    const d =
      await api(
        "/api/quotes?symbols=" +
        positions
          .map(
            p=>p.symbol
          )
          .join(",")
      );


    box.innerHTML="";


    let value=0;

    let cost=0;


    positions.forEach(
      p=>{

        const q =
          (d.results || [])
            .find(
              x =>
                x.symbol ===
                p.symbol
            );


        const current =
          q
            ? q.price
            : p.avgPrice;


        const currentValue =
          current *
          p.shares;


        const originalCost =
          p.avgPrice *
          p.shares;


        value +=
          currentValue;

        cost +=
          originalCost;


        const pnl =
          currentValue -
          originalCost;


        const el =
          document.createElement(
            "div"
          );


        el.className =
          "stock-card";


        el.innerHTML = `

          <div class="stock-top">

            <div>

              <div class="stock-name">
                ${p.symbol}
              </div>

              <div class="stock-symbol">
                ${num(p.shares)} 股
              </div>

            </div>

            <div>

              <div class="stock-price">
                ${num(currentValue)}
              </div>

              <div class="${color(pnl)}">
                ${
                  pnl>=0
                    ? "+"
                    : ""
                }${num(pnl)}
              </div>

            </div>

          </div>

        `;


        box.appendChild(
          el
        );

      }
    );


    const profit =
      value-cost;


    document
      .getElementById(
        "positionValue"
      )
      .textContent =
      money(value);


    document
      .getElementById(
        "pnl"
      )
      .textContent =
      money(profit);


    document
      .getElementById(
        "pnl"
      )
      .className =
      "big " +
      color(profit);


    document
      .getElementById(
        "roi"
      )
      .textContent =
      cost
        ? (
            profit/cost*100
          ).toFixed(2)+"%"
        : "0%";


  }catch{

    box.innerHTML =
      `<div class="empty">
        行情取得失敗
      </div>`;

  }
}

async function checkAlerts(){

  if(!alerts.length)
    return;


  const symbols =
    [
      ...new Set(
        alerts.map(
          x=>x.symbol
        )
      )
    ];


  try{

    const d =
      await api(
        "/api/quotes?symbols=" +
        symbols.join(",")
      );


    alerts.forEach(
      a=>{

        if(!a.active)
          return;


        const q =
          (d.results || [])
            .find(
              x =>
                x.symbol ===
                a.symbol
            );


        if(!q)
          return;


        const hit =
          a.type === "above"
            ? q.price >= a.price
            : q.price <= a.price;


        if(hit){

          alert(
            `IAN STOCK 警報：${a.symbol} 已達 ${num(q.price)}`
          );

          a.active=false;

        }

      }
    );


    save();

  }catch{}

}


/* =========================
   INIT
========================= */

async function init(){

  loadStatus();

  loadMarket();

  loadHot();

  setInterval(
    loadStatus,
    60000
  );

  setInterval(
    checkAlerts,
    60000
  );

}

init();

</script>
