<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05080a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IAN STOCK">
<title>IAN STOCK</title>

<style>
:root{
  --bg:#05080a;
  --bg2:#080d10;
  --panel:#0b1115;
  --panel2:#0e151a;
  --panel3:#111a20;
  --line:#1c282f;
  --line2:#26353d;

  --text:#f4f7f8;
  --muted:#84929a;
  --muted2:#64727a;

  --green:#35e38b;
  --green2:#16c979;
  --green3:#0b8f59;
  --greenSoft:rgba(53,227,139,.10);
  --greenGlow:rgba(53,227,139,.20);

  --red:#ff5d73;
  --yellow:#f5c451;
  --blue:#58a6ff;

  --radius:18px;
  --navH:78px;
  --max:760px;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  background:var(--bg);
  color-scheme:dark;
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:
    radial-gradient(circle at 50% -10%,rgba(53,227,139,.065),transparent 35%),
    linear-gradient(180deg,#05080a 0%,#060a0d 100%);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "PingFang TC",
    "Noto Sans TC",
    Arial,
    sans-serif;
  min-height:100vh;
  padding-bottom:calc(var(--navH) + env(safe-area-inset-bottom) + 20px);
}

button,
input{
  font:inherit;
}

button{
  border:0;
  color:inherit;
  background:none;
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

input{
  color:var(--text);
}

/* =========================
   APP
========================= */

.app{
  width:100%;
  max-width:var(--max);
  margin:auto;
}

/* =========================
   TOP BAR
========================= */

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  padding:
    max(18px,env(safe-area-inset-top))
    20px
    14px;

  background:rgba(5,8,10,.88);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,.035);
}

.toprow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-height:50px;
}

.brand{
  font-weight:900;
  font-size:25px;
  letter-spacing:2px;
}

.brand span{
  color:var(--green);
}

.live{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--green);
  font-size:13px;
  font-weight:700;
}

.liveDot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 12px var(--green);
}

.live.off{
  color:var(--red);
}

.live.off .liveDot{
  background:var(--red);
  box-shadow:0 0 10px var(--red);
}

/* =========================
   MAIN
========================= */

main{
  padding:20px 18px 30px;
}

.section{
  margin-bottom:24px;
}

.sectionHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:13px;
}

.sectionTitle{
  font-size:21px;
  font-weight:850;
  letter-spacing:.2px;
}

.sectionSub{
  color:var(--muted);
  font-size:13px;
}

/* =========================
   SEARCH
========================= */

.searchBox{
  display:flex;
  align-items:center;
  gap:11px;

  background:var(--panel);
  border:1px solid var(--line);
  border-radius:15px;
  padding:12px 14px;

  transition:.2s ease;
}

.searchBox:focus-within{
  border-color:rgba(53,227,139,.45);
  box-shadow:0 0 0 3px rgba(53,227,139,.06);
}

.searchIcon{
  width:20px;
  height:20px;
  color:var(--muted);
  flex:none;
}

.searchInput{
  width:100%;
  border:0;
  outline:none;
  background:transparent;
  font-size:16px;
}

.searchInput::placeholder{
  color:#68767d;
}

/* =========================
   MARKET STRIP
========================= */

.marketStrip{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.marketCard{
  min-width:0;
  background:linear-gradient(145deg,var(--panel2),var(--panel));
  border:1px solid var(--line);
  border-radius:15px;
  padding:13px 11px;
}

.marketName{
  color:var(--muted);
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.marketPrice{
  font-size:16px;
  font-weight:850;
  margin-top:7px;
  white-space:nowrap;
}

.marketChange{
  font-size:11px;
  margin-top:4px;
}

.up{
  color:var(--green)!important;
}

.down{
  color:var(--red)!important;
}

.neutral{
  color:var(--muted)!important;
}

/* =========================
   FEATURE CARD
========================= */

.feature{
  position:relative;
  overflow:hidden;

  background:
    radial-gradient(circle at 90% 10%,rgba(53,227,139,.10),transparent 35%),
    linear-gradient(145deg,#0c1519,#080d10);

  border:1px solid var(--line2);
  border-radius:21px;
  padding:20px;
}

.feature::after{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  right:-80px;
  bottom:-90px;
  border-radius:50%;
  background:rgba(53,227,139,.035);
  pointer-events:none;
}

.featureTop{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.featureLabel{
  color:var(--muted);
  font-size:12px;
  font-weight:700;
}

.featureSymbol{
  font-size:29px;
  font-weight:900;
  letter-spacing:.5px;
  margin-top:4px;
}

.featureName{
  color:var(--muted);
  font-size:14px;
  margin-top:2px;
}

.featureRight{
  text-align:right;
}

.featurePrice{
  font-size:29px;
  font-weight:900;
}

.featurePct{
  font-size:14px;
  margin-top:3px;
}

.miniChart{
  height:74px;
  margin-top:17px;
  position:relative;
  overflow:hidden;
}

.miniChart svg{
  width:100%;
  height:100%;
}

.chartLine{
  fill:none;
  stroke:var(--green);
  stroke-width:2.5;
  stroke-linecap:round;
  stroke-linejoin:round;
  filter:drop-shadow(0 0 4px rgba(53,227,139,.35));
}

.chartArea{
  fill:url(#area);
  opacity:.45;
}

/* =========================
   STOCK LIST
========================= */

.stockList{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.stockCard{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;

  padding:15px 15px;
  border-radius:17px;

  background:
    linear-gradient(145deg,#0c1217,#090e12);

  border:1px solid var(--line);

  text-align:left;
  transition:
    transform .15s ease,
    border-color .2s ease,
    background .2s ease;
}

.stockCard:hover{
  border-color:#2c3a42;
}

.stockLeft{
  min-width:0;
}

.stockSymbol{
  font-size:20px;
  line-height:1.15;
  font-weight:900;
  letter-spacing:.3px;
}

.stockName{
  margin-top:5px;
  color:var(--muted);
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.stockMarket{
  color:var(--muted2);
}

.stockRight{
  text-align:right;
  flex:none;
}

.stockPrice{
  font-size:19px;
  font-weight:850;
}

.stockPct{
  margin-top:4px;
  font-size:14px;
  font-weight:700;
}

.stockVol{
  margin-top:3px;
  font-size:10px;
  color:var(--muted2);
}

/* =========================
   FAVORITE
========================= */

.star{
  width:34px;
  height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  color:#66747c;
  flex:none;
}

.star.active{
  color:var(--green);
  background:var(--greenSoft);
}

/* =========================
   EMPTY / LOADING
========================= */

.empty{
  text-align:center;
  padding:45px 20px;
  color:var(--muted);
  border:1px dashed var(--line2);
  border-radius:18px;
}

.emptyIcon{
  font-size:34px;
  margin-bottom:10px;
}

.skeleton{
  position:relative;
  overflow:hidden;
  background:#10171c;
}

.skeleton::after{
  content:"";
  position:absolute;
  inset:0;
  transform:translateX(-100%);
  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.045),
    transparent
  );
  animation:skeleton 1.2s infinite;
}

@keyframes skeleton{
  100%{
    transform:translateX(100%);
  }
}

/* =========================
   DETAIL
========================= */

.detailHeader{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:20px;
}

.backBtn{
  width:40px;
  height:40px;
  border-radius:13px;
  background:var(--panel2);
  border:1px solid var(--line);
  font-size:22px;
}

.detailTitle{
  flex:1;
}

.detailSymbol{
  font-size:26px;
  font-weight:900;
}

.detailName{
  color:var(--muted);
  font-size:13px;
  margin-top:3px;
}

.detailHero{
  background:linear-gradient(145deg,#0d161b,#090e12);
  border:1px solid var(--line);
  border-radius:21px;
  padding:20px;
}

.detailPrice{
  font-size:38px;
  font-weight:900;
  letter-spacing:-1px;
}

.detailChange{
  font-size:16px;
  font-weight:750;
  margin-top:5px;
}

.detailGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
  margin-top:18px;
}

.metric{
  padding:13px;
  border-radius:14px;
  background:#0a1115;
  border:1px solid var(--line);
}

.metricLabel{
  color:var(--muted);
  font-size:11px;
}

.metricValue{
  margin-top:5px;
  font-size:15px;
  font-weight:800;
}

.indicatorGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.indicator{
  padding:13px 10px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:15px;
}

.indicatorName{
  color:var(--muted);
  font-size:11px;
}

.indicatorValue{
  margin-top:6px;
  font-size:15px;
  font-weight:850;
}

.analysisBox{
  padding:17px;
  border-radius:18px;
  background:
    linear-gradient(145deg,rgba(53,227,139,.07),rgba(53,227,139,.015));
  border:1px solid rgba(53,227,139,.17);
}

.analysisTitle{
  font-size:15px;
  font-weight:850;
  margin-bottom:8px;
}

.analysisText{
  color:#aeb9be;
  font-size:13px;
  line-height:1.7;
}

/* =========================
   PORTFOLIO
========================= */

.balanceCard{
  padding:20px;
  border-radius:21px;
  background:
    radial-gradient(circle at 90% 0%,rgba(53,227,139,.12),transparent 35%),
    linear-gradient(145deg,#0c1519,#080d10);
  border:1px solid var(--line2);
}

.balanceLabel{
  color:var(--muted);
  font-size:13px;
}

.balance{
  margin-top:6px;
  font-size:35px;
  font-weight:900;
}

.balanceSub{
  margin-top:6px;
  color:var(--muted);
  font-size:12px;
}

.portStats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
  margin-top:12px;
}

.position{
  padding:16px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:17px;
}

.positionTop{
  display:flex;
  justify-content:space-between;
}

.positionSymbol{
  font-weight:900;
  font-size:18px;
}

.positionQty{
  color:var(--muted);
  font-size:12px;
}

.positionPrice{
  margin-top:11px;
  font-weight:800;
}

.positionPnl{
  margin-top:4px;
  font-size:13px;
}

/* =========================
   TRADE
========================= */

.tradePanel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:20px;
  padding:18px;
}

.tradeTabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  padding:4px;
  background:#070b0e;
  border-radius:12px;
}

.tradeTab{
  padding:10px;
  border-radius:9px;
  color:var(--muted);
  font-weight:800;
}

.tradeTab.active{
  background:var(--green);
  color:#03100a;
}

.field{
  margin-top:14px;
}

.field label{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-bottom:7px;
}

.field input{
  width:100%;
  border:1px solid var(--line);
  border-radius:13px;
  padding:13px;
  background:#080d10;
  outline:none;
}

.field input:focus{
  border-color:rgba(53,227,139,.5);
}

.tradeButton{
  width:100%;
  margin-top:16px;
  padding:14px;
  border-radius:13px;
  background:var(--green);
  color:#03100a;
  font-weight:900;
}

.tradeButton.sell{
  background:var(--red);
  color:white;
}

/* =========================
   ALERT
========================= */

.alertCard{
  padding:15px;
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:17px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.alertLeft{
  min-width:0;
}

.alertSymbol{
  font-weight:850;
}

.alertCondition{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.switch{
  width:45px;
  height:27px;
  border-radius:20px;
  background:#202b31;
  padding:3px;
}

.switch span{
  display:block;
  width:21px;
  height:21px;
  border-radius:50%;
  background:#87939a;
  transition:.2s;
}

.switch.active{
  background:var(--green3);
}

.switch.active span{
  background:var(--green);
  transform:translateX(18px);
}

/* =========================
   SEARCH RESULTS
========================= */

.searchResults{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-top:10px;
}

.searchResult{
  padding:13px 15px;
  border-radius:14px;
  border:1px solid var(--line);
  background:var(--panel);
  text-align:left;
}

.searchResultSymbol{
  font-weight:850;
}

.searchResultName{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  z-index:100;
  left:50%;
  bottom:calc(var(--navH) + env(safe-area-inset-bottom) + 18px);
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;

  max-width:calc(100% - 40px);
  padding:11px 16px;
  border-radius:13px;

  background:#182126;
  border:1px solid #2a3940;
  color:#f4f7f8;

  font-size:13px;
  font-weight:700;

  transition:.25s;
}

.toast.show{
  transform:translate(-50%,0);
  opacity:1;
}

/* =========================
   BOTTOM NAV
========================= */

.bottomNav{
  position:fixed;
  z-index:60;

  left:50%;
  bottom:0;
  transform:translateX(-50%);

  width:min(var(--max),100%);

  padding:
    8px
    12px
    calc(8px + env(safe-area-inset-bottom));

  background:rgba(5,8,10,.94);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);

  border-top:1px solid rgba(255,255,255,.06);
}

.navInner{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:4px;
}

.navBtn{
  min-width:0;
  padding:7px 2px 6px;
  border-radius:13px;
  color:#64727a;
}

.navBtn.active{
  color:var(--green);
  background:rgba(53,227,139,.08);
}

.navIcon{
  height:25px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:21px;
  line-height:1;
}

.navLabel{
  margin-top:4px;
  font-size:10px;
  font-weight:700;
  white-space:nowrap;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  z-index:90;
  inset:0;
  display:none;
  align-items:flex-end;
  background:rgba(0,0,0,.62);
  backdrop-filter:blur(5px);
}

.modal.show{
  display:flex;
}

.modalBox{
  width:100%;
  max-width:var(--max);
  margin:auto auto 0;

  background:#0a1014;
  border:1px solid var(--line2);
  border-radius:24px 24px 0 0;

  padding:
    18px
    18px
    calc(22px + env(safe-area-inset-bottom));

  max-height:88vh;
  overflow:auto;
}

.modalHandle{
  width:42px;
  height:4px;
  border-radius:10px;
  background:#334047;
  margin:0 auto 18px;
}

.modalHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:17px;
}

.modalTitle{
  font-size:19px;
  font-weight:900;
}

.close{
  width:34px;
  height:34px;
  border-radius:10px;
  background:#121b20;
  color:var(--muted);
}

/* =========================
   DESKTOP
========================= */

@media(min-width:760px){

  .topbar{
    border-radius:0 0 18px 18px;
  }

  main{
    padding-left:0;
    padding-right:0;
  }

  .stockList{
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .feature{
    padding:25px;
  }
}

/* =========================
   SMALL PHONE
========================= */

@media(max-width:360px){

  main{
    padding-left:13px;
    padding-right:13px;
  }

  .brand{
    font-size:22px;
  }

  .stockSymbol{
    font-size:18px;
  }

  .stockPrice{
    font-size:17px;
  }

  .marketPrice{
    font-size:14px;
  }

  .navLabel{
    font-size:9px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- TOP -->
  <header class="topbar">
    <div class="toprow">
      <div class="brand">IAN <span>STOCK</span></div>

      <div id="liveStatus" class="live">
        <span class="liveDot"></span>
        <span>LIVE</span>
      </div>
    </div>
  </header>

  <!-- CONTENT -->
  <main id="app"></main>

</div>

<!-- BOTTOM NAV -->
<nav class="bottomNav">
  <div class="navInner">

    <button class="navBtn active" data-page="home">
      <div class="navIcon">⌂</div>
      <div class="navLabel">首頁</div>
    </button>

    <button class="navBtn" data-page="search">
      <div class="navIcon">⌕</div>
      <div class="navLabel">搜尋</div>
    </button>

    <button class="navBtn" data-page="watchlist">
      <div class="navIcon">☆</div>
      <div class="navLabel">自選</div>
    </button>

    <button class="navBtn" data-page="portfolio">
      <div class="navIcon">◇</div>
      <div class="navLabel">投資組合</div>
    </button>

    <button class="navBtn" data-page="paper">
      <div class="navIcon">✦</div>
      <div class="navLabel">IAN AI</div>
    </button>

  </div>
</nav>

<!-- TOAST -->
<div id="toast" class="toast"></div>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modalBox">
    <div class="modalHandle"></div>
    <div class="modalHead">
      <div id="modalTitle" class="modalTitle">模擬交易</div>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <div id="modalContent"></div>
  </div>
</div>

<script>
/* =========================================================
   IAN STOCK
   FRONTEND V2
========================================================= */

const API_BASE =

  .replace(/\/$/,"");

const STOCKS = [

  ["2303","聯電","TW"],
  ["2382","廣達","TW"],
  ["3711","日月光投控","TW"],
  ["2881","富邦金","TW"],
  ["2882","國泰金","TW"],
  ["2603","長榮","TW"],
  ["2615","萬海","TW"],
  ["6669","緯穎","TW"],
  ["3037","欣興","TW"],
  ["3231","緯創","TW"],
  ["2357","華碩","TW"],
  ["2376","技嘉","TW"],

  ["NVDA","NVIDIA","US"],
  ["AAPL","Apple","US"],
  ["MSFT","Microsoft","US"],
  ["AMZN","Amazon","US"],
  ["TSLA","Tesla","US"],
  ["GOOGL","Alphabet","US"],
  ["META","Meta","US"]

/* =========================================================
   HELPERS
========================================================= */

function $(id){
  return document.getElementById(id);
}

function esc(v){
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function num(v,d=2){
  if(v === null || v === undefined || v === "" || Number.isNaN(Number(v))){
    return "--";
  }

  return Number(v).toLocaleString(
    "zh-TW",
    {
      minimumFractionDigits:d,
      maximumFractionDigits:d
    }
  );
}

function money(v){
  if(v === null || v === undefined || v === "" || Number.isNaN(Number(v))){
    return "--";
  }

  return Number(v).toLocaleString(
    "zh-TW",
    {
      minimumFractionDigits:0,
      maximumFractionDigits:2
    }
  );
}

function pct(v){
  if(v === null || v === undefined || v === "" || Number.isNaN(Number(v))){
    return "--";
  }

  const n = Number(v);
  return `${n >= 0 ? "+" : ""}${n.toFixed(2)}%`;
}

function volume(v){
  if(v === null || v === undefined || Number.isNaN(Number(v))){
    return "--";
  }

  const n = Number(v);

  if(n >= 100000000){
    return (n / 100000000).toFixed(2) + "億";
  }

  if(n >= 10000){
    return (n / 10000).toFixed(1) + "萬";
  }

  return n.toLocaleString("zh-TW");
}

function changeClass(v){
  if(v === null || v === undefined || Number.isNaN(Number(v))){
    return "neutral";
  }

  if(Number(v) > 0) return "up";
  if(Number(v) < 0) return "down";

  return "neutral";
}

async function api(path,options={}){
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(),10000);

  try{
    const res = await fetch(
      API_BASE + path,
      {
        ...options,
        signal:controller.signal,
        headers:{
          "Accept":"application/json",
          ...(options.headers || {})
        }
      }
    );

    if(!res.ok){
      throw new Error("API " + res.status);
    }

    return await res.json();

  }finally{
    clearTimeout(timeout);
  }
}

function toast(message){
  const el = $("toast");

  el.textContent = message;
  el.classList.add("show");

  clearTimeout(toast.timer);

  toast.timer = setTimeout(()=>{
    el.classList.remove("show");
  },2200);
}

function setLive(ok=true){
  const el = $("liveStatus");

  if(ok){
    el.classList.remove("off");
    el.innerHTML =
      '<span class="liveDot"></span><span>LIVE</span>';
  }else{
    el.classList.add("off");
    el.innerHTML =
      '<span class="liveDot"></span><span>OFFLINE</span>';
  }
}

function getWatchlist(){
  try{
    return JSON.parse(
      localStorage.getItem("ian_watchlist") || "[]"
    );
  }catch{
    return [];
  }
}

function saveWatchlist(list){
  localStorage.setItem(
    "ian_watchlist",
    JSON.stringify(list)
  );
}

function isFavorite(symbol){
  return getWatchlist().includes(symbol);
}

function toggleFavorite(symbol){
  let list = getWatchlist();

  if(list.includes(symbol)){
    list = list.filter(x => x !== symbol);
    toast("已從自選移除");
  }else{
    list.push(symbol);
    toast("已加入自選");
  }

  saveWatchlist(list);

  if(currentPage === "watchlist"){
    renderWatchlist();
  }

  render();
}

async function loadQuotes(){

  try{

      .map(x => x[0])
      .join(",");

    const data = await api(
      "/api/quotes?symbols=" +
      encodeURIComponent(symbols)
    );

    /*
      API 現在回傳：
      [
        {
          symbol:"2330",
          name:"台積電",
          market:"TW",
          price:2480,
          previousClose:2475,
          change:5,
          changePct:.20
        }
      ]
    */

    const arr =
      Array.isArray(data)
      ? data
      : Array.isArray(data.data)
      ? data.data
      : Array.isArray(data.quotes)
      ? data.quotes
      : [];

    quotes = {};

    arr.forEach(item=>{
      if(!item || !item.symbol) return;

      quotes[String(item.symbol).toUpperCase()] = item;
    });

    setLive(arr.length > 0);

    if(arr.length === 0){
      toast("目前沒有行情資料");

    render();

  }catch(err){

    console.error(err);

    setLive(false);

    if(Object.keys(quotes).length === 0){
      toast("行情暫時無法更新");
    }

    render();
  }
}

function bindQuickSearch(){

  const input = $("quickSearch");

  if(!input) return;

  input.addEventListener("input",()=>{

    clearTimeout(searchTimer);

    const q = input.value.trim();

    if(!q){
      $("quickResults").innerHTML = "";
      return;
    }

    searchTimer = setTimeout(
      ()=>performSearch(q,"quickResults"),
      250
    );

  });

}

async function performSearch(query,targetId){

  const target = $(targetId);

  if(!target) return;

  target.innerHTML =
    `<div class="empty" style="padding:20px">
      搜尋中...
    </div>`;

  try{

    const data = await api(
      "/api/search?q=" +
      encodeURIComponent(query)
    );

    const arr =
      Array.isArray(data)
      ? data
      : Array.isArray(data.data)
      ? data.data
      : Array.isArray(data.results)
      ? data.results
      : [];

    if(!arr.length){

      target.innerHTML =
        `<div class="empty" style="padding:20px">
          找不到相關股票
        </div>`;

      return;
    }

    target.innerHTML =
      arr.slice(0,8).map(item=>{

        const symbol =
          item.symbol ||
          item.ticker ||
          item.code ||
          "";

        const name =
          item.name ||
          item.companyName ||
          item.company ||
          symbol;

        return `
          <button
            class="searchResult"
            onclick="openStock('${esc(symbol)}')"
          >
            <div class="searchResultSymbol">
              ${esc(symbol)}
            </div>

            <div class="searchResultName">
              ${esc(name)}
            </div>
          </button>
        `;

      }).join("");

  }catch(err){

    console.error(err);

    target.innerHTML =
      `<div class="empty" style="padding:20px">
        搜尋服務暫時無法使用
      </div>`;
  }
}

    Number(q.price || pos.avgPrice);

  const value =
    current * pos.qty;

  const pnl =
    (current - pos.avgPrice) *
    pos.qty;

  return `
    <div class="position">

      <div class="positionTop">

        <div>
          <div class="positionSymbol">
            ${esc(pos.symbol)}
          </div>

          <div class="positionQty">
            ${pos.qty} 股
          </div>
        </div>

        <div
          class="positionPnl ${changeClass(pnl)}"
        >
          ${pnl >= 0 ? "+" : ""}${money(pnl)}
        </div>

      </div>

      <div class="positionPrice">
        現價 ${money(current)}
      </div>

      <div class="positionQty">
        成本 ${money(pos.avgPrice)}
        · 市值 ${money(value)}
      </div>

    </div>
  `;
}

/* =========================================================
   TRADE MODAL
========================================================= */

function openTrade(symbol){

  const q = quotes[symbol] || {};

  $("modalTitle").textContent =
    `模擬交易 · ${symbol}`;

  $("modalContent").innerHTML = `

    <div
      style="
        color:var(--muted);
        font-size:13px;
        margin-bottom:12px;
      "
    >
      ${esc(q.name || STOCK_MAP[symbol]?.name || symbol)}
      · 現價 ${money(q.price)}
    </div>


    <div class="tradePanel">

      <div class="tradeTabs">

        <button
          id="buyTab"
          class="tradeTab active"
          onclick="setTradeSide('buy')"
        >
          買入
        </button>

        <button
          id="sellTab"
          class="tradeTab"
          onclick="setTradeSide('sell')"
        >
          賣出
        </button>

      </div>


      <div class="field">

        <label>
          股票代號
        </label>

        <input
          id="tradeSymbol"
          value="${esc(symbol)}"
        >

      </div>


      <div class="field">

        <label>
          數量
        </label>

        <input
          id="tradeQty"
          type="number"
          min="1"
          value="100"
        >

      </div>


      <div class="field">

        <label>
          模擬價格
        </label>

        <input
          id="tradePrice"
          type="number"
          step="0.01"
          value="${q.price || ""}"
        >

      </div>


      <button
        id="tradeAction"
        class="tradeButton"
        onclick="executeTrade()"
      >
        買入
      </button>

    </div>

  `;

  window.tradeSide = "buy";

  $("modal").classList.add("show");
}

function setTradeSide(side){

  window.tradeSide = side;

  $("buyTab").classList.toggle(
    "active",
    side === "buy"
  );

  $("sellTab").classList.toggle(
    "active",
    side === "sell"
  );

  const button = $("tradeAction");

  button.textContent =
    side === "buy"
    ? "買入"
    : "賣出";

  button.classList.toggle(
    "sell",
    side === "sell"
  );
}

function executeTrade(){

  const symbol =
    $("tradeSymbol")
    .value
    .trim()
    .toUpperCase();

  const qty =
    Number($("tradeQty").value);

  const price =
    Number($("tradePrice").value);

  if(!symbol || !qty || qty <= 0 || !price || price <= 0){
    toast("請輸入完整交易資料");
    return;
  }

  const data = getPortfolio();

  const amount =
    qty * price;

  const index =
    data.positions.findIndex(
      x => x.symbol === symbol
    );

  if(window.tradeSide === "buy"){

    if(data.cash < amount){

      toast("可用資金不足");
      return;

    }

    data.cash -= amount;

    if(index >= 0){

      const p =
        data.positions[index];

      const totalCost =
        p.avgPrice * p.qty +
        price * qty;

      p.qty += qty;

      p.avgPrice =
        totalCost / p.qty;

    }else{

      data.positions.push({
        symbol,
        qty,
        avgPrice:price
      });

    }

    toast(`已模擬買入 ${symbol}`);

  }else{

    if(index < 0){

      toast("沒有這檔持倉");
      return;

    }

    const p =
      data.positions[index];

    if(p.qty < qty){

      toast("持倉數量不足");
      return;

    }

    p.qty -= qty;

    data.cash += amount;

    if(p.qty === 0){
      data.positions.splice(index,1);
    }

    toast(`已模擬賣出 ${symbol}`);
  }

  savePortfolio(data);

  closeModal();

  render();
}

function closeModal(){
  $("modal").classList.remove("show");
}

/* =========================================================
   NAVIGATION
========================================================= */

function setPage(page){

  currentPage = page;

  document
    .querySelectorAll(".navBtn")
    .forEach(btn=>{
      btn.classList.toggle(
        "active",
        btn.dataset.page === page
      );
    });

  if(page === "home"){
    renderHome();
  }

  if(page === "search"){
    renderSearch();
  }

  if(page === "watchlist"){
    renderWatchlist();
  }

  if(page === "portfolio"){
    renderPortfolio();
  }

  if(page === "paper"){
    renderPaper();

  }

  window.scrollTo({
    top:0,
    behavior:"instant"
  });
}

document
  .querySelectorAll(".navBtn")
  .forEach(btn=>{
    btn.addEventListener(
      "click",
      ()=>setPage(btn.dataset.page)
    );
  });

function goBack(){
  setPage("home");
}

/* =========================================================
   RENDER
========================================================= */

function render(){

  if(currentSymbol && document.querySelector(".detailHero")){
    return;
  }

  if(currentPage === "home"){
    renderHome();
  }

  if(currentPage === "search"){
    renderSearch();
  }

  if(currentPage === "watchlist"){
    renderWatchlist();
  }

  if(currentPage === "portfolio"){
    renderPortfolio();
  }

  if(currentPage === "paper"){
    renderPaper();
  }
}
