<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>IAN STOCK V3</title>
<style>
:root{--bg:#07111f;--panel:#0d1b2d;--line:#20334b;--text:#edf5ff;--muted:#8ea4bd;--blue:#5aa9ff;--up:#20c997;--down:#ff647c;--gold:#ffd36b}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07111f,#0a1725);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:1200px;margin:auto;min-height:100vh;padding-bottom:80px}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:17px 20px;background:#07111ff2;border-bottom:1px solid var(--line);backdrop-filter:blur(15px)}
.logo{font-weight:900;font-size:21px;letter-spacing:1px}.logo span{color:var(--blue)}.status{font-size:11px;color:var(--gold);border:1px solid #6d5a25;border-radius:999px;padding:5px 9px}
main{padding:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.wide{grid-column:span 2}.card{background:#0d1b2df2;border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 12px 35px #0002;margin-bottom:14px}
h1,h2,h3{margin:0 0 10px}.muted{color:var(--muted)}.big{font-size:32px;font-weight:800}.up{color:var(--up)}.down{color:var(--down)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.btn{border:0;border-radius:11px;padding:10px 14px;background:var(--blue);color:#06111d;font-weight:750}.secondary{background:#162a43;color:#dbeaff}
.search{display:flex;gap:8px}.search input,.trade input,.trade select{width:100%;background:#091625;color:#fff;border:1px solid var(--line);border-radius:10px;padding:11px}
.stock{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}.stock:last-child{border-bottom:0}
.metric{background:#0a1726;border:1px solid var(--line);border-radius:12px;padding:11px;margin:8px 0}.metric b{display:block;font-size:18px;margin-top:3px}
.chart{height:230px;display:flex;align-items:end;gap:4px;padding:15px 4px 8px;background:#091624;border-radius:13px;margin-top:12px}.bar{flex:1;border-radius:4px 4px 1px 1px;background:linear-gradient(180deg,#65b4ff,#2467bd)}
.tabs{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}.tab{padding:7px 10px;border:1px solid var(--line);border-radius:999px;color:#a9bfd8;background:#0a1726}.tab.active{background:#173454;color:#fff}
.trade{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.notice{padding:10px 12px;border:1px solid #20334b;border-radius:12px;background:#091625;color:#a9bfd8;margin-top:10px;font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;justify-content:center;background:#07111ff7;border-top:1px solid var(--line);backdrop-filter:blur(15px)}
nav button{flex:1;max-width:220px;border:0;background:none;color:#8198b1;padding:10px 5px}nav button.active{color:#fff}nav small{display:block}
@media(max-width:800px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.trade{grid-template-columns:1fr}.big{font-size:28px}}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">IAN <span>STOCK</span></div><div id="status" class="status">行情連線中…</div></header>
<main id="app"></main>
<nav>
<button data-p="home">⌂<small>首頁</small></button><button data-p="search">⌕<small>搜尋</small></button>
<button data-p="watch">☆<small>自選</small></button><button data-p="portfolio">◒<small>投資組合</small></button><button data-p="trade">↕<small>模擬交易</small></button>
</nav>
</div>
<script>
const API_BASE = ""; // GitHub Pages 會使用同網域；若後端在別處，把這裡改成你的 API 網址
const seed=[
{t:"2330",n:"台積電",m:"TW",p:null,ch:null},{t:"2317",n:"鴻海",m:"TW",p:null,ch:null},
{t:"2454",n:"聯發科",m:"TW",p:null,ch:null},{t:"NVDA",n:"NVIDIA",m:"US",p:null,ch:null},
{t:"AAPL",n:"Apple",m:"US",p:null,ch:null},{t:"MSFT",n:"Microsoft",m:"US",p:null,ch:null}];
let stocks=[...seed],S={page:"home",watch:["2330","NVDA"],cash:1000000,pos:{},selected:"2330"};
const $=x=>document.getElementById(x);
const money=n=>new Intl.NumberFormat("zh-TW",{style:"currency",currency:"TWD",maximumFractionDigits:0}).format(n||0);
const fmt=(n)=>n==null?"—":Number(n).toLocaleString(undefined,{maximumFractionDigits:2});
const get=t=>stocks.find(s=>s.t===t)||seed.find(s=>s.t===t)||seed[0];
function setStatus(ok,text){$("status").textContent=text;$("status").style.color=ok?"#20c997":"#ffd36b";}
function value(){return S.cash+Object.entries(S.pos).reduce((a,[t,p])=>a+p.qty*(get(t).p||0),0)}
function profit(){return value()-1000000}
function stock(s){return `<div class="stock" onclick="selectStock('${s.t}')"><div><b>${s.t}</b> <span class="muted">${s.n}</span></div><div><b>${fmt(s.p)}</b><div class="${(s.ch??0)>=0?'up':'down'}">${s.ch==null?"等待行情":((s.ch>=0?"+":"")+fmt(s.ch)+"%")}</div></div></div>`}
function chart(){return '<div class="chart">'+Array.from({length:42},(_,i)=>'<div class="bar" style="height:'+(35+(i*29)%150)+'px"></div>').join('')+'</div>'}
function selectStock(t){S.selected=t;S.page="home";render()}
function render(){
document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.p===S.page));
if(S.page==="home"){
let s=get(S.selected);
$("app").innerHTML=`<div class="grid">
<div class="card wide"><div class="row"><div><div class="muted">IAN AI 市場脈動</div><h1>看懂市場，不只看價格</h1></div><span class="status">LIVE DATA</span></div>
<p class="muted">台股 / 美股行情、技術指標、基本資料與模擬投資集中在同一個介面。</p>
<button class="btn" onclick="S.page='search';render()">搜尋股票</button>
<button class="btn secondary" onclick="S.page='trade';render()">模擬交易</button>
<div class="notice">價格不再寫死。網站會從你的行情後端取得資料；沒有行情服務時顯示「等待行情」，避免把假價格當成真價格。</div></div>
<div class="card"><div class="muted">模擬總資產</div><div class="big">${money(value())}</div><div class="${profit()>=0?'up':'down'}">${profit()>=0?'+':''}${money(profit())}</div></div></div>
<div class="grid"><div class="card wide"><div class="row"><h2>市場焦點</h2><span class="muted">TW / US</span></div>${stocks.slice(0,6).map(stock).join('')}</div>
<div class="card"><h2>IAN AI Radar</h2><div class="metric">Trend<b>等待行情資料</b></div><div class="metric">Momentum<b>等待行情資料</b></div><div class="metric">Risk<b>資料同步後計算</b></div></div></div>
<div class="grid"><div class="card wide"><div class="row"><div><h2>${s.t} ${s.n}</h2><div class="${(s.ch??0)>=0?'up':'down'}">${fmt(s.p)} · ${s.ch==null?"等待行情":((s.ch>=0?"+":"")+fmt(s.ch)+"%")}</div></div><button class="btn" onclick="S.page='trade';render()">模擬下單</button></div>${chart()}<div class="tabs"><span class="tab active">1D</span><span class="tab">1W</span><span class="tab">1M</span><span class="tab">1Y</span></div></div>
<div class="card"><h2>技術分析</h2><div class="metric">MA5<b>—</b></div><div class="metric">MA20<b>—</b></div><div class="metric">MA60<b>—</b></div><div class="metric">RSI<b>—</b></div><div class="metric">MACD<b>—</b></div></div></div>`;
}
else if(S.page==="search"){
$("app").innerHTML=`<div class="card"><h2>搜尋台股 / 美股</h2><div class="search"><input id="q" placeholder="2330、NVDA、台積電、Apple"><button class="btn" onclick="doSearch()">搜尋</button></div><div id="results" style="margin-top:10px">${stocks.map(stock).join('')}</div>
<div class="notice">搜尋結果與即時價格由行情 API 提供；API 金鑰不要放在這個公開 GitHub 網站。</div></div>`;
}
else if(S.page==="watch"){$("app").innerHTML=`<div class="card"><h2>自選股</h2>${S.watch.map(t=>get(t)).map(stock).join('')}</div>`}
else if(S.page==="portfolio"){
$("app").innerHTML=`<div class="grid"><div class="card"><div class="muted">總資產</div><div class="big">${money(value())}</div></div><div class="card"><div class="muted">現金</div><div class="big">${money(S.cash)}</div></div><div class="card"><div class="muted">報酬率</div><div class="big">${(profit()/1000000*100).toFixed(2)}%</div></div></div>
<div class="card"><h2>持倉</h2>${Object.keys(S.pos).length?Object.entries(S.pos).map(([t,p])=>{let s=get(t),pl=p.qty*(s.p||0)-p.cost;return `<div class="stock"><div><b>${t}</b> ${s.n}<div class="muted">${p.qty} 股 · 成本 ${money(p.cost)}</div></div><div class="${pl>=0?'up':'down'}">${pl>=0?'+':''}${money(pl)}</div></div>`}).join(''):'<p class="muted">目前沒有持倉。</p>'}</div>`;
}
else{
$("app").innerHTML=`<div class="grid"><div class="card wide trade"><div><h2>模擬交易</h2><p class="muted">虛擬本金 NT$1,000,000，不連接券商、不會真的扣款。</p></div><div></div>
<div><select id="sym">${stocks.map(s=>`<option>${s.t}</option>`).join('')}</select></div><div><input id="qty" type="number" value="100" min="1"></div>
<div class="actions"><button class="btn" onclick="trade(1)">買進</button><button class="btn secondary" onclick="trade(0)">賣出</button></div><div id="msg" class="muted"></div></div>
<div class="card"><h2>交易資料</h2><p class="muted">目前為模擬交易。正式版可再加入限價單、停損、停利、手續費、交易稅與交易紀錄。</p></div></div>`;
}}
function doSearch(){let q=$("q").value.toLowerCase().trim();let a=stocks.filter(s=>(s.t+s.n).toLowerCase().includes(q));$("results").innerHTML=a.length?a.map(stock).join(''):'<p class="muted">目前資料源沒有找到。</p>'}
function trade(buy){let t=$("sym").value,q=Math.max(1,Number($("qty").value)||1),s=get(t),price=s.p,m=$("msg");if(price==null){m.textContent="目前沒有可用行情，不能以假價格下單。";return}let amt=q*price;if(buy){if(S.cash<amt){m.textContent="現金不足";return}S.cash-=amt;S.pos[t]??={qty:0,cost:0};S.pos[t].qty+=q;S.pos[t].cost+=amt;m.textContent="已買進 "+t+" "+q+" 股，模擬成交 "+fmt(amt)}else{let p=S.pos[t];if(!p||p.qty<q){m.textContent="持股不足";return}let avg=p.cost/p.qty;S.cash+=amt;p.qty-=q;p.cost-=avg*q;if(!p.qty)delete S.pos[t];m.textContent="已賣出 "+t+" "+q+" 股，模擬成交 "+fmt(amt)}render()}
async function loadQuotes(){
try{
let r=await fetch(API_BASE+"/api/quotes"); if(!r.ok) throw new Error("API");
let data=await r.json(); if(!Array.isArray(data)) throw new Error("DATA");
for(const q of data){let s=get(q.symbol);if(s){s.p=q.price??null;s.ch=q.changePct??null}}
setStatus(true,"LIVE DATA · 已同步");render();
}catch(e){setStatus(false,"WAITING DATA · 尚未連線");render();}
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{S.page=b.dataset.p;render()});
render();loadQuotes();setInterval(loadQuotes,60000);
</script>
</body></html>
