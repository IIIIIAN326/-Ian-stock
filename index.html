<!DOCTYPE html>
<html lang="zh-TW">

<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#05080d">

<title>IAN STOCK</title>

<style>

/* =========================================================
   IAN STOCK V12
   Premium Animated Market Interface
   ========================================================= */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  background:#05080d;
  color:#f5f7fa;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;
}

body{
  min-height:100vh;
  overflow-x:hidden;
  padding-bottom:95px;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}


/* =========================================================
   ANIMATED MAP BACKGROUND
   ========================================================= */

#mapBackground{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  overflow:hidden;
  opacity:.42;
}

.map-grid{
  position:absolute;
  inset:0;

  background-image:
    linear-gradient(
      rgba(55,214,122,.045) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(55,214,122,.045) 1px,
      transparent 1px
    );

  background-size:42px 42px;

  transform:
    perspective(700px)
    rotateX(55deg)
    scale(1.5);

  transform-origin:center bottom;

  animation:gridMove 14s linear infinite;
}

@keyframes gridMove{
  from{
    background-position:0 0;
  }

  to{
    background-position:0 420px;
  }
}

.map-glow{
  position:absolute;
  width:700px;
  height:700px;
  left:50%;
  top:38%;
  transform:translate(-50%,-50%);

  background:
    radial-gradient(
      circle,
      rgba(55,214,122,.13) 0%,
      rgba(55,214,122,.04) 32%,
      transparent 68%
    );

  animation:glowPulse 5s ease-in-out infinite;
}

@keyframes glowPulse{
  0%,100%{
    opacity:.55;
    transform:translate(-50%,-50%) scale(.9);
  }

  50%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.12);
  }
}

.world{
  position:absolute;
  width:100%;
  height:100%;
  opacity:.32;
}

.world path{
  fill:none;
  stroke:#37d67a;
  stroke-width:1;
  stroke-linejoin:round;
}

.route{
  fill:none;
  stroke:#37d67a;
  stroke-width:1.5;
  stroke-dasharray:5 12;
  animation:routeMove 5s linear infinite;
}

@keyframes routeMove{
  to{
    stroke-dashoffset:-100;
  }
}

.node{
  position:absolute;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#37d67a;
  box-shadow:
    0 0 8px #37d67a,
    0 0 25px rgba(55,214,122,.65);

  animation:nodePulse 2.4s ease-in-out infinite;
}

.node::after{
  content:"";
  position:absolute;
  inset:-8px;
  border:1px solid rgba(55,214,122,.35);
  border-radius:50%;
  animation:ring 2.4s ease-out infinite;
}

@keyframes nodePulse{
  0%,100%{
    opacity:.55;
  }

  50%{
    opacity:1;
  }
}

@keyframes ring{
  from{
    transform:scale(.5);
    opacity:1;
  }

  to{
    transform:scale(2.5);
    opacity:0;
  }
}

.node-tw{
  left:78%;
  top:43%;
}

.node-us{
  left:19%;
  top:35%;
}

.node-eu{
  left:50%;
  top:29%;
}

.node-jp{
  left:85%;
  top:37%;
}

.node-sg{
  left:72%;
  top:62%;
}


/* =========================================================
   APP
   ========================================================= */

.app{
  position:relative;
  z-index:2;

  width:min(900px,100%);
  margin:auto;

  padding:
    18px
    16px
    120px;
}


/* =========================================================
   HEADER
   ========================================================= */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;

  margin-bottom:18px;
}

.logo{
  font-size:29px;
  font-weight:950;
  letter-spacing:.5px;
}

.logo span{
  color:#37d67a;
}

.logo-sub{
  color:#68727f;
  font-size:10px;
  letter-spacing:2px;
  margin-top:2px;
}

.status{
  border:1px solid rgba(55,214,122,.25);
  background:rgba(16,31,23,.75);
  color:#37d67a;

  padding:7px 11px;

  border-radius:20px;

  font-size:11px;
  font-weight:800;

  white-space:nowrap;

  backdrop-filter:blur(12px);
}

.status.error{
  color:#ff5964;
  border-color:rgba(255,89,100,.25);
  background:rgba(45,17,20,.75);
}


/* =========================================================
   GLASS
   ========================================================= */

.glass{
  background:
    linear-gradient(
      135deg,
      rgba(18,24,32,.9),
      rgba(10,14,20,.86)
    );

  border:1px solid rgba(100,116,135,.18);

  box-shadow:
    0 18px 50px rgba(0,0,0,.22),
    inset 0 1px 0 rgba(255,255,255,.025);

  backdrop-filter:blur(18px);
}


/* =========================================================
   SEARCH
   ========================================================= */

.search{
  display:flex;
  gap:8px;
  margin-bottom:13px;
}

.search input{
  flex:1;
  min-width:0;

  border:1px solid #252e39;

  background:rgba(12,17,24,.88);

  color:#fff;

  border-radius:15px;

  padding:13px 15px;

  outline:none;

  transition:.2s;
}

.search input:focus{
  border-color:#37d67a;
  box-shadow:
    0 0 0 3px rgba(55,214,122,.08);
}

.search button{
  border:0;

  border-radius:15px;

  padding:0 18px;

  background:#37d67a;

  color:#041009;

  font-weight:900;

  transition:.15s;
}

.search button:active{
  transform:scale(.95);
}


/* =========================================================
   SEARCH RESULT
   ========================================================= */

.search-result{
  margin-bottom:14px;
}


/* =========================================================
   MARKET TABS
   ========================================================= */

.tabs{
  display:flex;
  gap:7px;

  overflow-x:auto;

  padding-bottom:2px;

  scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tab{
  border:1px solid #252e39;

  background:rgba(15,20,27,.8);

  color:#8993a0;

  border-radius:20px;

  padding:8px 15px;

  white-space:nowrap;

  transition:.18s;
}

.tab.active{
  color:#06100a;
  background:#37d67a;
  border-color:#37d67a;
  font-weight:800;
}


/* =========================================================
   SECTION
   ========================================================= */

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin:24px 0 11px;
}

.section-title h2{
  margin:0;
  font-size:18px;
}

.section-title small{
  color:#707b88;
}


/* =========================================================
   MARKET CARDS
   ========================================================= */

.market-grid{
  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:9px;
}

.market-card{
  padding:14px 12px;

  border-radius:17px;

  cursor:pointer;

  transition:
    transform .18s,
    border-color .18s;

  position:relative;
  overflow:hidden;
}

.market-card::before{
  content:"";

  position:absolute;

  width:80px;
  height:80px;

  right:-35px;
  top:-35px;

  background:
    radial-gradient(
      circle,
      rgba(55,214,122,.18),
      transparent 70%
    );
}

.market-card:active{
  transform:scale(.97);
}

.market-name{
  color:#8b95a3;
  font-size:11px;
}

.market-symbol{
  color:#5e6875;
  font-size:10px;
  margin-top:2px;
}

.market-price{
  font-size:18px;
  font-weight:900;
  margin-top:7px;
}

.market-change{
  font-size:12px;
  margin-top:3px;
}


/* =========================================================
   STOCK LIST
   ========================================================= */

.stock-list{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.stock{
  padding:15px;

  border-radius:17px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  cursor:pointer;

  transition:
    transform .15s,
    border-color .15s;
}

.stock:active{
  transform:scale(.985);
}

.stock-left{
  display:flex;
  flex-direction:column;
  gap:4px;
}

.stock-symbol{
  font-size:16px;
  font-weight:900;
}

.stock-name{
  color:#7d8794;
  font-size:12px;
}

.stock-right{
  text-align:right;
}

.stock-price{
  font-size:16px;
  font-weight:900;
}

.stock-change{
  font-size:12px;
  margin-top:3px;
}


/* =========================================================
   COLORS
   ========================================================= */

.up{
  color:#37d67a;
}

.down{
  color:#ff5964;
}

.wait{
  color:#717b87;
}


/* =========================================================
   DETAIL
   ========================================================= */

.detail-top{
  margin-bottom:14px;
}

.back{
  border:1px solid #293340;

  background:rgba(17,23,31,.9);

  color:white;

  border-radius:13px;

  padding:10px 15px;

  margin-bottom:15px;
}

.back:active{
  transform:scale(.96);
}

.detail-head{
  padding:19px;
  border-radius:20px;
}

.detail-symbol{
  color:#8a94a2;
  font-size:13px;
}

.detail-name{
  font-size:28px;
  font-weight:950;
  margin-top:4px;
}

.detail-price{
  font-size:38px;
  font-weight:950;
  margin-top:15px;
  letter-spacing:-1px;
}

.detail-change{
  font-size:14px;
  margin-top:3px;
}


/* =========================================================
   ACTION BUTTON
   ========================================================= */

.action-row{
  display:flex;
  gap:8px;
  margin-top:13px;
}

.action{
  flex:1;

  border:0;

  border-radius:12px;

  padding:11px;

  font-weight:850;
}

.action.green{
  background:#37d67a;
  color:#06100a;
}

.action.red{
  background:#ff5964;
  color:white;
}

.action.dark{
  background:#222b36;
  color:#fff;
}

.action:active{
  transform:scale(.97);
}


/* =========================================================
   AI SCORE
   ========================================================= */

.score-box{
  margin-top:12px;
  padding:18px;
  border-radius:20px;
}

.score-label{
  color:#858f9c;
  font-size:11px;
  letter-spacing:1px;
}

.score{
  font-size:44px;
  line-height:1.05;
  font-weight:950;
  margin-top:5px;
}

.score span{
  color:#65707d;
  font-size:15px;
}

.score-bar{
  height:6px;

  background:#202832;

  border-radius:10px;

  overflow:hidden;

  margin-top:12px;
}

.score-fill{
  height:100%;

  background:
    linear-gradient(
      90deg,
      #37d67a,
      #b6ffd0
    );

  border-radius:10px;

  transition:width .7s ease;
}

.score-note{
  color:#697481;
  font-size:11px;
  margin-top:8px;
}


/* =========================================================
   TECH
   ========================================================= */

.tech-grid{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:9px;
}

.tech{
  padding:14px;

  border-radius:17px;

  cursor:pointer;

  transition:
    transform .15s,
    border-color .15s;
}

.tech:active{
  transform:scale(.97);
}

.tech-label{
  color:#7d8794;
  font-size:11px;
}

.tech-value{
  font-size:18px;
  font-weight:900;
  margin-top:5px;
}


/* =========================================================
   ANALYSIS
   ========================================================= */

.analysis{
  padding:15px;
  border-radius:18px;
}

.analysis-row{
  display:flex;
  justify-content:space-between;

  gap:15px;

  padding:11px 0;

  border-bottom:1px solid #252e38;
}

.analysis-row:last-child{
  border-bottom:0;
}

.analysis-label{
  color:#818b98;
}


/* =========================================================
   CHART
   ========================================================= */

.chart{
  padding:12px;
  border-radius:18px;
  overflow:hidden;
}

canvas{
  width:100%;
  height:280px;
  display:block;
}


/* =========================================================
   WATCHLIST
   ========================================================= */

.watch-remove{
  border:0;

  width:32px;
  height:32px;

  border-radius:10px;

  background:#202832;

  color:#ff5964;

  font-size:18px;
}


/* =========================================================
   PORTFOLIO
   ========================================================= */

.portfolio-card{
  padding:18px;
  border-radius:20px;
}

.portfolio-label{
  color:#818b98;
  font-size:11px;
}

.portfolio-total{
  font-size:31px;
  font-weight:950;
  margin-top:4px;
}

.portfolio-pnl{
  font-size:13px;
  margin-top:5px;
}

.portfolio-item-info{
  display:flex;
  flex-direction:column;
  gap:4px;
}


/* =========================================================
   AI PAGE
   ========================================================= */

.ai-select{
  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:8px;
}

.ai-stock{
  border:1px solid #252e39;

  background:#11171f;

  color:#fff;

  border-radius:14px;

  padding:12px 7px;

  text-align:center;

  font-weight:800;
}

.ai-stock.active{
  border-color:#37d67a;
  background:rgba(55,214,122,.1);
  color:#37d67a;
}

.ai-box{
  padding:17px;

  border-radius:18px;

  margin-bottom:10px;
}

.ai-title{
  font-size:17px;
  font-weight:900;
}

.ai-text{
  color:#858f9b;
  line-height:1.7;
  font-size:13px;
  margin-top:8px;
}


/* =========================================================
   EMPTY
   ========================================================= */

.empty{
  text-align:center;

  color:#6f7986;

  padding:45px 15px;

  border:1px dashed #28313c;

  border-radius:18px;

  background:rgba(13,18,25,.55);
}


/* =========================================================
   MODAL
   ========================================================= */

.modal-bg{
  position:fixed;

  inset:0;

  z-index:100;

  background:rgba(0,0,0,.7);

  backdrop-filter:blur(7px);

  display:flex;

  align-items:flex-end;
}

.modal{
  width:min(900px,100%);

  max-height:88vh;

  overflow:auto;

  margin:auto;

  background:#11171f;

  border:1px solid #2b3541;

  border-radius:24px 24px 0 0;

  padding:20px;
}

.modal-head{
  display:flex;

  justify-content:space-between;

  align-items:center;
}

.modal-head h2{
  margin:0;
}

.close{
  width:36px;
  height:36px;

  border:0;

  border-radius:50%;

  background:#242d38;

  color:white;

  font-size:22px;
}

.form{
  display:grid;
  gap:9px;
  margin-top:15px;
}

.form input{
  border:1px solid #293440;

  background:#090e14;

  color:#fff;

  border-radius:12px;

  padding:12px;

  outline:none;
}

.form input:focus{
  border-color:#37d67a;
}

.modal-info{
  color:#7d8794;

  line-height:1.7;

  font-size:13px;

  margin-top:10px;
}


/* =========================================================
   TOAST
   ========================================================= */

.toast{
  position:fixed;

  left:50%;

  bottom:100px;

  transform:translateX(-50%);

  z-index:200;

  background:#202934;

  color:white;

  border:1px solid #34404d;

  border-radius:13px;

  padding:10px 15px;

  font-size:12px;

  box-shadow:0 10px 30px rgba(0,0,0,.4);
}


/* =========================================================
   BOTTOM NAV
   ========================================================= */

.bottom{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:50;

  background:
    rgba(5,8,13,.94);

  backdrop-filter:blur(20px);

  border-top:1px solid #202933;

  padding-bottom:
    env(safe-area-inset-bottom);
}

.bottom-inner{
  width:min(900px,100%);

  margin:auto;

  display:flex;

  justify-content:space-around;

  padding:9px 4px;
}

.nav{
  appearance:none;
  -webkit-appearance:none;

  border:0;
  outline:0;

  background:transparent;

  color:#6e7885;

  min-width:58px;

  padding:5px 7px;

  border-radius:12px;

  text-align:center;

  font-size:10px;

  cursor:pointer;

  transition:.15s;
}

.nav:active{
  transform:scale(.9);
}

.nav.active{
  color:#37d67a;

  background:
    rgba(55,214,122,.06);
}

.nav-icon{
  font-size:21px;
  line-height:23px;
  margin-bottom:2px;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:520px){

  .market-grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

  .ai-select{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

  .detail-price{
    font-size:34px;
  }

}

</style>
</head>

<script>

/* =========================================================

const API_BASE =

/* =========================================================

const STOCKS = [

  {symbol:"2357",name:"華碩",market:"TW"},

  {symbol:"NVDA",name:"NVIDIA",market:"US"},

  {symbol:"AMZN",name:"Amazon",market:"US"},

  {symbol:"META",name:"Meta",market:"US"},

  {symbol:"AVGO",name:"Broadcom",market:"US"},

let quotes = [];

let currentSymbol = null;

let currentMarket = "ALL";


/* =========================================================

   ========================================================= */

let watchlist =
  JSON.parse(
    localStorage.getItem("ian_watchlist") || "[]"
  );


let portfolio =
  JSON.parse(
    localStorage.getItem("ian_portfolio") || "[]"
  );


/* =========================================================
   HELPERS
   ========================================================= */

function money(value){

  if(
    value === null ||
    value === undefined ||
    !Number.isFinite(Number(value))
  ){
    return "--";
  }

  return Number(value)
    .toLocaleString(
      "zh-TW",
      {
        maximumFractionDigits:2
      }
    );

}


function percent(value){

  if(
    value === null ||
    value === undefined ||
    !Number.isFinite(Number(value))
  ){
    return "--";
  }

  const n = Number(value);

  return (
    n >= 0 ? "+" : ""
  ) +
  n.toFixed(2) +
  "%";

}


function getStock(symbol){

  return STOCKS.find(
    x =>
      x.symbol.toUpperCase() ===
      String(symbol).toUpperCase()
  );

}


function getQuote(symbol){

  return quotes.find(
    x =>
      String(x.symbol).toUpperCase() ===
      String(symbol).toUpperCase()
  );

}


function showToast(message){

  const el =
    document.getElementById("toast");

  el.textContent = message;

  el.classList.remove("hidden");

  clearTimeout(window.__toastTimer);

  window.__toastTimer =
    setTimeout(
      () => {
        el.classList.add("hidden");
      },
      1800
    );

}


/* =========================================================
   API
   ========================================================= */

async function api(path){

  const response =
    await fetch(
      API_BASE + path,
      {
        cache:"no-store"
      }
    );

  if(!response.ok){

    throw new Error(
      "API " + response.status
    );

  }

  return response.json();

}


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(ok){

  const el =
    document.getElementById(
      "apiStatus"

  if(ok){

      "● LIVE DATA";

    el.className =
      "status";

  }else{

    el.textContent =
      "API ERROR";

    el.className =
      "status error";

  }

}


/* =========================================================

   ========================================================= */

function hideAllPages(){

    "detailPage",
    "watchPage",
    "portfolioPage",

    id =>

        .getElementById(id)
        .classList
        .add("hidden")
  );


  document
    .querySelectorAll(".nav")
    .forEach(
      el =>
        el.classList.remove("active")
    );

}


function goPage(page){

  hideAllPages();


  if(page === "home"){

    document
      .getElementById("homePage")

      .remove("hidden");

    document
      .getElementById("navHome")
      .classList
      .add("active");

    loadQuotes();

    document
      .getElementById("watchPage")

      .remove("hidden");

    document
      .getElementById("navWatch")
      .classList
      .add("active");

    renderWatchlist();

  if(page === "portfolio"){

   ========================================================= */

function focusSearch(){

/* =========================================================
   HOME DATA
   ========================================================= */

async function loadQuotes(){

  try{

    const data =
      await api("/api/quotes");

    if(!Array.isArray(data)){

      throw new Error(
        "資料格式錯誤"

    }

    setStatus(true);

    renderMarket();

    renderStocks();

    renderWatchlist();

      "updateTime"

/* =========================================================

   ========================================================= */

function setMarket(market,button){

/* =========================================================

   ========================================================= */

function renderMarket(){

  let list =

      stock =>

        stock.market === currentMarket

  box.innerHTML =
    list
      .map(
        stock => {

          const q =

          const change =
            q?.changePct;

          return `

            <div
              class="market-card glass"
              onclick="openStock('${stock.symbol}')">

              <div class="market-name">
                ${stock.name}
              </div>

                ${stock.symbol} · ${stock.market}

              <div class="market-price">
                ${money(q?.price)}

              <div
                class="market-change ${
                  change === null ||
                  change === undefined
                  ? "wait"
                  : change >= 0
                    ? "up"
                    : "down"
                }">

                ${percent(change)}

              </div>

            </div>

          `;

        }

   STOCK LIST

function renderStocks(){

/* =========================================================
   SEARCH
   ========================================================= */

async function searchStock(){

  const input =
    document.getElementById(
      "searchInput"
    );

  const query =
    input.value
      .trim();

  const box =
    document.getElementById(
      "searchResult"
    );


  if(!query){

    box.innerHTML="";

    return;

  }


  const q =
    query.toLowerCase();


  let local =
    STOCKS.filter(
      stock =>
        stock.symbol
          .toLowerCase()
          .includes(q) ||
        stock.name
          .toLowerCase()
          .includes(q)
    );


  try{

    const apiResult =
      await api(
        "/api/search?q=" +
        encodeURIComponent(query)
      );


    for(const item of apiResult){

      if(
        !local.some(
          x =>
            x.symbol === item.symbol
        )
      ){

        local.push(item);

      }

    }

  }catch(error){

    console.log(
      "API search fallback"
    );

  }


  /*
    如果使用者直接輸入股票代號，
    即使清單裡沒有，也允許直接開啟。
  */

  const direct =
    query
      .toUpperCase();


  if(
    local.length === 0 &&
    /^[A-Z]{1,6}$/.test(direct)
  ){

    local.push({
      symbol:direct,
      name:direct,
      market:"US"
    });

  }


  if(
    local.length === 0 &&
    /^\d{4,6}$/.test(direct)
  ){

    local.push({
      symbol:direct,
      name:direct,
      market:"TW"
    });

  }


  if(!local.length){

    box.innerHTML =
      `<div class="empty">
        找不到股票
      </div>`;

    return;

  }


  box.innerHTML = `

    <div class="section-title">

      <h2>
        搜尋結果
      </h2>

    </div>

    <div class="stock-list">

      ${
        local
          .slice(0,20)
          .map(
            stock => `

              <div
                class="stock glass"
                onclick="openStock('${stock.symbol}')">

                <div class="stock-left">

                  <div class="stock-symbol">
                    ${stock.symbol}
                  </div>

                  <div class="stock-name">
                    ${stock.name}
                  </div>

                </div>

                <div>
                  ${stock.market || ""}
                </div>

              </div>

            `
          )
          .join("")
      }

    </div>

  `;

}

}

/* =========================================================
   TECH CARD
   ========================================================= */

function tech(label,value){

  let display =
    (
      value === null ||
      value === undefined ||
      !Number.isFinite(
        Number(value)
      )
    )
    ? "--"
    : Number(value)
        .toLocaleString(
          "zh-TW",
          {
            maximumFractionDigits:2
          }
        );


  return `

    <div
      class="tech glass"
      onclick="indicatorInfo('${label}')">

      <div class="tech-label">
        ${label}
      </div>

      <div class="tech-value">
        ${display}
      </div>

    </div>

  `;

}


function analysisRow(label,value){

  return `

    <div class="analysis-row">

      <span class="analysis-label">
        ${label}
      </span>

      <strong>
        ${value ?? "--"}
      </strong>

    </div>

  `;

}

  `);

}


/* =========================================================
   CHART
   ========================================================= */

function drawChart(history){

  const canvas =
    document.getElementById(
      "priceCanvas"
    );

  if(!canvas){
    return;
  }


  const rect =
    canvas.getBoundingClientRect();


  const width =
    Math.max(
      280,
      rect.width
    );


  const height =
    280;


  const dpr =
    window.devicePixelRatio || 1;


  canvas.width =
    width * dpr;

  canvas.height =
    height * dpr;


  const ctx =
    canvas.getContext("2d");


  ctx.scale(
    dpr,
    dpr
  );


  const values =
    history
      .map(
        x => Number(x.close)
      )
      .filter(
        Number.isFinite
      )
      .slice(-100);


  if(values.length < 2){

    ctx.fillStyle =
      "#707b88";

    ctx.font =
      "13px sans-serif";

    ctx.fillText(
      "歷史資料不足",
      15,
      35
    );

    return;

  }


  const min =
    Math.min(...values);

  const max =
    Math.max(...values);

  const range =
    max - min || 1;


  /*
    背景水平線
  */

  ctx.strokeStyle =
    "rgba(120,140,160,.10)";

  ctx.lineWidth=1;


  for(let i=1;i<5;i++){

    const y =
      i *
      (height/5);

    ctx.beginPath();

    ctx.moveTo(
      0,
      y
    );

    ctx.lineTo(
      width,
      y
    );

    ctx.stroke();

  }


  /*
    價格線
  */

  ctx.beginPath();


  values.forEach(
    (value,index)=>{

      const x =
        10 +
        index *
        (
          (width-20) /
          (values.length-1)
        );


      const y =
        height -
        20 -
        (
          (value-min) /
          range
        ) *
        (height-40);


      if(index===0){

        ctx.moveTo(
          x,
          y
        );

      }else{

        ctx.lineTo(
          x,
          y
        );

      }

    }
  );


  ctx.strokeStyle =
    "#37d67a";

  ctx.lineWidth=2.3;

  ctx.stroke();


  /*
    最新價格
  */

  const latest =
    values[values.length-1];


  const latestY =
    height -
    20 -
    (
      (latest-min) /
      range
    ) *
    (height-40);


  ctx.fillStyle =
    "#37d67a";


  ctx.beginPath();

  ctx.arc(
    width-10,
    latestY,
    4,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle =
    "#7e8997";

  ctx.font =
    "11px sans-serif";


  ctx.fillText(
    money(max),
    10,
    15
  );


  ctx.fillText(
    money(min),
    10,
    height-4
  );


  ctx.fillStyle =
    "#f5f7fa";

  ctx.fillText(
    money(latest),
    width-70,
    Math.max(
      15,
      latestY-8
    )
  );

}


/* =========================================================
   WATCHLIST
   ========================================================= */

function saveWatchlist(){

  localStorage.setItem(
    "ian_watchlist",
    JSON.stringify(
      watchlist
    )
  );

}


function toggleWatch(symbol){

  symbol =
    String(symbol)
      .toUpperCase();


  if(
    watchlist.includes(symbol)
  ){

    watchlist =
      watchlist.filter(
        x => x !== symbol
      );

    showToast(
      "已移除自選"
    );

  }else{

    watchlist.push(symbol);

    showToast(
      "已加入自選"
    );

  }


  saveWatchlist();


  renderWatchlist();


  if(currentSymbol === symbol){

    /*
      更新詳細頁按鈕
    */

    openStock(symbol);

  }

}


function removeWatch(symbol){

  watchlist =
    watchlist.filter(
      x => x !== symbol
    );

  saveWatchlist();

  renderWatchlist();

  showToast(
    "已移除自選"
  );

}


function renderWatchlist(){

  const box =
    document.getElementById(
      "watchList"
    );


  const count =
    document.getElementById(
      "watchCount"
    );


  if(count){

    count.textContent =
      watchlist.length +
      " 檔";

  }


  if(!watchlist.length){

    box.innerHTML = `

      <div class="empty">

        目前沒有自選股票。

        <br><br>

        到股票詳細頁
        按「加入自選」。

      </div>

    `;

    return;

  }


  box.innerHTML =
    watchlist
      .map(
        symbol => {

          const stock =
            getStock(symbol) ||
            {
              symbol,
              name:symbol,
              market:""
            };


          const q =
            getQuote(symbol);


          const change =
            q?.changePct;


          return `

            <div
              class="stock glass"
              onclick="openStock('${symbol}')">


              <div class="stock-left">

                <div class="stock-symbol">
                  ${symbol}
                </div>

                <div class="stock-name">
                  ${stock.name}
                  ·
                  ${stock.market}
                </div>

              </div>


              <div
                style="
                  display:flex;
                  align-items:center;
                  gap:12px
                ">


                <div class="stock-right">

                  <div class="stock-price">
                    ${money(q?.price)}
                  </div>

                  <div
                    class="stock-change ${
                      change >= 0
                      ? "up"
                      : "down"
                    }">

                    ${percent(change)}

                  </div>

                </div>


                <button
                  class="watch-remove"
                  onclick="
                    event.stopPropagation();
                    removeWatch('${symbol}')
                  ">

                  ×

                </button>

              </div>


            </div>

          `;

        }
      )
      .join("");

}


/* =========================================================
   PORTFOLIO
   ========================================================= */

function savePortfolio(){

  localStorage.setItem(
    "ian_portfolio",
    JSON.stringify(
      portfolio
    )
  );

}


function openTrade(type){

  const defaultSymbol =
    currentSymbol ||
    "2330";


  showModal(`

    <div class="modal-head">

      <h2>
        ${
          type === "BUY"
          ? "買入模擬交易"
          : "賣出模擬交易"
        }
      </h2>

      <button
        class="close"
        onclick="closeModal()">

        ×

      </button>

    </div>


    <div class="modal-info">

      紙上交易模式，
      不會真的連結券商或下單。

    </div>


    <div class="form">

      <input
        id="tradeSymbol"
        value="${defaultSymbol}"
        placeholder="股票代號">

      <input
        id="tradePrice"
        type="number"
        inputmode="decimal"
        placeholder="成交價格">

      <input
        id="tradeShares"
        type="number"
        inputmode="numeric"
        placeholder="股數">

      <button
        class="action ${
          type === "BUY"
          ? "green"
          : "red"
        }"
        onclick="executeTrade('${type}')">

        確認
        ${
          type === "BUY"
          ? "買入"
          : "賣出"
        }

      </button>

    </div>

  `);

}


function executeTrade(type){

  const symbol =
    document
      .getElementById(
        "tradeSymbol"
      )
      .value
      .trim()
      .toUpperCase();


  const price =
    Number(
      document
        .getElementById(
          "tradePrice"
        )
        .value
    );


  const shares =
    Number(
      document
        .getElementById(
          "tradeShares"
        )
        .value
    );


  if(
    !symbol ||
    !Number.isFinite(price) ||
    price <= 0 ||
    !Number.isFinite(shares) ||
    shares <= 0
  ){

    showToast(
      "請輸入正確資料"
    );

    return;

  }


  let item =
    portfolio.find(
      x =>
        x.symbol === symbol
    );


  if(type === "BUY"){

    if(item){

      const oldCost =
        item.price *
        item.shares;

      const newCost =
        price *
        shares;


      item.shares +=
        shares;


      item.price =
        (
          oldCost +
          newCost
        ) /
        item.shares;

    }else{

      portfolio.push({

        symbol,

        price,

        shares

      });

    }


    showToast(
      "買入成功"
    );

  }


  if(type === "SELL"){

    if(
      !item ||
      item.shares < shares
    ){

      showToast(
        "持股不足"
      );

      return;

    }


    item.shares -=
      shares;


    if(
      item.shares <= 0
    ){

      portfolio =
        portfolio.filter(
          x =>
            x.symbol !== symbol
        );

    }


    showToast(
      "賣出成功"
    );

  }


  savePortfolio();

  closeModal();

  renderPortfolio();

}


function renderPortfolio(){

  const valueEl =
    document.getElementById(
      "portfolioValue"
    );


  const pnlEl =
    document.getElementById(
      "portfolioPnL"
    );


  const box =
    document.getElementById(
      "portfolioList"
    );


  if(!portfolio.length){

    valueEl.textContent =
      "NT$0";


    pnlEl.textContent =
      "目前沒有持倉";


    box.innerHTML = `

      <div class="empty">

        尚無模擬持倉。

        <br><br>

        點擊「買入」建立第一筆交易。

      </div>

    `;

    return;

  }


  let totalCost=0;

  let totalValue=0;


  let html="";


  for(const item of portfolio){

    const stock =
      getStock(item.symbol);


    const q =
      getQuote(item.symbol);


    const current =
      Number.isFinite(
        Number(q?.price)
      )
      ? Number(q.price)
      : item.price;


    const cost =
      item.price *
      item.shares;


    const value =
      current *
      item.shares;


    const pnl =
      value -
      cost;


    totalCost +=
      cost;


    totalValue +=
      value;


    const roi =
      cost
      ? pnl / cost * 100
      : 0;


    html += `

      <div
        class="stock glass"
        onclick="openStock('${item.symbol}')">


        <div class="portfolio-item-info">

          <div class="stock-symbol">

            ${item.symbol}

          </div>


          <div class="stock-name">

            ${
              stock?.name ||
              item.symbol
            }

          </div>


          <div class="stock-name">

            成本
            ${money(item.price)}
            ×
            ${money(item.shares)}

          </div>

        </div>


        <div class="stock-right">

          <div class="stock-price">

            ${money(value)}

          </div>


          <div
            class="${
              pnl >= 0
              ? "up"
              : "down"
            }"
            style="font-size:12px">

            ${
              pnl >= 0
              ? "+"
              : ""
            }

            ${money(pnl)}

          </div>


          <div
            class="${
              roi >= 0
              ? "up"
              : "down"
            }"
            style="font-size:10px">

            ${percent(roi)}

          </div>

        </div>


      </div>

    `;

  }


  const totalPnl =
    totalValue -
    totalCost;


  const totalRoi =
    totalCost
    ? totalPnl /
      totalCost *
      100
    : 0;


  valueEl.textContent =
    "NT$" +
    money(totalValue);


  pnlEl.innerHTML = `

    損益：

    <span
      class="${
        totalPnl >= 0
        ? "up"
        : "down"
      }">

      ${
        totalPnl >= 0
        ? "+"
        : ""
      }

      NT$${money(totalPnl)}

      ·

      ${percent(totalRoi)}

    </span>

  `;


  box.innerHTML =
    html;

}

function showModal(html){

  document.getElementById(
    "modalBox"
  ).innerHTML =
    html;


  document.getElementById(
    "modalBg"
  ).classList
    .remove("hidden");

}


function closeModal(){

  document.getElementById(
    "modalBg"
  ).classList
    .add("hidden");

}

  .getElementById("modalBg")
  .addEventListener(
    "click",
    function(event){

      if(
        event.target ===
        this
      ){

        closeModal();

      }

    }
  );
