<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050806">
<title>IAN STOCK</title>

<style>
:root{
  --bg:#050806;
  --panel:#0b130f;
  --panel2:#101a14;
  --line:#1c2b22;
  --text:#eef7f0;
  --muted:#8da093;
  --green:#39d98a;
  --red:#ff6874;
  --yellow:#ffd166;
  --blue:#63a4ff;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:
    radial-gradient(circle at top,#10251a 0,#050806 45%);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Noto Sans TC",
    Arial,
    sans-serif;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  max-width:1180px;
  margin:auto;
  min-height:100vh;
  padding-bottom:90px;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  padding:15px;
  background:rgba(5,8,6,.94);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:22px;
  font-weight:950;
  letter-spacing:1.5px;
}

.logo span{
  color:var(--green);
}

.status{
  font-size:10px;
  color:var(--green);
  border:1px solid #28563d;
  padding:6px 9px;
  border-radius:999px;
}

.search{
  margin-top:12px;
  display:flex;
  gap:8px;
}

.search input{
  flex:1;
  min-width:0;
  background:#0c1510;
  border:1px solid #203228;
  color:#fff;
  border-radius:12px;
  padding:12px;
  outline:none;
}

.search button{
  border:0;
  border-radius:12px;
  padding:0 17px;
  background:var(--green);
  color:#031009;
  font-weight:900;
}

main{
  padding:14px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
}

.card{
  background:
    linear-gradient(180deg,#0d1711,#09100c);
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
  box-shadow:0 10px 30px #0005;
}

.section{
  margin-top:14px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:9px;
}

.section-title h2{
  margin:0;
  font-size:17px;
}

.section-title span{
  color:var(--muted);
  font-size:11px;
}

.muted{
  color:var(--muted);
}

.price{
  font-size:25px;
  font-weight:950;
  margin-top:4px;
}

.up{
  color:var(--green);
}

.down{
  color:var(--red);
}

.neutral{
  color:var(--yellow);
}

.stock-list{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:9px;
}

.stock{
  width:100%;
  background:#0a120e;
  border:1px solid var(--line);
  border-radius:13px;
  padding:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:#fff;
  text-align:left;
}

.stock:hover{
  border-color:#326b4a;
}

.stock small{
  display:block;
  color:var(--muted);
  margin-top:3px;
}

.stock-right{
  text-align:right;
}

.badge{
  background:#10251a;
  color:#83e9ad;
  padding:5px 8px;
  border-radius:8px;
  font-size:10px;
}

.metrics{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.metric{
  background:#09110d;
  border:1px solid var(--line);
  border-radius:11px;
  padding:10px;
}

.metric label{
  color:var(--muted);
  display:block;
  font-size:10px;
}

.metric strong{
  display:block;
  font-size:14px;
  margin-top:5px;
}

.ai{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.ai-card{
  background:#0a130f;
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
}

.ai-value{
  font-size:23px;
  font-weight:950;
  margin-top:5px;
}

.bar{
  height:5px;
  background:#17231c;
  border-radius:5px;
  overflow:hidden;
  margin-top:8px;
}

.bar i{
  display:block;
  height:100%;
  background:var(--green);
}

.chart-wrap{
  background:#07100b;
  border:1px solid var(--line);
  border-radius:13px;
  padding:8px;
}

canvas{
  display:block;
  width:100%;
  height:280px;
}

.chart-tools{
  display:flex;
  gap:6px;
  overflow:auto;
  margin-bottom:9px;
}

.chart-tools button{
  white-space:nowrap;
  border:1px solid var(--line);
  background:#0a130f;
  color:#9daf9f;
  border-radius:8px;
  padding:7px 11px;
}

.chart-tools button.active{
  background:var(--green);
  color:#031009;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.actions button{
  border:1px solid var(--line);
  background:#0d1812;
  color:#fff;
  border-radius:11px;
  padding:11px;
}

.actions .buy{
  background:#123d29;
  border-color:#286d48;
}

.actions .sell{
  background:#3b151a;
  border-color:#71323b;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:12px;
}

th,
td{
  padding:9px 6px;
  border-bottom:1px solid #18251d;
  text-align:right;
}

th:first-child,
td:first-child{
  text-align:left;
}

th{
  color:#7f9485;
  font-weight:600;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:28px;
}

.loading{
  opacity:.6;
}

.bottom{
  position:fixed;
  z-index:30;
  bottom:0;
  left:0;
  right:0;
  background:rgba(5,8,6,.97);
  border-top:1px solid var(--line);
}

.bottom-inner{
  max-width:1180px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(5,1fr);
}

.nav{
  border:0;
  background:none;
  color:#718477;
  padding:9px 3px 11px;
  font-size:11px;
}

.nav b{
  display:block;
  font-size:18px;
  margin-bottom:2px;
}

.nav.active{
  color:var(--green);
}

.toast{
  position:fixed;
  left:50%;
  bottom:82px;
  transform:translateX(-50%);
  background:#14231a;
  border:1px solid #2a5a3e;
  padding:10px 14px;
  border-radius:10px;
  z-index:100;
}

@media(max-width:800px){
  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .stock-list{
    grid-template-columns:1fr;
  }

  .ai{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:500px){
  .grid{
    grid-template-columns:1fr 1fr;
  }

  .metrics{
    grid-template-columns:repeat(2,1fr);
  }

  .ai{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="app">

<header>

  <div class="top">
    <div class="logo">
      IAN <span>STOCK</span>
    </div>

    <div class="status">
      LIVE API
    </div>
  </div>

  <div class="search">
    <input
      id="search"
      placeholder="搜尋股票代號／公司名稱，例如 2330、NVDA"
    >

    <button onclick="doSearch()">
      搜尋
    </button>
  </div>

</header>

<main id="main"></main>

</div>

<nav class="bottom">

<div class="bottom-inner">

<button class="nav active"
        data-page="home"
        onclick="go('home')">
<b>⌂</b>
首頁
</button>

<button class="nav"
        data-page="market"
        onclick="go('market')">
<b>◫</b>
市場
</button>

<button class="nav"
        data-page="watch"
        onclick="go('watch')">
<b>☆</b>
自選
</button>

<button class="nav"
        data-page="portfolio"
        onclick="go('portfolio')">
<b>₿</b>
投資組合
</button>

<button class="nav"
        data-page="ai"
        onclick="go('ai')">
<b>✦</b>
IAN AI
</button>

</div>

</nav>

<script>

const API =
"https://ian-stock-api.onrender.com";

const STOCKS = [

["2330","台積電","TW"],
["2317","鴻海","TW"],
["2454","聯發科","TW"],
["2303","聯電","TW"],
["2382","廣達","TW"],
["3711","日月光投控","TW"],
["2881","富邦金","TW"],
["2882","國泰金","TW"],

["NVDA","NVIDIA","US"],
["AAPL","Apple","US"],
["MSFT","Microsoft","US"],
["TSLA","Tesla","US"]

];

let quotes = [];

let watch =
JSON.parse(
localStorage.getItem("IAN_WATCH") ||
'["2330","2317","2454","NVDA"]'
);

let portfolio =
JSON.parse(
localStorage.getItem("IAN_PORTFOLIO") ||
"[]"
);

let current = null;

let period = "6mo";

function fmt(n,d=2){

  if(
    n === null ||
    n === undefined ||
    Number.isNaN(Number(n))
  ){
    return "--";
  }

  return Number(n).toLocaleString(
    "zh-TW",
    {
      maximumFractionDigits:d
    }
  );

}

function cls(n){

  n = Number(n);

  if(n > 0) return "up";

  if(n < 0) return "down";

  return "neutral";

}

function toast(text){

  const x =
  document.createElement("div");

  x.className="toast";

  x.textContent=text;

  document.body.appendChild(x);

  setTimeout(
    ()=>x.remove(),
    1800
  );

}

async function api(path){

  const response =
  await fetch(API + path);

  if(!response.ok){
    throw new Error(
      await response.text()
    );
  }

  return response.json();

}

function quote(symbol){

  return quotes.find(
    x =>
      String(x.symbol).toUpperCase() ===
      String(symbol).toUpperCase()
  ) || {};

}

async function loadQuotes(){

  try{

    const data =
    await api(
      "/api/quotes?symbols=" +
      STOCKS
      .map(x=>x[0])
      .join(",")
    );

    quotes =
      Array.isArray(data)
      ? data
      : data.data ||
        data.quotes ||
        [];

  }catch(error){

    console.error(error);

    toast("行情資料載入失敗");

  }

}

function stockCard(s){

  const q =
  quote(s[0]);

  return `

<button
class="stock"
onclick="openStock('${s[0]}')"
>

<div>

<b>${s[0]}</b>

<small>
${s[1]} · ${s[2]}
</small>

</div>

<div class="stock-right">

<b>
${fmt(q.price)}
</b>

<small
class="${cls(q.changePct)}"
>

${
q.changePct == null
? "--"
:
(q.changePct > 0 ? "+" : "") +
fmt(q.changePct) +
"%"
}

</small>

</div>

</button>

`;

}

async function home(){

  await loadQuotes();

  document.getElementById(
    "main"
  ).innerHTML = `

<section class="grid">

<div class="card">

<div class="muted">
台股
</div>

<div class="price">
TWSE
</div>

<small class="muted">
台灣股票行情
</small>

</div>

<div class="card">

<div class="muted">
美股
</div>

<div class="price">
US
</div>

<small class="muted">
Yahoo Finance
</small>

</div>

<div class="card">

<div class="muted">
自選股
</div>

<div class="price">
${watch.length}
</div>

<small class="muted">
目前追蹤
</small>

</div>

<div class="card">

<div class="muted">
模擬本金
</div>

<div class="price">
NT$1M
</div>

<small class="muted">
Paper Trading
</small>

</div>

</section>

<section class="section">

<div class="section-title">

<h2>
熱門標的
</h2>

<span>
即時 API
</span>

</div>

<div class="stock-list">

${STOCKS
.map(stockCard)
.join("")}

</div>

</section>

<section class="section">

<div class="section-title">

<h2>
IAN AI
</h2>

<span>
資訊分析
</span>

</div>

<div class="card">

<p class="muted">

輸入股票代號即可查看：

</p>

<div class="ai">

<div class="ai-card">
趨勢
<div class="ai-value">
MA
</div>
</div>

<div class="ai-card">
動能
<div class="ai-value">
RSI
</div>
</div>

<div class="ai-card">
籌碼
<div class="ai-value">
法人
</div>
</div>

</div>

</div>

</section>

`;

}

async function market(){

  await loadQuotes();

  document.getElementById(
    "main"
  ).innerHTML = `

<section class="section">

<div class="section-title">

<h2>
市場
</h2>

<span>
TW / US
</span>

</div>

<div class="stock-list">

${STOCKS
.map(stockCard)
.join("")}

</div>

</section>

`;

}

function watchPage(){

  const list =
  STOCKS.filter(
    s=>watch.includes(s[0])
  );

  document.getElementById(
    "main"
  ).innerHTML = `

<section class="section">

<div class="section-title">

<h2>
我的自選
</h2>

<span>
${list.length} 檔
</span>

</div>

<div class="stock-list">

${
list.length
?
list.map(stockCard).join("")
:
'<div class="empty">尚未加入自選股</div>'
}

</div>

</section>

`;

}

function portfolioPage(){

  document.getElementById(
    "main"
  ).innerHTML = `

<section class="section">

<div class="section-title">

<h2>
投資組合
</h2>

<span>
模擬交易
</span>

</div>

<div class="card">

<div class="price">
NT$1,000,000
</div>

<small class="muted">
模擬本金
</small>

</div>

</section>

<section class="section">

<div class="card">

${
portfolio.length
?

`<table>

<thead>

<tr>

<th>代號</th>
<th>數量</th>
<th>成本</th>
<th>市值</th>

</tr>

</thead>

<tbody>

${portfolio
.map(
x=>`

<tr>

<td>
${x.symbol}
</td>

<td>
${fmt(x.qty,0)}
</td>

<td>
${fmt(x.price)}
</td>

<td>
${fmt(
x.qty *
x.price
)}
</td>

</tr>

`
)
.join("")}

</tbody>

</table>`

:

'<div class="empty">目前沒有模擬持倉</div>'

}

</div>

</section>

`;

}

function aiPage(){

  document.getElementById(
    "main"
  ).innerHTML = `

<section class="section">

<div class="section-title">

<h2>
IAN AI
</h2>

<span>
分析框架
</span>

</div>

<div class="ai">

${

[
["趨勢","MA5 / MA20 / MA60"],
["動能","RSI / MACD / KD"],
["波動","ATR / Bollinger"],
["籌碼","外資 / 投信 / 自營商"],
["基本面","EPS / 營收 / 估值"],
["風險","支撐 / 壓力 / 波動"]

]

.map(
x=>`

<div class="ai-card">

<b>
${x[0]}
</b>

<p class="muted">
${x[1]}
</p>

</div>

`
)
.join("")

}

</div>

</section>

`;

}

async function openStock(symbol){

  document.getElementById(
    "main"
  ).innerHTML =
  '<div class="empty loading">正在載入個股資料…</div>';

  try{

    current =
    await api(
      "/api/stock/" +
      encodeURIComponent(symbol)
    );

    renderDetail(current);

  }catch(error){

    console.error(error);

    document.getElementById(
      "main"
    ).innerHTML =
    '<div class="empty">個股資料載入失敗，請稍後再試。</div>';

  }

}

function renderDetail(data){

  const q =
  data.quote || {};

  const a =
  data.analysis || {};

  const i =
  data.indicators || {};

  const ins =
  data.institutional || {};

  const symbol =
  q.symbol || "";

  const score =
  Number(a.score ?? 50);

  document.getElementById(
    "main"
  ).innerHTML = `

<section class="card">

<div class="top">

<div>

<div class="muted">
${q.name || symbol}
 · ${symbol}
 · ${q.market || ""}
</div>

<div class="price">
${fmt(q.price)}
</div>

<div class="${cls(q.changePct)}">

${
q.changePct == null
?
"--"
:
(q.changePct > 0 ? "+" : "") +
fmt(q.changePct) +
"%"
}

&nbsp;

成交量：
${fmt(q.volume,0)}

</div>

</div>

<div class="badge">
${q.source || "API"}
</div>

</div>

<div class="actions">

<button
onclick="toggleWatch('${symbol}')"
>

${
watch.includes(symbol)
?
"★ 已加入自選"
:
"☆ 加入自選"
}

</button>

<button
onclick="paper('${symbol}')"
>

模擬交易

</button>

</div>

</section>


<section class="section card">

<div class="section-title">

<h2>
K線
</h2>

<span>
OHLCV
</span>

</div>

<div class="chart-tools">

<button
class="${period==="1mo"?"active":""}"
onclick="changePeriod('${symbol}','1mo')"
>
1M
</button>

<button
class="${period==="3mo"?"active":""}"
onclick="changePeriod('${symbol}','3mo')"
>
3M
</button>

<button
class="${period==="6mo"?"active":""}"
onclick="changePeriod('${symbol}','6mo')"
>
6M
</button>

<button
class="${period==="1y"?"active":""}"
onclick="changePeriod('${symbol}','1y')"
>
1Y
</button>

<button
class="${period==="2y"?"active":""}"
onclick="changePeriod('${symbol}','2y')"
>
2Y
</button>

</div>

<div class="chart-wrap">

<canvas
id="chart"
></canvas>

</div>

</section>


<section class="section">

<div class="section-title">

<h2>
技術指標
</h2>

<span>
計算值
</span>

</div>

<div class="metrics">

${

[
["MA5",i.MA5],
["MA20",i.MA20],
["MA60",i.MA60],
["EMA12",i.EMA12],
["EMA26",i.EMA26],
["RSI",i.RSI],
["MACD",i.macd],
["Signal",i.signal],
["ATR",i.ATR],
["支撐",i.support],
["壓力",i.resistance],
["VWAP",i.VWAP]

]

.map(
x=>`

<div class="metric">

<label>
${x[0]}
</label>

<strong>
${fmt(x[1])}
</strong>

</div>

`
)
.join("")

}

</div>

</section>


<section class="section">

<div class="section-title">

<h2>
IAN AI 分析
</h2>

<span>
資訊整理
</span>

</div>

<div class="ai">

<div class="ai-card">

<span class="muted">
趨勢
</span>

<div class="ai-value">
${a.trend || "--"}
</div>

</div>

<div class="ai-card">

<span class="muted">
動能
</span>

<div class="ai-value">
${a.momentum || "--"}
</div>

</div>

<div class="ai-card">

<span class="muted">
資訊分數
</span>

<div class="ai-value">
${fmt(score,0)}
</div>

<div class="bar">
<i style="width:${score}%"></i>
</div>

</div>

</div>

<div class="card" style="margin-top:8px">

<p>
${a.summary || "目前沒有 AI 摘要。"}
</p>

<small class="muted">
本頁為資訊工具，不代表未來報酬。
</small>

</div>

</section>


<section class="section">

<div class="section-title">

<h2>
三大法人
</h2>

<span>
買賣超
</span>

</div>

<div class="card">

<table>

<thead>

<tr>

<th>
法人
</th>

<th>
買進
</th>

<th>
賣出
</th>

<th>
買賣超
</th>

</tr>

</thead>

<tbody>

${

[
["外資",ins.foreignBuy,ins.foreignSell,ins.foreignNet],
["投信",ins.trustBuy,ins.trustSell,ins.trustNet],
["自營商",ins.dealerBuy,ins.dealerSell,ins.dealerNet]

]

.map(
x=>`

<tr>

<td>
${x[0]}
</td>

<td>
${fmt(x[1],0)}
</td>

<td>
${fmt(x[2],0)}
</td>

<td class="${cls(x[3])}">
${fmt(x[3],0)}
</td>

</tr>

`
)
.join("")

}

</tbody>

</table>

</div>

</section>

`;

  loadChart(symbol);

}

async function loadChart(symbol){

  try{

    const data =
    await api(
      "/api/history/" +
      encodeURIComponent(symbol) +
      "?range=" +
      period
    );

    drawChart(
      data.data || []
    );

  }catch(error){

    console.error(error);

    toast("K線載入失敗");

  }

}

function drawChart(rows){

  const canvas =
  document.getElementById(
    "chart"
  );

  if(!canvas || !rows.length)
    return;

  const rect =
  canvas.getBoundingClientRect();

  const ratio =
  window.devicePixelRatio || 1;

  const width =
  rect.width || 600;

  const height =
  280;

  canvas.width =
  width * ratio;

  canvas.height =
  height * ratio;

  const ctx =
  canvas.getContext("2d");

  ctx.scale(
    ratio,
    ratio
  );

  const values =
  rows
  .map(x=>Number(x.close))
  .filter(Number.isFinite);

  if(!values.length)
    return;

  const min =
  Math.min(...values);

  const max =
  Math.max(...values);

  const range =
  max - min || 1;

  ctx.clearRect(
    0,
    0,
    width,
    height
  );

  ctx.strokeStyle =
  "#193025";

  ctx.lineWidth =
  1;

  for(
    let n=0;
    n<5;
    n++
  ){

    const y =
    20 +
    n *
    ((height-40)/4);

    ctx.beginPath();

    ctx.moveTo(
      0,
      y
    );

    ctx.lineTo(
      width,
      y
    );

    ctx.stroke();

  }

  ctx.beginPath();

  rows.forEach(
    (row,index)=>{

      const x =
      15 +
      index *
      ((width-30) /
      Math.max(
        1,
        rows.length-1
      ));

      const y =
      20 +
      (max-row.close) /
      range *
      (height-40);

      if(index===0)
        ctx.moveTo(x,y);
      else
        ctx.lineTo(x,y);

    }
  );

  ctx.strokeStyle =
  "#39d98a";

  ctx.lineWidth =
  2;

  ctx.stroke();

  ctx.fillStyle =
  "#8da093";

  ctx.font =
  "10px Arial";

  ctx.fillText(
    fmt(max),
    4,
    15
  );

  ctx.fillText(
    fmt(min),
    4,
    height-4
  );

}

async function changePeriod(
  symbol,
  p
){

  period=p;

  await openStock(
    symbol
  );

}

function toggleWatch(
  symbol
){

  if(
    watch.includes(symbol)
  ){

    watch =
    watch.filter(
      x=>x!==symbol
    );

    toast(
      "已移除自選"
    );

  }else{

    watch.push(symbol);

    toast(
      "已加入自選"
    );

  }

  localStorage.setItem(
    "IAN_WATCH",
    JSON.stringify(watch)
  );

  renderDetail(
    current
  );

}

function paper(symbol){

  const q =
  quote(symbol);

  const price =
  q.price ||
  current?.quote?.price ||
  0;

  const qty =
  prompt(
    "輸入模擬買進股數",
    "100"
  );

  if(!qty)
    return;

  portfolio.push({

    symbol,

    qty:Number(qty),

    price:Number(price)

  });

  localStorage.setItem(
    "IAN_PORTFOLIO",
    JSON.stringify(
      portfolio
    )
  );

  toast(
    "已建立模擬持倉"
  );

}

async function doSearch(){

  const input =
  document.getElementById(
    "search"
  );

  const value =
  input.value.trim();

  if(!value)
    return;

  try{

    const result =
    await api(
      "/api/search?q=" +
      encodeURIComponent(value)
    );

    const list =
    result.data || [];

    if(list.length){

      openStock(
        list[0].symbol
      );

    }else{

      openStock(
        value.toUpperCase()
      );

    }

  }catch{

    openStock(
      value.toUpperCase()
    );

  }

}

function go(page){

  document
  .querySelectorAll(
    ".nav"
  )
  .forEach(
    x =>
    x.classList.toggle(
      "active",
      x.dataset.page===page
    )
  );

  if(page==="home")
    home();

  else if(page==="market")
    market();

  else if(page==="watch")
    watchPage();

  else if(page==="portfolio")
    portfolioPage();

  else if(page==="ai")
    aiPage();

}

document
.getElementById("search")
.addEventListener(
  "keydown",
  event=>{
    if(event.key==="Enter")
      doSearch();
  }
);

home();
