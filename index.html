<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05080d">
<title>IAN STOCK</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#05080d;color:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
body{min-height:100vh;padding-bottom:94px}
button,input{font:inherit}button{cursor:pointer}
.hidden{display:none!important}

#world{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:.38}
.grid{position:absolute;inset:-20%;background-image:linear-gradient(rgba(55,214,122,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(55,214,122,.045) 1px,transparent 1px);background-size:42px 42px;transform:perspective(650px) rotateX(55deg) scale(1.5);animation:grid 15s linear infinite}
@keyframes grid{to{background-position:0 420px}}
.glow{position:absolute;width:650px;height:650px;left:50%;top:38%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(55,214,122,.12),transparent 68%);animation:pulse 5s ease-in-out infinite}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.12);opacity:.7}}
.worldmap{position:absolute;width:100%;height:100%}
.worldmap path{fill:none;stroke:#37d67a;stroke-width:1;opacity:.55}
.route{stroke-dasharray:5 12!important;animation:route 5s linear infinite}
@keyframes route{to{stroke-dashoffset:-100}}
.node{position:absolute;width:7px;height:7px;border-radius:50%;background:#37d67a;box-shadow:0 0 10px #37d67a,0 0 28px rgba(55,214,122,.6);animation:node 2s infinite}
@keyframes node{50%{transform:scale(1.5);opacity:.65}}
.n1{left:78%;top:43%}.n2{left:19%;top:35%}.n3{left:50%;top:29%}.n4{left:85%;top:37%}.n5{left:72%;top:62%}

.app{position:relative;z-index:2;width:min(920px,100%);margin:auto;padding:18px 16px 120px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.logo{font-size:30px;font-weight:950}.logo span{color:#37d67a}.sub{font-size:10px;color:#65707d;letter-spacing:2px;margin-top:2px}
.status{padding:8px 12px;border-radius:20px;background:rgba(55,214,122,.09);border:1px solid rgba(55,214,122,.2);color:#37d67a;font-size:11px;font-weight:800}
.status.err{color:#ff5964;border-color:rgba(255,89,100,.25);background:rgba(255,89,100,.07)}

.search{display:flex;gap:8px;margin-bottom:12px}
.search input{flex:1;min-width:0;border:1px solid #27313d;background:rgba(12,17,24,.9);color:#fff;border-radius:15px;padding:13px 15px;outline:none}
.search input:focus{border-color:#37d67a;box-shadow:0 0 0 3px rgba(55,214,122,.08)}
.btn{border:0;border-radius:14px;background:#37d67a;color:#06100a;padding:11px 17px;font-weight:900}
.btn.dark{background:#202a35;color:#fff}.btn.red{background:#ff5964;color:#fff}
.btn:active,.tab:active,.nav:active{transform:scale(.96)}

.tabs{display:flex;gap:8px;overflow:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid #27313d;background:rgba(15,20,27,.85);color:#8b95a2;border-radius:20px;padding:9px 15px;white-space:nowrap}
.tab.active{background:#37d67a;color:#06100a;border-color:#37d67a;font-weight:900}

.section{display:flex;justify-content:space-between;align-items:center;margin:23px 0 11px}
.section h2{font-size:19px;margin:0}.section small{color:#707b88}
.glass{background:linear-gradient(135deg,rgba(18,24,32,.92),rgba(9,14,20,.88));border:1px solid rgba(100,116,135,.18);box-shadow:0 18px 50px rgba(0,0,0,.2);backdrop-filter:blur(18px)}

.market{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.card{border-radius:18px;padding:14px;cursor:pointer;transition:.15s}.card:active{transform:scale(.98)}
.mname{color:#8b95a2;font-size:11px}.msym{color:#5e6875;font-size:10px;margin-top:3px}.mprice{font-size:18px;font-weight:950;margin-top:7px}.change{font-size:12px;margin-top:3px}
.up{color:#37d67a}.down{color:#ff5964}.muted{color:#707b88}

.list{display:flex;flex-direction:column;gap:9px}
.stock{display:flex;justify-content:space-between;align-items:center;padding:15px;border-radius:17px;cursor:pointer}
.stock:active{transform:scale(.985)}
.sym{font-size:16px;font-weight:950}.name{font-size:12px;color:#7d8794;margin-top:4px}.right{text-align:right}.price{font-weight:900;font-size:16px}

.hero{padding:19px;border-radius:21px}.detail-symbol{font-size:13px;color:#8993a0}.detail-name{font-size:29px;font-weight:950;margin-top:4px}.detail-price{font-size:39px;font-weight:950;margin-top:15px}.actions{display:flex;gap:8px;margin-top:13px}.actions .btn{flex:1}

.score{padding:18px;border-radius:20px;margin-top:12px}.score-label{color:#818b98;font-size:11px;letter-spacing:1px}.score-num{font-size:45px;font-weight:950;margin-top:5px}.score-num span{font-size:15px;color:#68727f}.bar{height:6px;background:#202832;border-radius:10px;overflow:hidden;margin-top:12px}.fill{height:100%;background:linear-gradient(90deg,#37d67a,#b6ffd0);border-radius:10px}
.tech{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.metric{padding:14px;border-radius:17px}.metric-label{font-size:11px;color:#7d8794}.metric-value{font-size:18px;font-weight:950;margin-top:5px}
.analysis{padding:15px;border-radius:18px}.arow{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #252e38}.arow:last-child{border:0}
.chart{padding:12px;border-radius:18px;overflow:hidden}.chart canvas{width:100%;height:270px;display:block}

.empty{text-align:center;color:#6f7986;padding:40px 15px;border:1px dashed #293440;border-radius:18px;background:rgba(13,18,25,.55)}
.portfolio{padding:18px;border-radius:20px}.total{font-size:31px;font-weight:950;margin-top:4px}
.ai-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.ai-btn{border:1px solid #293440;background:#11171f;color:#fff;border-radius:14px;padding:11px 5px;font-weight:800}.ai-btn.active{border-color:#37d67a;color:#37d67a;background:rgba(55,214,122,.08)}
.ai-box{padding:17px;border-radius:18px;margin-top:10px}.ai-title{font-size:17px;font-weight:900}.ai-text{font-size:13px;color:#858f9b;line-height:1.75;margin-top:8px}

.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(5,8,13,.95);backdrop-filter:blur(20px);border-top:1px solid #202933;padding-bottom:env(safe-area-inset-bottom)}
.bottom-inner{width:min(920px,100%);margin:auto;display:flex;justify-content:space-around;padding:8px 3px}
.nav{appearance:none;border:0;outline:0;background:transparent;color:#6e7885;min-width:58px;padding:6px;border-radius:12px;text-align:center;font-size:10px}
.nav.active{color:#37d67a;background:rgba(55,214,122,.06)}.nav-icon{font-size:21px;line-height:23px;margin-bottom:2px}

.modal-bg{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.72);backdrop-filter:blur(7px);display:flex;align-items:flex-end}
.modal{width:min(920px,100%);max-height:88vh;overflow:auto;background:#11171f;border:1px solid #2b3541;border-radius:24px 24px 0 0;padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center}.close{border:0;width:36px;height:36px;border-radius:50%;background:#242d38;color:#fff;font-size:22px}.form{display:grid;gap:9px;margin-top:15px}.form input{border:1px solid #293440;background:#090e14;color:#fff;border-radius:12px;padding:12px;outline:none}
.toast{position:fixed;left:50%;bottom:105px;transform:translateX(-50%);z-index:200;background:#202934;color:#fff;border:1px solid #34404d;border-radius:13px;padding:10px 15px;font-size:12px}
@media(max-width:520px){.market{grid-template-columns:repeat(2,1fr)}.ai-grid{grid-template-columns:repeat(2,1fr)}.detail-price{font-size:34px}}
</style>
</head>
<body>

<div id="world">
<div class="glow"></div>
<div class="grid"></div>
<svg class="worldmap" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice">
<path d="M120 190L160 145L230 125L300 150L330 200L295 225L260 215L240 255L195 275L155 245Z"/>
<path d="M330 315L375 345L390 410L370 480L335 545L305 505L315 445L295 385Z"/>
<path d="M510 190L550 165L600 175L625 205L600 225L550 220Z"/>
<path d="M550 260L610 245L655 290L650 365L620 440L570 420L545 355Z"/>
<path d="M630 175L710 140L800 155L900 180L970 225L930 270L850 255L800 290L730 260L680 220Z"/>
<path d="M850 420L920 405L980 435L965 490L900 505L850 470Z"/>
<path class="route" d="M205 205Q520 100 800 230"/>
<path class="route" d="M600 200Q760 330 890 440"/>
<path class="route" d="M300 370Q570 180 870 220"/>
</svg>
<div class="node n1"></div>
<div class="node n2"></div>
<div class="node n3"></div>
<div class="node n4"></div>
<div class="node n5"></div>
</div>

<div class="app">

<header>
<div>
<div class="logo">IAN <span>STOCK</span></div>
<div class="sub">GLOBAL MARKET INTELLIGENCE</div>
</div>
<div id="status" class="status">連線中</div>
</header>

<section id="homePage">

<div class="search">
<input id="searchInput" placeholder="搜尋股票代號 / 公司名稱">
<button class="btn" onclick="searchStock()">搜尋</button>
</div>

<div id="searchResult"></div>

<div class="tabs">
<button class="tab active" onclick="setMarket('ALL',this)">全部</button>
<button class="tab" onclick="setMarket('TW',this)">🇹🇼 台股</button>
<button class="tab" onclick="setMarket('US',this)">🇺🇸 美股</button>
</div>

<div class="section">
<h2>市場脈動</h2>
<small id="updateTime">等待資料</small>
</div>

<div id="marketGrid" class="market"></div>

<div class="section">
<h2>熱門股票</h2>
<small>LIVE</small>
</div>

<div id="stockList" class="list"></div>

</section>

<section id="detailPage" class="hidden">

<button class="btn dark" onclick="goPage('home')" style="margin-bottom:14px">
← 返回
</button>

<div id="detailContent"></div>

</section>

<section id="watchPage" class="hidden">

<div class="section">
<h2>⭐ 我的自選</h2>
<small id="watchCount">0 檔</small>
</div>

<div id="watchList" class="list"></div>

</section>

<section id="portfolioPage" class="hidden">

<div class="section">
<h2>💼 投資組合</h2>
<small>PAPER TRADING</small>
</div>

<div class="portfolio glass">

<div class="muted">模擬帳戶總資產</div>

<div id="portfolioValue" class="total">
NT$1,000,000
</div>

<div id="portfolioPnL" style="margin-top:5px">
尚無持倉
</div>

<div class="actions">
<button class="btn" onclick="openTrade('BUY')">
＋ 買入
</button>

<button class="btn red" onclick="openTrade('SELL')">
− 賣出
</button>
</div>

</div>

<div class="section">
<h2>我的持倉</h2>
</div>

<div id="portfolioList" class="list"></div>

</section>

<section id="aiPage" class="hidden">

<div class="section">
<h2>✦ IAN AI</h2>
<small>TECHNICAL RADAR</small>
</div>

<div class="ai-box glass">

<div class="ai-title">
IAN AI 技術分析
</div>

<div class="ai-text">
選擇股票後取得即時行情、歷史資料與技術指標，整理趨勢、動能、波動、支撐與壓力。
</div>

</div>

<div class="section">
<h2>選擇股票</h2>
</div>

<div id="aiStockSelect" class="ai-grid"></div>

<div id="aiContent"></div>

</section>

</div>

<div class="bottom">

<div class="bottom-inner">

<button class="nav active" id="navHome" onclick="goPage('home')">
<div class="nav-icon">⌂</div>
首頁
</button>

<button class="nav" id="navSearch" onclick="focusSearch()">
<div class="nav-icon">⌕</div>
搜尋
</button>

<button class="nav" id="navWatch" onclick="goPage('watch')">
<div class="nav-icon">☆</div>
自選
</button>

<button class="nav" id="navPortfolio" onclick="goPage('portfolio')">
<div class="nav-icon">◈</div>
投資組合
</button>

<button class="nav" id="navAI" onclick="goPage('ai')">
<div class="nav-icon">✦</div>
IAN AI
</button>

</div>

</div>

<div id="modalBg" class="modal-bg hidden">
<div id="modalBox" class="modal"></div>
</div>

<div id="toast" class="toast hidden"></div>

<script>

const API_BASE="https://ian-stock-api.onrender.com";

const STOCKS=[
["2330","台積電","TW"],
["2317","鴻海","TW"],
["2454","聯發科","TW"],
["2303","聯電","TW"],
["2382","廣達","TW"],
["3711","日月光投控","TW"],
["2881","富邦金","TW"],
["2882","國泰金","TW"],
["2603","長榮","TW"],
["2618","長榮航","TW"],
["3231","緯創","TW"],
["2357","華碩","TW"],
["6669","緯穎","TW"],
["3017","奇鋐","TW"],
["NVDA","NVIDIA","US"],
["AAPL","Apple","US"],
["MSFT","Microsoft","US"],
["AMZN","Amazon","US"],
["GOOGL","Alphabet","US"],
["META","Meta","US"],
["TSLA","Tesla","US"],
["AMD","AMD","US"],
["AVGO","Broadcom","US"],
["NFLX","Netflix","US"]
].map(x=>({
symbol:x[0],
name:x[1],
market:x[2],
price:null,
changePct:null
}));

let quotes=[];
let currentMarket="ALL";
let currentSymbol="2330";

let watchlist=JSON.parse(
localStorage.getItem("ian_watchlist")||"[]"
);

let portfolio=JSON.parse(
localStorage.getItem("ian_portfolio")||"[]"
);

const $=id=>document.getElementById(id);

const money=n=>
n==null||!Number.isFinite(Number(n))
?"--"
:Number(n).toLocaleString("zh-TW",{maximumFractionDigits:2});

const pct=n=>
n==null||!Number.isFinite(Number(n))
?"--"
:(Number(n)>=0?"+":"")+Number(n).toFixed(2)+"%";

const stockInfo=s=>
STOCKS.find(x=>
x.symbol.toUpperCase()===String(s).toUpperCase()
)||{
symbol:s,
name:s,
market:""
};

const getQuote=s=>
quotes.find(x=>
String(x.symbol).toUpperCase()===
String(s).toUpperCase()
);

async function api(path){

const r=await fetch(
API_BASE+path,
{
cache:"no-store",
headers:{Accept:"application/json"}
}
);

let j=null;

try{
j=await r.json();
}catch(e){}

if(!r.ok)
throw new Error(j?.error||("HTTP "+r.status));

return j;

}

function setStatus(ok,text){

$("status").textContent=text;

$("status").className=
"status"+(ok?"":" err");

}

function toast(t){

$("toast").textContent=t;

$("toast").classList.remove("hidden");

clearTimeout(window.__toast);

window.__toast=setTimeout(
()=>$("toast").classList.add("hidden"),
1800
);

}

function hidePages(){

[
"homePage",
"detailPage",
"watchPage",
"portfolioPage",
"aiPage"
].forEach(id=>
$(id).classList.add("hidden")
);

document
.querySelectorAll(".nav")
.forEach(x=>x.classList.remove("active"));

}

function goPage(page){

hidePages();

if(page==="home"){

$("homePage").classList.remove("hidden");

$("navHome").classList.add("active");

loadQuotes();

}

if(page==="watch"){

$("watchPage").classList.remove("hidden");

$("navWatch").classList.add("active");

renderWatch();

}

if(page==="portfolio"){

$("portfolioPage").classList.remove("hidden");

$("navPortfolio").classList.add("active");

renderPortfolio();

}

if(page==="ai"){

$("aiPage").classList.remove("hidden");

$("navAI").classList.add("active");

renderAIButtons();

}

}

function focusSearch(){

goPage("home");

setTimeout(()=>{

$("searchInput").focus();

$("searchInput").scrollIntoView({
behavior:"smooth",
block:"center"
});

},150);

}

function setMarket(m,b){

currentMarket=m;

document
.querySelectorAll(".tab")
.forEach(x=>x.classList.remove("active"));

b.classList.add("active");

renderHome();

}

async function loadQuotes(){

try{

const j=await api(
"/api/quotes?symbols="+
encodeURIComponent(
STOCKS.map(x=>x.symbol).join(",")
)
);

const data=
Array.isArray(j)
?j
:Array.isArray(j.data)
?j.data
:[];

quotes=data;

setStatus(true,"● LIVE DATA");

renderHome();
renderWatch();
renderPortfolio();

$("updateTime").textContent=
new Date().toLocaleTimeString("zh-TW");

}catch(e){

console.error(e);

setStatus(false,"API ERROR");

renderHome();

}

}

function renderHome(){

const list=STOCKS.filter(
s=>currentMarket==="ALL"||
s.market===currentMarket
);

$("marketGrid").innerHTML=
list.slice(0,6).map(s=>{

const q=getQuote(s.symbol);

return `
<div class="card glass"
onclick="openStock('${s.symbol}')">

<div class="mname">
${s.name}
</div>

<div class="msym">
${s.symbol} · ${s.market}
</div>

<div class="mprice">
${money(q?.price)}
</div>

<div class="change ${
q?.changePct>=0
?"up"
:q?.changePct==null
?"muted"
:"down"
}">
${pct(q?.changePct)}
</div>

</div>
`;

}).join("");

$("stockList").innerHTML=
list.map(s=>{

const q=getQuote(s.symbol);

return `
<div class="stock glass"
onclick="openStock('${s.symbol}')">

<div>

<div class="sym">
${s.symbol}
</div>

<div class="name">
${s.name} · ${s.market}
</div>

</div>

<div class="right">

<div class="price">
${money(q?.price)}
</div>

<div class="${
q?.changePct>=0
?"up"
:q?.changePct==null
?"muted"
:"down"
}">
${pct(q?.changePct)}
</div>

</div>

</div>
`;

}).join("");

}

async function searchStock(){

const q=$("searchInput").value.trim();

if(!q){

$("searchResult").innerHTML="";

return;

}

let local=STOCKS.filter(s=>
(s.symbol+s.name)
.toLowerCase()
.includes(q.toLowerCase())
);

try{

const j=await api(
"/api/search?q="+
encodeURIComponent(q)
);

const a=
Array.isArray(j)
?j
:Array.isArray(j.data)
?j.data
:[];

for(const x of a){

const symbol=x.symbol||x.t;

if(
symbol&&
!local.some(
s=>
s.symbol.toUpperCase()===
String(symbol).toUpperCase()
)
){

local.push({
symbol,
name:x.name||x.n||symbol,
market:x.market||x.m||""
});

}

}

}catch(e){}

if(!local.length){

const u=q.toUpperCase();

if(/^\d{4,6}$/.test(u))

local=[{
symbol:u,
name:u,
market:"TW"
}];

else if(/^[A-Z]{1,6}$/.test(u))

local=[{
symbol:u,
name:u,
market:"US"
}];

}

$("searchResult").innerHTML=`

<div class="section">

<h2>
搜尋結果
</h2>

<small>
${local.length} 筆
</small>

</div>

<div class="list">

${
local.slice(0,20).map(s=>`

<div class="stock glass"
onclick="openStock('${s.symbol}')">

<div>

<div class="sym">
${s.symbol}
</div>

<div class="name">
${s.name}
</div>

</div>

<div>
${s.market||""}
</div>

</div>

`).join("")
||
'<div class="empty">找不到股票</div>'
}

</div>

`;

}

async function openStock(symbol){

currentSymbol=
String(symbol).toUpperCase();

hidePages();

$("detailPage")
.classList.remove("hidden");

$("detailContent").innerHTML=
'<div class="empty">正在取得 '+
currentSymbol+
' 資料…</div>';

try{

const j=await api(
"/api/stock/"+
encodeURIComponent(currentSymbol)
);

renderDetail(j);

}catch(e){

$("detailContent").innerHTML=`

<div class="empty">

<div class="down">
資料取得失敗
</div>

<p>
${e.message}
</p>

<button
class="btn dark"
onclick="openStock('${currentSymbol}')"
>
重新載入
</button>

</div>

`;

}

}

function tech(label,v){

return `

<div class="metric glass"
onclick="indicator('${label}')">

<div class="metric-label">
${label}
</div>

<div class="metric-value">
${money(v)}
</div>

</div>

`;

}

function indicator(n){

const d={

MA5:"5日移動平均",

MA20:"20日移動平均",

MA60:"60日移動平均",

EMA12:"12日指數均線",

EMA26:"26日指數均線",

RSI:"相對強弱指標",

MACD:"MACD動能指標",

ATR:"平均真實波幅",

VWAP:"成交量加權平均價",

Support:"近期支撐",

Resistance:"近期壓力"

};

alert(
n+"：\n"+
(d[n]||"技術指標")
);

}

function renderDetail(data){

const q=data.quote||{};

const a=data.analysis||{};

const macd=a.MACD||{};

const bb=a.Bollinger||{};

const score=Number(a.score);

const fav=watchlist.includes(
currentSymbol
);

$("detailContent").innerHTML=`

<div class="hero glass">

<div class="detail-symbol">
${currentSymbol} · ${q.market||""}
</div>

<div class="detail-name">

function drawChart(history){

const c=$("priceCanvas");

if(!c)return;

const vals=(history||[])
.map(x=>Number(x.close))
.filter(Number.isFinite)
.slice(-120);

const w=Math.max(
280,
c.clientWidth||300
);

const h=270;

const d=
window.devicePixelRatio||1;

c.width=w*d;

c.height=h*d;

const ctx=c.getContext("2d");

ctx.scale(d,d);

if(vals.length<2){

ctx.fillStyle="#707b88";

ctx.font="13px sans-serif";

ctx.fillText(
"歷史資料不足",
15,
30
);

return;

}

const min=Math.min(...vals);

const max=Math.max(...vals);

const range=max-min||1;

ctx.strokeStyle=
"rgba(120,140,160,.1)";

ctx.lineWidth=1;

for(let i=1;i<5;i++){

let y=i*h/5;

ctx.beginPath();

ctx.moveTo(0,y);

ctx.lineTo(w,y);

ctx.stroke();

}

ctx.beginPath();

vals.forEach((v,i)=>{

let x=
10+
i*(w-20)/(vals.length-1);

let y=
h-20-
(v-min)/range*(h-40);

i
?ctx.lineTo(x,y)
:ctx.moveTo(x,y);

});

ctx.strokeStyle="#37d67a";

ctx.lineWidth=2.3;

ctx.stroke();

ctx.fillStyle="#7e8997";

ctx.font="11px sans-serif";

ctx.fillText(
money(max),
10,
15
);

ctx.fillText(
money(min),
10,
h-4
);

}

function executeTrade(type){

const symbol=
$("tradeSymbol")
.value
.trim()
.toUpperCase();

const price=
Number($("tradePrice").value);

const shares=
Number($("tradeShares").value);

if(
!symbol||
price<=0||
shares<=0
){

toast("請輸入正確資料");

return;

}

let item=
portfolio.find(
x=>x.symbol===symbol
);

if(type==="BUY"){

if(item){

const old=
item.price*item.shares;

item.shares+=shares;

item.price=
(old+price*shares)/
item.shares;

}else{

portfolio.push({
symbol,
price,
shares
});

}

toast("買入成功");

}else{

if(
!item||
item.shares<shares
){

toast("持股不足");

return;

}

item.shares-=shares;

if(item.shares<=0)

portfolio=
portfolio.filter(
x=>x.symbol!==symbol
);

toast("賣出成功");

}

localStorage.setItem(
"ian_portfolio",
JSON.stringify(portfolio)
);

closeModal();

renderPortfolio();

}

function renderPortfolio(){

let total=0;

let cost=0;

if(!portfolio.length){

$("portfolioValue").textContent=
"NT$1,000,000";

$("portfolioPnL").textContent=
"目前沒有持倉";

$("portfolioList").innerHTML=
'<div class="empty">尚無模擬持倉。<br><br>按「買入」建立第一筆交易。</div>';

return;

}

$("portfolioList").innerHTML=
portfolio.map(x=>{

const q=getQuote(x.symbol);

const cur=
Number.isFinite(
Number(q?.price)
)
?Number(q.price)
:x.price;

const c=
x.price*x.shares;

const v=
cur*x.shares;

const p=v-c;

const r=
c?100*p/c:0;

cost+=c;

total+=v;

return `

<div
class="stock glass"
onclick="openStock('${x.symbol}')"
>

<div>

<div class="sym">
${x.symbol}
</div>

<div class="name">
成本 ${money(x.price)} × ${x.shares}
</div>

</div>

<div class="right">

<div class="price">
${money(v)}
</div>

<div class="${p>=0?"up":"down"}">
${p>=0?"+":""}${money(p)}
</div>

<div class="${r>=0?"up":"down"}">
${pct(r)}
</div>

</div>

</div>

`;

}).join("");

const pnl=
total-cost;

const roi=
cost?100*pnl/cost:0;

$("portfolioValue").textContent=
"NT$"+money(total);

$("portfolioPnL").innerHTML=

`損益：
<span class="${pnl>=0?"up":"down"}">
${pnl>=0?"+":""}NT$${money(pnl)}
 · ${pct(roi)}
</span>`;

}
