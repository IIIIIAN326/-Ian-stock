<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>IAN STOCK</title>
<style>
:root{--bg:#07111f;--panel:#0d1b2d;--line:#20334b;--text:#edf5ff;--muted:#8ea4bd;--blue:#5aa9ff;--up:#20c997;--down:#ff647c}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07111f,#0a1725);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1200px;margin:auto;min-height:100vh;padding-bottom:80px}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:17px 20px;background:#07111ff2;border-bottom:1px solid var(--line);backdrop-filter:blur(15px)}
.logo{font-weight:900;font-size:21px;letter-spacing:1px}.logo span{color:var(--blue)}.demo{font-size:11px;color:#ffd36b;border:1px solid #6d5a25;border-radius:999px;padding:5px 9px}
main{padding:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.wide{grid-column:span 2}.card{background:#0d1b2df2;border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 12px 35px #0002;margin-bottom:14px}
h1,h2,h3{margin:0 0 10px}.muted{color:var(--muted)}.big{font-size:32px;font-weight:800}.up{color:var(--up)}.down{color:var(--down)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.btn{border:0;border-radius:11px;padding:10px 14px;background:var(--blue);color:#06111d;font-weight:750}.secondary{background:#162a43;color:#dbeaff}.buy{background:var(--up)}.sell{background:var(--down);color:#fff}
.search{display:flex;gap:8px}.search input,.trade input,.trade select{width:100%;background:#091625;color:#fff;border:1px solid var(--line);border-radius:10px;padding:11px}
.stock{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}.stock:last-child{border-bottom:0}
.metric{background:#0a1726;border:1px solid var(--line);border-radius:12px;padding:11px;margin:8px 0}.metric b{display:block;font-size:18px;margin-top:3px}
.chart{height:230px;display:flex;align-items:end;gap:4px;padding:15px 4px 8px;background:#091624;border-radius:13px;margin-top:12px}.bar{flex:1;border-radius:4px 4px 1px 1px;background:linear-gradient(180deg,#65b4ff,#2467bd)}
.tabs{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}.tab{padding:7px 10px;border:1px solid var(--line);border-radius:999px;color:#a9bfd8;background:#0a1726}.tab.active{background:#173454;color:#fff}
.trade{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;justify-content:center;background:#07111ff7;border-top:1px solid var(--line);backdrop-filter:blur(15px)}
nav button{flex:1;max-width:220px;border:0;background:none;color:#8198b1;padding:10px 5px}nav button.active{color:#fff}nav small{display:block}
@media(max-width:800px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.trade{grid-template-columns:1fr}.big{font-size:28px}}
</style>
<style>
.feature-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.feature{background:#091625;border:1px solid #20334b;border-radius:12px;padding:12px}
.feature b{display:block;font-size:18px;margin-top:4px}
.news{padding:10px 12px;border:1px solid #20334b;border-radius:12px;background:#0a1726;margin:8px 0}
@media(max-width:800px){.feature-grid{grid-template-columns:1fr}}
</style></head>
<body>
<div class="app">
<header><div class="logo">IAN <span>STOCK</span></div><div class="demo">DEMO DATA · 模擬環境</div></header>
<main id="app"></main>
<nav>
<button data-p="home">⌂<small>首頁</small></button><button data-p="search">⌕<small>搜尋</small></button>
<button data-p="watch">☆<small>自選</small></button><button data-p="portfolio">◒<small>投資組合</small></button><button data-p="trade">↕<small>模擬交易</small></button>
</nav>
</div>
<script>
const stocks=[
{t:"2330",n:"台積電",p:1120,ch:2.1,pe:22.8},{t:"2317",n:"鴻海",p:211,ch:-1.4,pe:15.2},
{t:"2454",n:"聯發科",p:1435,ch:1.0,pe:19.4},{t:"NVDA",n:"NVIDIA",p:184.22,ch:2.7,pe:45.1},
{t:"AAPL",n:"Apple",p:255.41,ch:-.4,pe:31.0},{t:"MSFT",n:"Microsoft",p:512.88,ch:.8,pe:37.2}];
let S={page:"home",watch:["2330","NVDA"],cash:1000000,pos:{}};
const $=x=>document.getElementById(x),get=t=>stocks.find(s=>s.t===t)||stocks[0],money=n=>new Intl.NumberFormat("zh-TW",{style:"currency",currency:"TWD",maximumFractionDigits:0}).format(n);
function value(){return S.cash+Object.entries(S.pos).reduce((a,[t,p])=>a+p.qty*get(t).p,0)}
function profit(){return value()-1000000}
function chart(){return '<div class="chart">'+Array.from({length:36},(_,i)=>'<div class="bar" style="height:'+(35+(i*31)%145)+'px"></div>').join('')+'</div>'}
function stock(s){return '<div class="stock" onclick="selectStock(\''+s.t+'\')"><div><b>'+s.t+'</b> <span class="muted">'+s.n+'</span></div><div><b>'+s.p.toLocaleString()+'</b><div class="'+(s.ch>=0?'up':'down')+'">'+(s.ch>=0?'+':'')+s.ch+'%</div></div></div>'}
function selectStock(t){S.selected=t;S.page="home";render()}
function render(){
document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.p===S.page));
if(S.page==="home"){let s=get(S.selected||"2330");$("app").innerHTML=
'<div class="grid"><div class="card wide"><div class="row"><div><div class="muted">IAN AI 市場脈動</div><h1>看懂市場，不只看價格</h1></div><span class="demo">Research</span></div><p class="muted">趨勢、技術指標、基本資料與模擬投資集中在同一個介面。</p><button class="btn" onclick="S.page=\'search\';render()">搜尋股票</button> <button class="btn secondary" onclick="S.page=\'trade\';render()">模擬交易</button></div><div class="card"><div class="muted">模擬總資產</div><div class="big">'+money(value())+'</div><div class="'+(profit()>=0?'up':'down')+'">'+(profit()>=0?'+':'')+money(profit())+'</div></div></div>'+
'<div class="grid"><div class="card wide"><div class="row"><h2>市場焦點</h2><span class="muted">TW / US</span></div>'+stocks.slice(0,4).map(stock).join('')+'</div><div class="card"><h2>IAN AI Radar</h2><div class="metric">Trend<b>偏多觀察</b></div><div class="metric">Momentum<b>中性偏強</b></div><div class="metric">Risk<b>留意波動</b></div></div></div>'+
'<div class="grid"><div class="card wide"><div class="row"><div><h2>'+s.t+' '+s.n+'</h2><div class="'+(s.ch>=0?'up':'down')+'">'+s.p+' · '+(s.ch>=0?'+':'')+s.ch+'%</div></div><button class="btn" onclick="S.page=\'trade\';render()">模擬下單</button></div>'+chart()+'<div class="tabs"><span class="tab active">1D</span><span class="tab">1W</span><span class="tab">1M</span><span class="tab">1Y</span></div></div><div class="card"><h2>技術分析</h2><div class="metric">MA5<b>'+(s.p*.99).toFixed(1)+'</b></div><div class="metric">MA20<b>'+(s.p*.96).toFixed(1)+'</b></div><div class="metric">MA60<b>'+(s.p*.91).toFixed(1)+'</b></div><div class="metric">RSI<b>58.4</b></div><div class="metric">MACD<b>+8.2</b></div></div></div>'}
else if(S.page==="search"){$("app").innerHTML='<div class="card"><h2>搜尋台股 / 美股</h2><div class="search"><input id="q" placeholder="2330、NVDA、台積電、Apple"><button class="btn" onclick="doSearch()">搜尋</button></div><div id="results" style="margin-top:10px">'+stocks.map(stock).join('')+'</div><p class="muted">正式版會在這裡接合法行情資料 API。</p></div>'}
else if(S.page==="watch"){$("app").innerHTML='<div class="card"><h2>自選股</h2>'+S.watch.map(t=>get(t)).map(stock).join('')+'</div>'}
else if(S.page==="portfolio"){$("app").innerHTML='<div class="grid"><div class="card"><div class="muted">總資產</div><div class="big">'+money(value())+'</div></div><div class="card"><div class="muted">現金</div><div class="big">'+money(S.cash)+'</div></div><div class="card"><div class="muted">報酬率</div><div class="big">'+(profit()/1000000*100).toFixed(2)+'%</div></div></div><div class="card"><h2>持倉</h2>'+ (Object.keys(S.pos).length?Object.entries(S.pos).map(([t,p])=>{let s=get(t),pl=p.qty*s.p-p.cost;return '<div class="stock"><div><b>'+t+'</b> '+s.n+'<div class="muted">'+p.qty+' 股 · 成本 '+money(p.cost)+'</div></div><div class="'+(pl>=0?'up':'down')+'">'+(pl>=0?'+':'')+money(pl)+'</div></div>'}).join(''):'<p class="muted">目前沒有持倉。</p>')+'</div>'}
else{$("app").innerHTML='<div class="grid"><div class="card wide trade"><div><h2>模擬交易</h2><p class="muted">虛擬本金 NT$1,000,000，不連接券商、不會真的扣款。</p></div><div></div><div><select id="sym">'+stocks.map(s=>'<option>'+s.t+'</option>').join('')+'</select></div><div><input id="qty" type="number" value="100" min="1"></div><div class="actions"><button class="btn buy" onclick="trade(1)">買進</button><button class="btn sell" onclick="trade(0)">賣出</button></div><div id="msg" class="muted"></div></div><div class="card"><h2>可擴充功能</h2><p class="muted">限價單、停損、停利、手續費、交易稅、交易紀錄與排行榜。</p></div></div>'}
}
function doSearch(){let q=$("q").value.toLowerCase(),a=stocks.filter(s=>(s.t+s.n).toLowerCase().includes(q));$("results").innerHTML=a.length?a.map(stock).join(''):'<p class="muted">示範資料沒有找到。正式版將連接合法資料來源。</p>'}
function trade(buy){let t=$("sym").value,q=Math.max(1,Number($("qty").value)||1),s=get(t),amt=q*s.p,m=$("msg");if(buy){if(S.cash<amt){m.textContent="現金不足";return}S.cash-=amt;S.pos[t]??={qty:0,cost:0};S.pos[t].qty+=q;S.pos[t].cost+=amt;m.textContent="已買進 "+t+" "+q+" 股，模擬成交 "+money(amt)}else{let p=S.pos[t];if(!p||p.qty<q){m.textContent="持股不足";return}let avg=p.cost/p.qty;S.cash+=amt;p.qty-=q;p.cost-=avg*q;if(!p.qty)delete S.pos[t];m.textContent="已賣出 "+t+" "+q+" 股，模擬成交 "+money(amt)}render()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{S.page=b.dataset.p;render()});render();
</script>
</body></html>
