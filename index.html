<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>IAN STOCK</title>

<style>
:root{
  --bg:#06101d;
  --panel:#0c1b2d;
  --panel2:#0a1727;
  --line:#203852;
  --line2:#294865;
  --text:#f1f6fc;
  --muted:#91a6bd;
  --blue:#55a8ff;
  --blue2:#2c7fd1;
  --up:#22c997;
  --down:#ff6178;
  --yellow:#ffd45c;
}

*{
  box-sizing:border-box;
}

html{
  font-size:16px;
}

body{
  margin:0;
  background:
    radial-gradient(circle at top right,#102943 0,#06101d 42%),
    #06101d;
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans TC",
    sans-serif;
  line-height:1.55;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:1180px;
  margin:auto;
  min-height:100vh;
  padding-bottom:105px;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:20;

  display:flex;
  align-items:center;
  justify-content:space-between;

  min-height:76px;
  padding:16px 22px;

  background:rgba(6,16,29,.94);
  border-bottom:1px solid var(--line);

  backdrop-filter:blur(18px);
}

.logo{
  font-size:26px;
  font-weight:900;
  letter-spacing:1.5px;
}

.logo span{
  color:var(--blue);
}

.status{
  font-size:14px;
  color:var(--yellow);
}

/* MAIN */

main{
  padding:26px 22px;
}

/* CARDS */

.card{
  background:
    linear-gradient(
      145deg,
      rgba(14,31,50,.98),
      rgba(8,21,36,.98)
    );

  border:1px solid var(--line);

  border-radius:20px;

  padding:22px;

  margin-bottom:20px;

  box-shadow:
    0 12px 40px rgba(0,0,0,.22);
}

.card h1{
  font-size:32px;
  line-height:1.2;
  margin:0 0 14px;
}

.card h2{
  font-size:22px;
  margin:0 0 16px;
}

.card h3{
  font-size:18px;
  margin:0 0 10px;
}

.muted{
  color:var(--muted);
}

.big{
  font-size:34px;
  font-weight:850;
  letter-spacing:.3px;
}

.up{
  color:var(--up);
}

.down{
  color:var(--down);
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.wide{
  grid-column:span 2;
}

/* ROW */

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
}

/* BUTTON */

.btn{
  border:0;
  border-radius:12px;

  padding:12px 18px;

  background:var(--blue);
  color:#04111e;

  font-size:15px;
  font-weight:800;

  transition:.15s;
}

.btn:active{
  transform:scale(.97);
}

.secondary{
  background:#17314d;
  color:#dcecff;
}

.buy{
  background:var(--up);
  color:#041812;
}

.sell{
  background:var(--down);
  color:white;
}

/* SEARCH */

.search{
  display:flex;
  gap:12px;
}

.search input{
  flex:1;
  min-width:0;

  background:#081626;

  border:1px solid var(--line2);
  border-radius:12px;

  padding:14px 16px;

  color:white;

  font-size:16px;

  outline:none;
}

.search input:focus{
  border-color:var(--blue);
}

/* STOCK */

.stock{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:20px;

  padding:17px 4px;

  border-bottom:1px solid rgba(41,72,101,.55);

  cursor:pointer;
}

.stock:last-child{
  border-bottom:0;
}

.stock-left{
  min-width:0;
}

.stock-symbol{
  font-size:18px;
  font-weight:850;
}

.stock-name{
  margin-left:8px;
  color:var(--muted);
  font-size:15px;
}

.stock-price{
  text-align:right;
  white-space:nowrap;
}

.stock-price b{
  font-size:18px;
}

/* METRIC */

.metric-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.metric{
  background:#091728;

  border:1px solid var(--line);

  border-radius:14px;

  padding:15px;
}

.metric span{
  display:block;

  color:var(--muted);

  font-size:14px;

  margin-bottom:4px;
}

.metric b{
  display:block;

  font-size:19px;

  font-weight:800;
}

/* CHART */

.chart{
  width:100%;
  height:320px;

  background:#071421;

  border:1px solid var(--line);

  border-radius:15px;

  margin-top:16px;

  padding:12px;

  overflow:hidden;
}

.chart svg{
  width:100%;
  height:100%;
}

/* TIME TABS */

.tabs{
  display:flex;
  gap:8px;

  margin-top:15px;

  overflow-x:auto;

  padding-bottom:3px;
}

.tab{
  flex:0 0 auto;

  padding:9px 14px;

  border-radius:10px;

  border:1px solid var(--line);

  background:#091728;

  color:#9db2c9;

  font-size:14px;
}

.tab.active{
  background:#19456f;
  border-color:#397db8;
  color:white;
}

/* TAG */

.tag{
  display:inline-block;

  border:1px solid var(--line2);

  background:#0b1d30;

  border-radius:999px;

  padding:6px 11px;

  font-size:12px;

  color:#a9bfd5;
}

/* MARKET */

.market-card{
  min-height:150px;
}

.market-name{
  font-size:14px;
  color:var(--muted);
  margin-bottom:8px;
}

.market-price{
  font-size:28px;
  font-weight:850;
}

.market-change{
  font-size:15px;
  margin-top:5px;
}

/* HERO */

.hero{
  background:
    radial-gradient(
      circle at 90% 10%,
      rgba(60,145,225,.2),
      transparent 35%
    ),
    linear-gradient(
      135deg,
      #0d243b,
      #081726
    );
}

.hero-title{
  font-size:34px;
  font-weight:900;
  line-height:1.2;
}

.hero-title span{
  color:var(--blue);
}

.hero-desc{
  color:var(--muted);
  font-size:16px;
  margin:12px 0 20px;
}

.hero-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.hero-stat{
  background:rgba(4,14,25,.55);
  border:1px solid var(--line);
  border-radius:14px;
  padding:15px;
}

.hero-stat small{
  display:block;
  color:var(--muted);
  font-size:13px;
  margin-bottom:5px;
}

.hero-stat b{
  font-size:21px;
}

/* DETAIL */

.stock-header{
  padding-bottom:18px;
  border-bottom:1px solid var(--line);
  margin-bottom:4px;
}

.stock-title{
  font-size:26px;
  font-weight:900;
}

.stock-main-price{
  font-size:34px;
  font-weight:900;
  margin-top:4px;
}

/* NOTICE */

.notice{
  padding:13px 15px;

  background:#091728;

  border:1px solid var(--line);

  border-radius:12px;

  color:#9db2c8;

  font-size:14px;

  margin-top:14px;
}

/* EMPTY */

.empty{
  padding:30px 15px;

  text-align:center;

  color:var(--muted);

  font-size:15px;
}

/* NAV */

nav{
  position:fixed;

  left:50%;
  bottom:14px;

  transform:translateX(-50%);

  z-index:50;

  width:min(720px,calc(100% - 24px));

  display:flex;

  background:rgba(7,18,31,.96);

  border:1px solid var(--line2);

  border-radius:18px;

  box-shadow:0 15px 45px rgba(0,0,0,.4);

  backdrop-filter:blur(18px);

  overflow:hidden;
}

nav button{
  flex:1;

  border:0;

  background:none;

  color:#7890a8;

  padding:12px 5px 10px;

  font-size:21px;
}

nav button.active{
  color:var(--blue);
}

nav small{
  display:block;

  margin-top:2px;

  font-size:12px;
}

/* TRADE */

.trade{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.trade input,
.trade select{
  width:100%;

  background:#081626;

  color:white;

  border:1px solid var(--line2);

  border-radius:12px;

  padding:13px 14px;

  font-size:16px;
}

.actions{
  display:flex;
  gap:10px;
}

.actions .btn{
  flex:1;
}

/* DEPTH PLACEHOLDER */

.depth{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.depth-box{
  background:#091728;
  border:1px solid var(--line);
  border-radius:14px;
  padding:15px;
}

.depth-title{
  font-size:15px;
  font-weight:800;
  margin-bottom:8px;
}

.depth-line{
  display:flex;
  justify-content:space-between;
  padding:7px 0;
  font-size:14px;
}

/* MOBILE */

@media(max-width:800px){

  .app{
    padding-bottom:105px;
  }

  header{
    min-height:70px;
    padding:14px 17px;
  }

  .logo{
    font-size:23px;
  }

  main{
    padding:18px 15px;
  }

  .grid{
    grid-template-columns:1fr;
    gap:0;
  }

  .wide{
    grid-column:auto;
  }

  .card{
    padding:20px;
    border-radius:18px;
    margin-bottom:17px;
  }

  .card h1{
    font-size:29px;
  }

  .card h2{
    font-size:21px;
  }

  .hero-title{
    font-size:30px;
  }

  .hero-stats{
    grid-template-columns:1fr;
  }

  .metric-grid{
    grid-template-columns:1fr 1fr;
  }

  .chart{
    height:280px;
  }

  .market-card{
    min-height:135px;
  }

  .stock-title{
    font-size:23px;
  }

  .stock-main-price{
    font-size:31px;
  }

  .trade{
    grid-template-columns:1fr;
  }

  .depth{
    grid-template-columns:1fr;
  }

  .status{
    font-size:12px;
  }
}

@media(max-width:420px){

  html{
    font-size:15px;
  }

  .metric-grid{
    grid-template-columns:1fr;
  }

  .stock-name{
    display:block;
    margin-left:0;
    margin-top:2px;
  }

  .hero-title{
    font-size:27px;
  }

  .chart{
    height:250px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">
    IAN <span>STOCK</span>
  </div>

  <div id="status" class="status">
    API 連線中…
  </div>
</header>

<main id="app"></main>

<nav>
  <button data-p="home">
    ⌂
    <small>首頁</small>
  </button>

  <button data-p="search">
    ⌕
    <small>搜尋</small>
  </button>

  <button data-p="watch">
    ☆
    <small>自選</small>
  </button>

  <button data-p="portfolio">
    ◒
    <small>投資組合</small>
  </button>

  <button data-p="trade">
    ↕
    <small>模擬交易</small>
  </button>
</nav>

</div>

<script>

const API_BASE =
  (
    window.IAN_API_BASE ||
    "https://ian-stock-api.onrender.com"
  ).replace(/\/$/,"");


/* =========================
   初始股票
========================= */

const seed = [

  ["2330","台積電","TW"],
  ["2317","鴻海","TW"],
  ["2454","聯發科","TW"],
  ["2303","聯電","TW"],
  ["2881","富邦金","TW"],

  ["NVDA","NVIDIA","US"],
  ["AAPL","Apple","US"],
  ["MSFT","Microsoft","US"],
  ["TSLA","Tesla","US"],
  ["AMZN","Amazon","US"]

];


let stocks =
  seed.map(
    ([symbol,name,market]) => ({
      symbol,
      name,
      market,
      price:null,
      changePct:null,
      volume:null
    })
  );


let S = {

  page:"home",

  selected:"2330",

  watch:[
    "2330",
    "NVDA"
  ],

  cash:1000000,

  pos:{},

  detail:null,

  market:null,

  range:"3mo"

};


/* =========================
   工具
========================= */

const $ =
  id =>
    document.getElementById(id);


function fmt(n){

  if(
    n === null ||
    n === undefined ||
    Number.isNaN(Number(n))
  ){
    return "—";
  }

  return Number(n).toLocaleString(
    "zh-TW",
    {
      maximumFractionDigits:2
    }
  );

}


function money(n){

  return new Intl.NumberFormat(
    "zh-TW",
    {
      style:"currency",
      currency:"TWD",
      maximumFractionDigits:0
    }
  ).format(
    Number(n)||0
  );

}


function get(symbol){

  return (
    stocks.find(
      s => s.symbol === symbol
    ) ||
    {
      symbol,
      name:symbol,
      price:null,
      changePct:null
    }
  );

}


function status(ok,msg){

  const el =
    $("status");

  el.textContent =
    msg;

  el.style.color =
    ok
      ? "#22c997"
      : "#ffd45c";

}


/* =========================
   API
========================= */

async function api(path){

  const response =
    await fetch(
      API_BASE + path,
      {
        headers:{
          Accept:
            "application/json"
        }
      }
    );

  let json = null;

  try{
    json =
      await response.json();
  }catch{}

  if(!response.ok){

    throw new Error(
      json?.error ||
      "HTTP " +
      response.status
    );

  }

  return json;

}


/* =========================
   市場數字
========================= */

function marketCard(
  name,
  item
){

  if(!item){

    return `
      <div class="card market-card">
        <div class="market-name">
          ${name}
        </div>

        <div class="market-price">
          —
        </div>

        <div class="muted">
          等待資料
        </div>
      </div>
    `;

  }

  const up =
    Number(item.changePct) >= 0;

  return `
    <div class="card market-card">

      <div class="market-name">
        ${name}
      </div>

      <div class="market-price">
        ${fmt(item.price)}
      </div>

      <div class="
        market-change
        ${up ? "up":"down"}
      ">
        ${
          item.changePct == null
            ? "—"
            :
          (up ? "+" : "") +
          fmt(item.changePct) +
          "%"
        }
      </div>

    </div>
  `;

}


/* =========================
   股票列
========================= */

function stockRow(s){

  const up =
    Number(s.changePct) >= 0;

  return `

    <div
      class="stock"
      onclick="openStock('${s.symbol}')"
    >

      <div class="stock-left">

        <div class="stock-symbol">
          ${s.symbol}
        </div>

        <div class="stock-name">
          ${s.name || ""}
        </div>

      </div>

      <div class="stock-price">

        <b>
          ${fmt(s.price)}
        </b>

        <div class="
          ${up ? "up":"down"}
        ">

          ${
            s.changePct == null
              ? "等待行情"
              :
            (up ? "+" : "") +
            fmt(s.changePct) +
            "%"
          }

        </div>

      </div>

    </div>

  `;

}


/* =========================
   首頁
========================= */

function home(){

  const s =
    get(S.selected);

  const d =
    S.detail;

  const m =
    S.market;

  return `

    <section class="card hero">

      <div class="tag">
        GLOBAL STOCK INTELLIGENCE
      </div>

      <div
        class="hero-title"
        style="margin-top:13px"
      >
        看懂市場，
        <span>不只看價格</span>
      </div>

      <div class="hero-desc">
        台股、美股、技術分析、歷史行情、
        AI 分析與模擬交易集中在同一個平台。
      </div>

      <div class="hero-stats">

        <div class="hero-stat">

          <small>台灣加權指數</small>

          <b>
            ${
              m?.data?.find(
                x => x.symbol === "^TWII"
              )
              ? fmt(
                  m.data.find(
                    x => x.symbol === "^TWII"
                  ).price
                )
              : "—"
            }
          </b>

        </div>

        <div class="hero-stat">

          <small>S&P 500</small>

          <b>
            ${
              m?.data?.find(
                x => x.symbol === "^GSPC"
              )
              ? fmt(
                  m.data.find(
                    x => x.symbol === "^GSPC"
                  ).price
                )
              : "—"
            }
          </b>

        </div>

        <div class="hero-stat">

          <small>即時股票</small>

          <b>
            ${stocks.length}
          </b>

        </div>

      </div>

    </section>


    <div class="row">
      <h2 style="font-size:23px">
        市場總覽
      </h2>

      <span class="tag">
        LIVE MARKET
      </span>
    </div>


    <div class="grid">

      ${
        marketCard(
          "TAIWAN",
          m?.data?.find(
            x => x.symbol === "^TWII"
          )
        )
      }

      ${
        marketCard(
          "S&P 500",
          m?.data?.find(
            x => x.symbol === "^GSPC"
          )
        )
      }

      ${
        marketCard(
          "NASDAQ",
          m?.data?.find(
            x => x.symbol === "^IXIC"
          )
        )
      }

      ${
        marketCard(
          "DOW JONES",
          m?.data?.find(
            x => x.symbol === "^DJI"
          )
        )
      }

    </div>


    <div class="grid">

      <div class="card wide">

        <div class="row">

          <h2>
            市場焦點
          </h2>

          <span class="muted">
            即時行情
          </span>

        </div>

        ${
          stocks
            .slice(0,8)
            .map(stockRow)
            .join("")
        }

      </div>


      <div class="card">

        <h2>
          IAN AI Radar
        </h2>

        ${
          metric(
            "Trend",
            d?.analysis?.trend ||
            "等待資料"
          )
        }

        ${
          metric(
            "Momentum",
            d?.analysis?.momentum ||
            "等待資料"
          )
        }

        ${
          metric(
            "Risk",
            d?.analysis?.risk ||
            "等待資料"
          )
        }

        ${
          metric(
            "AI Score",
            d?.analysis?.score != null
              ? d.analysis.score +
                " / 100"
              : "—"
          )
        }

      </div>

    </div>


    ${stockDetail(s)}

  `;

}


/* =========================
   股票詳細
========================= */

function stockDetail(s){

  const d =
    S.detail;

  if(!d){
    return `
      <div class="card">
        <div class="empty">
          選擇股票後載入詳細資料
        </div>
      </div>
    `;
  }

  return `

    <div class="card">

      <div class="stock-header">

        <div class="muted">
          ${s.market === "TW"
            ? "TAIWAN STOCK"
            : "US STOCK"}
        </div>

        <div class="stock-title">
          ${s.symbol}
          ${s.name || ""}
        </div>

        <div class="
          stock-main-price
          ${
            Number(s.changePct) >= 0
              ? "up"
              : "down"
          }
        ">
          ${fmt(s.price)}
        </div>

        <div class="
          ${
            Number(s.changePct) >= 0
              ? "up"
              : "down"
          }
        ">

          ${
            s.changePct == null
              ? "等待行情"
              :
            (s.changePct >= 0 ? "+" : "") +
            fmt(s.changePct) +
            "%"
          }

        </div>

      </div>


      ${chart(d.history)}


      <div class="tabs">

        ${timeTab("1d","1日")}
        ${timeTab("5d","5日")}
        ${timeTab("10d","10日")}
        ${timeTab("1mo","1月")}
        ${timeTab("3mo","3月")}
        ${timeTab("6mo","6月")}
        ${timeTab("1y","1年")}
        ${timeTab("5y","5年")}

      </div>

    </div>


    <div class="grid">

      <div class="card wide">

        <h2>
          技術指標
        </h2>

        <div class="metric-grid">

          ${metric(
            "MA5",
            fmt(d?.analysis?.MA5)
          )}

          ${metric(
            "MA20",
            fmt(d?.analysis?.MA20)
          )}

          ${metric(
            "MA60",
            fmt(d?.analysis?.MA60)
          )}

          ${metric(
            "EMA12",
            fmt(d?.analysis?.EMA12)
          )}

          ${metric(
            "EMA26",
            fmt(d?.analysis?.EMA26)
          )}

          ${metric(
            "RSI",
            fmt(d?.analysis?.RSI)
          )}

          ${metric(
            "MACD",
            fmt(d?.analysis?.MACD?.macd)
          )}

          ${metric(
            "ATR",
            fmt(d?.analysis?.ATR)
          )}

          ${metric(
            "VWAP",
            fmt(d?.analysis?.VWAP)

/* =========================
   圖表
========================= */

function chart(points){

  if(
    !points ||
    !points.length
  ){

    return `
      <div class="chart">
        <div class="empty">
          尚無歷史資料
        </div>
      </div>
    `;

  }

  const values =
    points
      .map(
        x => Number(x.close)
      )
      .filter(
        Number.isFinite
      );

  if(values.length < 2){

    return `
      <div class="chart">
        <div class="empty">
          歷史資料不足
        </div>
      </div>
    `;

  }

  const min =
    Math.min(...values);

  const max =
    Math.max(...values);

  const width = 1000;
  const height = 300;
  const pad = 20;

  const pointsString =
    values
      .map(
        (value,index) => {

          const x =
            pad +
            index *
            (
              (width - pad * 2) /
              (values.length - 1)
            );

          const y =
            height -
            pad -
            (
              (value - min) /
              (max - min || 1)
            ) *
            (
              height - pad * 2
            );

          return `${x},${y}`;

        }
      )
      .join(" ");


  return `

    <div class="chart">

      <svg
        viewBox="0 0 ${width} ${height}"
        preserveAspectRatio="none"
      >

        <line
          x1="0"
          y1="25%"
          x2="${width}"
          y2="25%"
          stroke="#1b3045"
          stroke-width="1"
        />

        <line
          x1="0"
          y1="50%"
          x2="${width}"
          y2="50%"
          stroke="#1b3045"
          stroke-width="1"
        />

        <line
          x1="0"
          y1="75%"
          x2="${width}"
          y2="75%"
          stroke="#1b3045"
          stroke-width="1"
        />

        <polyline
          fill="none"
          stroke="#55a8ff"
          stroke-width="4"
          stroke-linejoin="round"
          stroke-linecap="round"
          points="${pointsString}"
        />

      </svg>

    </div>

  `;

}

/* =========================
   載入行情
========================= */

async function loadQuotes(){

  try{

    const symbols =
      seed
        .map(
          x => x[0]
        )
        .join(",");

    const data =
      await api(
        "/api/quotes?symbols=" +
        encodeURIComponent(symbols)
      );

    for(
      const quote
      of data.data || []
    ){

      const s =
        get(quote.symbol);

      Object.assign(
        s,
        quote
      );

    }

    status(
      true,
      "LIVE DATA · 已同步"
    );

    render();

  }catch(error){

    status(
      false,
      "API ERROR · " +
      error.message
    );

    render();

  }

}

/* =========================
   歷史資料
========================= */

async function loadHistory(
  symbol,
  range
){

  try{

    let interval =
      "1d";

    if(range === "1d"){
      interval = "5m";
    }

    if(range === "5d"){
      interval = "15m";
    }

    if(range === "10d"){
      interval = "30m";
    }

    const data =
      await api(
        "/api/history/" +
        encodeURIComponent(symbol) +
        "?range=" +
        encodeURIComponent(range) +
        "&interval=" +
        encodeURIComponent(interval)
      );

    if(!S.detail){
      S.detail = {};
    }

    S.detail.history =
      data.data || [];

    render();

  }catch(error){

    console.log(
      "history error",
      error
    );

  }

}

async function doSearch(){

  try{

    const data =
      await api(
        "/api/search?q=" +
        encodeURIComponent(q)
      );

    const results =
      $("results");

    results.innerHTML =
      (
        data.data || []
      )
      .map(
        item =>
          stockRow({
            ...item,
            price:null,
            changePct:null
          })
      )
      .join("")
      ||

function portfolio(){

          ${money(totalValue)}

        <div class="muted">
          可用現金
        </div>

        <div class="big">
          ${money(S.cash)}
        </div>

      </div>


      <div class="card">

        <div class="muted">
          模擬損益
        </div>

        <div class="
          big
          ${profitValue >= 0
            ? "up"
            : "down"}
        ">

          ${
            profitValue >= 0
              ? "+"
              : ""
          }

        </div>

      </div>

    </div>


    <div class="card">

      <h2>
        持倉
      </h2>

      ${
        entries.length

          ? entries
              .map(
                ([symbol,pos]) => {

                  const s =
                    get(symbol);

                  const pl =
                    pos.qty *
                    (s.price || 0) -
                    pos.cost;

                  return `

                    <div class="stock">

                      <div>

                        <div class="stock-symbol">
                          ${symbol}
                        </div>

                        <div class="stock-name">
                          ${s.name}
                        </div>

                        <div class="muted">
                          ${pos.qty} 股
                          · 成本
                          ${money(pos.cost)}
                        </div>

                      </div>

                      <div class="
                        ${pl >= 0
                          ? "up"
                          : "down"}
                      ">

                        ${
                          pl >= 0
                            ? "+"
                            : ""
                        }

                        ${money(pl)}

                      </div>

                    </div>

                  `;

                }
              )
              .join("")

          :

          `
            <div class="empty">
              目前沒有持倉
            </div>
          `
      }

    </div>

  `;

}


function value(){

  return S.cash +
    Object.entries(
      S.pos
    )
    .reduce(
      (
        total,
        [symbol,pos]
      ) =>
        total +
        pos.qty *
        (get(symbol).price || 0),
      0
    );

}


/* =========================
   模擬交易
========================= */

function trade(){

  return `

    <div class="grid">

      <div class="card wide">

        <h2>
          模擬交易
        </h2>

        <p class="muted">
          虛擬本金 NT$1,000,000。
          不連接任何真實券商。
        </p>

        <div class="trade">

          <select id="sym">

            ${
              stocks
                .map(
                  s =>
                    `
                    <option
                      ${
                        s.symbol ===
                        S.selected
                          ? "selected"
                          : ""
                      }
                    >
                      ${s.symbol}
                    </option>
                    `
                )
                .join("")
            }

          </select>


          <input
            id="qty"
            type="number"
            value="100"
            min="1"
            placeholder="股數"
          >

          <div class="actions">

            <button
              class="btn buy"
              onclick="tradeDo(true)"
            >
              買進
            </button>

            <button
              class="btn sell"
              onclick="tradeDo(false)"
            >
              賣出
            </button>

          </div>

        </div>

        <div
          id="msg"
          class="notice"
        ></div>

      </div>


      <div class="card">

        <h2>
          交易說明
        </h2>

        <div class="metric">
          <span>初始資金</span>
          <b>NT$1,000,000</b>
        </div>

        <div class="metric">
          <span>目前現金</span>
          <b>${money(S.cash)}</b>
        </div>

        <div class="notice">
          目前為紙上交易模擬，
          不會真的下單。
        </div>

      </div>

    </div>

  `;

}


function tradeDo(
  buy
){

  const symbol =
    $("sym").value;

  const qty =
    Math.max(
      1,
      Number(
        $("qty").value
      ) || 1
    );

  const s =
    get(symbol);

  if(s.price == null){

    $("msg").textContent =
      "目前沒有行情資料，暫時不能成交。";

    return;

  }

  const amount =
    qty *
    s.price;


  if(buy){

    if(S.cash < amount){

      $("msg").textContent =
        "現金不足。";

      return;

    }

    S.cash -=
      amount;

    if(!S.pos[symbol]){

      S.pos[symbol] = {
        qty:0,
        cost:0
      };

    }

    S.pos[symbol].qty +=
      qty;

    S.pos[symbol].cost +=
      amount;

    $("msg").textContent =
      `已模擬買進 ${symbol} ${qty} 股`;

  }else{

    const pos =
      S.pos[symbol];

    if(
      !pos ||
      pos.qty < qty
    ){

      $("msg").textContent =
        "持股不足。";

      return;

    }

    const average =
      pos.cost /
      pos.qty;

    S.cash +=
      amount;

    pos.qty -=
      qty;

    pos.cost -=
      average *
      qty;

    if(pos.qty <= 0){

      delete S.pos[symbol];

    }

    $("msg").textContent =
      `已模擬賣出 ${symbol} ${qty} 股`;

  }

  render();

}


/* =========================
   開啟股票
========================= */

function openStock(
  symbol
){

  S.selected =
    symbol;

  S.page =
    "home";

  S.range =
    "3mo";

  render();

  loadDetail(
    symbol
  );

}


/* =========================
   Render
========================= */

function render(){

  document
    .querySelectorAll("nav button")
    .forEach(
      button => {

        button.classList.toggle(
          "active",
          button.dataset.p ===
          S.page
        );

      }
    );


  let html = "";

  if(S.page === "home"){
    html = home();
  }

  else if(S.page === "search"){
    html = searchPage();
  }

  else if(S.page === "watch"){
    html = watch();
  }

  else if(S.page === "portfolio"){
    html = portfolio();
  }

  else if(S.page === "trade"){
    html = trade();
  }

  $("app").innerHTML =
    html;

}


/* =========================
   導覽
========================= */

document
  .querySelectorAll("nav button")
  .forEach(
    button => {

      button.onclick =
        () => {

          S.page =
            button.dataset.p;

          render();

        };

    }
  );


/* =========================
   啟動
========================= */

render();

loadQuotes();

loadMarket();

loadDetail(
  S.selected
);


/* 每 30 秒更新一次行情 */

setInterval(
  loadQuotes,
  30000
);


/* 每 60 秒更新市場 */

setInterval(
  loadMarket,
  60000
);

</script>
