<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<title>IAN STOCK</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:#07090d;
  color:#f5f7fa;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans TC",Arial,sans-serif;
}

body{
  padding-bottom:100px;
}

button,input,select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:18px 16px 110px;
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.logo{
  font-size:28px;
  font-weight:900;
  letter-spacing:.5px;
}

.status{
  font-size:12px;
  color:#42d392;
  border:1px solid #235e43;
  border-radius:20px;
  padding:7px 11px;
}

.search{
  width:100%;
  height:54px;
  background:#11151d;
  border:1px solid #252d39;
  border-radius:18px;
  color:white;
  padding:0 18px;
  outline:none;
  margin-bottom:14px;
}

.search:focus{
  border-color:#687589;
}

.market-switch{
  display:flex;
  background:#11151d;
  padding:4px;
  border-radius:15px;
  margin-bottom:18px;
}

.market-switch button{
  flex:1;
  padding:12px;
  border-radius:12px;
  background:transparent;
  color:#8993a2;
  font-weight:700;
}

.market-switch button.active{
  background:#202631;
  color:white;
}

.section-title{
  font-size:24px;
  font-weight:900;
  margin:28px 0 14px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.card{
  background:#11151d;
  border:1px solid #252d39;
  border-radius:20px;
  padding:18px;
}

.card-title{
  color:#8993a2;
  font-size:14px;
  margin-bottom:8px;
}

.big{
  font-size:25px;
  font-weight:900;
}

.green{
  color:#42d392;
}

.red{
  color:#ff6875;
}

.gray{
  color:#8993a2;
}

.stock-card{
  background:#11151d;
  border:1px solid #252d39;
  border-radius:20px;
  padding:18px;
  margin-bottom:10px;
  cursor:pointer;
}

.stock-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.stock-name{
  font-size:18px;
  font-weight:900;
}

.stock-symbol{
  color:#8993a2;
  font-size:13px;
  margin-top:4px;
}

.stock-price{
  font-size:21px;
  font-weight:900;
  text-align:right;
}

.stock-change{
  font-size:13px;
  margin-top:4px;
  text-align:right;
}

.detail-head{
  background:#11151d;
  border:1px solid #252d39;
  border-radius:22px;
  padding:20px;
}

.detail-name{
  font-size:27px;
  font-weight:900;
}

.detail-symbol{
  color:#8993a2;
  margin-top:4px;
}

.detail-price{
  font-size:40px;
  font-weight:900;
  margin-top:18px;
}

.detail-change{
  font-size:17px;
  margin-top:5px;
}

.back{
  background:#151a22;
  color:white;
  padding:10px 16px;
  border-radius:14px;
  margin-bottom:14px;
}

.tabs{
  display:flex;
  overflow-x:auto;
  gap:8px;
  margin:18px 0;
}

.tabs button{
  flex:none;
  background:#11151d;
  color:#8993a2;
  border:1px solid #252d39;
  padding:10px 15px;
  border-radius:14px;
}

.tabs button.active{
  color:white;
  background:#202631;
}

.metric{
  background:#11151d;
  border:1px solid #252d39;
  border-radius:18px;
  padding:17px;
}

.metric-label{
  color:#8993a2;
  font-size:13px;
}

.metric-value{
  font-size:22px;
  font-weight:900;
  margin-top:7px;
}

.ai-box{
  background:#11151d;
  border:1px solid #265f45;
  border-radius:20px;
  padding:20px;
  margin-bottom:12px;
}

.ai-title{
  font-size:20px;
  font-weight:900;
}

.ai-score{
  font-size:35px;
  font-weight:900;
  margin-top:10px;
}

.ai-tag{
  display:inline-block;
  border:1px solid #286846;
  color:#42d392;
  border-radius:20px;
  padding:6px 11px;
  font-size:13px;
  margin-top:8px;
}

.list{
  margin:10px 0 0;
  padding-left:20px;
  color:#c4cad3;
  line-height:1.8;
}

.trade{
  background:#11151d;
  border:1px solid #252d39;
  border-radius:20px;
  padding:18px;
}

.trade input{
  width:100%;
  height:48px;
  margin:6px 0;
  border-radius:13px;
  border:1px solid #252d39;
  background:#090c11;
  color:white;
  padding:0 13px;
}

.trade button{
  width:100%;
  height:48px;
  border-radius:14px;
  background:#f5f7fa;
  color:#07090d;
  font-weight:900;
  margin-top:8px;
}

.notice{
  padding:14px;
  border-radius:16px;
  background:#11151d;
  color:#8993a2;
  border:1px solid #252d39;
}

.hidden{
  display:none!important;
}

.empty{
  text-align:center;
  color:#8993a2;
  padding:35px 10px;
}

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:100;
  background:rgba(7,9,13,.96);
  border-top:1px solid #252d39;
  backdrop-filter:blur(18px);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
}

.bottom-inner{
  max-width:900px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
}

.nav{
  min-height:65px;
  border-radius:17px;
  background:transparent;
  color:#778190;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:4px;
}

.nav.active{
  background:#1a202a;
  color:white;
}

.nav-icon{
  font-size:22px;
}

.nav-text{
  font-size:12px;
  font-weight:700;
}

@media(min-width:700px){
  .grid{
    grid-template-columns:repeat(3,1fr);
  }
}
</style>
</head>

<body>

<div class="app">

<header class="header">
  <div class="logo">IAN STOCK</div>
  <div class="status" id="serverStatus">● SYSTEM</div>
</header>

<div id="searchArea">
  <input
    id="searchInput"
    class="search"
    placeholder="搜尋股票代號或公司名稱，例如 2330 / NVDA"
    autocomplete="off"
  >
</div>

<div id="searchResults"></div>

<!-- HOME -->
<section id="homePage">

  <div class="market-switch">
    <button id="twBtn" class="active" onclick="setMarket('TW')">🇹🇼 台股</button>
    <button id="usBtn" onclick="setMarket('US')">🇺🇸 美股</button>
  </div>

  <div class="section-title">市場脈動</div>

  <div class="grid">
    <div class="card">
      <div class="card-title">台灣加權指數</div>
      <div class="big" id="twIndex">載入中</div>
    </div>

    <div class="card">
      <div class="card-title">NASDAQ</div>
      <div class="big" id="nasdaq">載入中</div>
    </div>

    <div class="card">
      <div class="card-title">S&P 500</div>
      <div class="big" id="sp500">載入中</div>
    </div>

    <div class="card">
      <div class="card-title">USD / TWD</div>
      <div class="big" id="usdTwd">載入中</div>
    </div>
  </div>

  <div class="section-title">熱門股票</div>

  <div id="hotStocks"></div>

</section>


<!-- SEARCH -->
<section id="searchPage" class="hidden">

  <div class="section-title">搜尋股票</div>

  <div id="allStocks"></div>

</section>


<!-- WATCHLIST -->
<section id="watchPage" class="hidden">

  <div class="section-title">⭐ 我的自選</div>

  <div id="watchList"></div>

</section>


<!-- PORTFOLIO -->
<section id="portfolioPage" class="hidden">

  <div class="section-title">投資組合</div>

  <div class="grid">

    <div class="card">
      <div class="card-title">模擬資金</div>
      <div class="big" id="cash">NT$1,000,000</div>
    </div>

    <div class="card">
      <div class="card-title">持倉市值</div>
      <div class="big" id="portfolioValue">NT$0</div>
    </div>

    <div class="card">
      <div class="card-title">未實現損益</div>
      <div class="big" id="profit">NT$0</div>
    </div>

    <div class="card">
      <div class="card-title">報酬率</div>
      <div class="big" id="roi">0%</div>
    </div>

  </div>

  <div class="section-title">模擬交易</div>

  <div class="trade">

    <input id="tradeSymbol" placeholder="股票代號，例如 NVDA / 2330">

    <input id="tradeShares" type="number" placeholder="股數">

    <input id="tradePrice" type="number" placeholder="買入價格">

    <button onclick="paperBuy()">模擬買入</button>

  </div>

  <div class="section-title">目前持倉</div>

  <div id="positions"></div>

</section>


<!-- AI -->
<section id="aiPage" class="hidden">

  <div class="section-title">🤖 IAN AI</div>

  <div class="notice">
    輸入股票代號後，IAN AI 會根據行情與技術指標產生資訊摘要。
  </div>

  <div style="height:12px"></div>

  <input
    id="aiSymbol"
    class="search"
    placeholder="例如 NVDA、AAPL、2330"
  >

  <button
    onclick="runAI()"
    style="
      width:100%;
      height:50px;
      border-radius:15px;
      background:#f5f7fa;
      color:#07090d;
      font-weight:900;
    "
  >
    開始分析
  </button>

  <div id="aiResult" style="margin-top:15px"></div>

</section>


<!-- STOCK DETAIL -->
<section id="detailPage" class="hidden">

  <button class="back" onclick="showPage('home')">
    ← 返回
  </button>

  <div id="detailContent"></div>

</section>

</div>


<!-- BOTTOM NAV -->
<nav class="bottom">

  <div class="bottom-inner">

    <button class="nav active" id="navHome" onclick="showPage('home')">
      <div class="nav-icon">⌂</div>
      <div class="nav-text">首頁</div>
    </button>

    <button class="nav" id="navSearch" onclick="showPage('search')">
      <div class="nav-icon">⌕</div>
      <div class="nav-text">搜尋</div>
    </button>

    <button class="nav" id="navWatch" onclick="showPage('watch')">
      <div class="nav-icon">☆</div>
      <div class="nav-text">自選</div>
    </button>

    <button class="nav" id="navPortfolio" onclick="showPage('portfolio')">
      <div class="nav-icon">▣</div>
      <div class="nav-text">投資組合</div>
    </button>

    <button class="nav" id="navAI" onclick="showPage('ai')">
      <div class="nav-icon">AI</div>
      <div class="nav-text">AI</div>
    </button>

  </div>

</nav>


<script>

const API_BASE =
  "https://ian-stock-api.onrender.com";


let currentMarket = "TW";

let stocks = [];

let watchlist =
  JSON.parse(
    localStorage.getItem(
      "ian_watchlist"
    ) || "[]"
  );

let positions =
  JSON.parse(
    localStorage.getItem(
      "ian_positions"
    ) || "[]"
  );


const stockDatabase = [

  {symbol:"2330",name:"台積電",market:"TW"},
  {symbol:"2317",name:"鴻海",market:"TW"},
  {symbol:"2454",name:"聯發科",market:"TW"},
  {symbol:"2303",name:"聯電",market:"TW"},
  {symbol:"2308",name:"台達電",market:"TW"},
  {symbol:"2382",name:"廣達",market:"TW"},
  {symbol:"2603",name:"長榮",market:"TW"},
  {symbol:"2615",name:"萬海",market:"TW"},
  {symbol:"2881",name:"富邦金",market:"TW"},
  {symbol:"2882",name:"國泰金",market:"TW"},

  {symbol:"NVDA",name:"NVIDIA",market:"US"},
  {symbol:"AAPL",name:"Apple",market:"US"},
  {symbol:"MSFT",name:"Microsoft",market:"US"},
  {symbol:"AMZN",name:"Amazon",market:"US"},
  {symbol:"GOOGL",name:"Alphabet",market:"US"},
  {symbol:"META",name:"Meta",market:"US"},
  {symbol:"TSLA",name:"Tesla",market:"US"},
  {symbol:"AMD",name:"AMD",market:"US"},
  {symbol:"AVGO",name:"Broadcom",market:"US"},
  {symbol:"TSM",name:"Taiwan Semiconductor",market:"US"}

];


function money(
  value,
  currency="NT$"
){

  if(
    value === null ||
    value === undefined ||
    !Number.isFinite(Number(value))
  ){
    return "待資料";
  }

  return currency +
    Number(value)
      .toLocaleString(
        "zh-TW",
        {
          maximumFractionDigits:2
        }
      );
}


function number(
  value
){

  if(
    value === null ||
    value === undefined ||
    !Number.isFinite(Number(value))
  ){
    return "待資料";
  }

  return Number(value)
    .toLocaleString(
      "zh-TW",
      {
        maximumFractionDigits:2
      }
    );
}


function changeClass(value){

  if(
    Number(value) > 0
  ) return "green";

  if(
    Number(value) < 0
  ) return "red";

  return "gray";
}


function save(){

  localStorage.setItem(
    "ian_watchlist",
    JSON.stringify(watchlist)
  );

  localStorage.setItem(
    "ian_positions",
    JSON.stringify(positions)
  );
}


/* ==========================
   NAVIGATION
========================== */

function showPage(page){

  const pages = [
    "home",
    "search",
    "watch",
    "portfolio",
    "ai",
    "detail"
  ];

  pages.forEach(
    p => {

      const el =
        document.getElementById(
          p + "Page"
        );

      if(el){
        el.classList.toggle(
          "hidden",
          p !== page
        );
      }
    }
  );


  document
    .querySelectorAll(".nav")
    .forEach(
      el =>
        el.classList.remove(
          "active"
        )
    );


  const map = {

    home:"navHome",
    search:"navSearch",
    watch:"navWatch",
    portfolio:"navPortfolio",
    ai:"navAI"

  };


  if(map[page]){

    document
      .getElementById(
        map[page]
      )
      .classList.add(
        "active"
      );
  }


  if(page === "search"){
    renderAllStocks();
  }

  if(page === "watch"){
    renderWatchlist();
  }

  if(page === "portfolio"){
    renderPortfolio();
  }

  window.scrollTo(
    0,
    0
  );
}


/* ==========================
   MARKET
========================== */

function setMarket(
  market
){

  currentMarket =
    market;

  document
    .getElementById(
      "twBtn"
    )
    .classList.toggle(
      "active",
      market === "TW"
    );

  document
    .getElementById(
      "usBtn"
    )
    .classList.toggle(
      "active",
      market === "US"
    );

  loadHotStocks();
}


/* ==========================
   API
========================== */

async function api(
  path
){

  const response =
    await fetch(
      API_BASE + path
    );

  if(!response.ok){

    throw new Error(
      "API " +
      response.status
    );
  }

  return response.json();
}


/* ==========================
   SERVER STATUS
========================== */

async function loadStatus(){

  try{

    const data =
      await api(
        "/api/status"
      );

    const el =
      document.getElementById(
        "serverStatus"
      );

    if(
      data.yahooFinance === "OK" &&
      data.history === "OK"
    ){

      el.textContent =
        "● LIVE DATA";

      el.style.color =
        "#42d392";

    }else{

      el.textContent =
        "● API ERROR";

      el.style.color =
        "#ff6875";
    }

  }catch(error){

    document
      .getElementById(
        "serverStatus"
      )
      .textContent =
        "● OFFLINE";
  }
}


/* ==========================
   MARKET DATA
========================== */

async function loadMarket(){

  try{

    const data =
      await api(
        "/api/market"
      );


    const items = {

      twIndex:
        data.taiwan,

      nasdaq:
        data.nasdaq,

      sp500:
        data.sp500,

      usdTwd:
        data.usdTwd

    };


    Object
      .entries(items)
      .forEach(
        ([id,item]) => {

          const el =
            document.getElementById(
              id
            );

          if(
            item &&
            item.ok
          ){

            el.textContent =
              number(
                item.price
              );

          }else{

            el.textContent =
              "待資料";
          }
        }
      );

  }catch(error){

    console.log(
      "market error",
      error
    );
  }
}


/* ==========================
   HOT STOCKS
========================== */

async function loadHotStocks(){

  const container =
    document.getElementById(
      "hotStocks"
    );

  const list =
    stockDatabase
      .filter(
        s =>
          s.market ===
          currentMarket
      )
      .slice(
        0,
        6
      );


  container.innerHTML =
    `<div class="empty">載入行情中...</div>`;


  try{

    const data =
      await api(
        "/api/quotes?symbols=" +
        list
          .map(
            s => s.symbol
          )
          .join(",")
      );


    const results =
      data.results || [];


    container.innerHTML =
      "";


    list.forEach(
      stock => {

        const quote =
          results.find(
            r =>
              r.symbol ===
              stock.symbol
          );


        const card =
          document.createElement(
            "div"
          );

        card.className =
          "stock-card";


        const price =
          quote &&
          quote.ok
            ? number(
                quote.price
              )
            : "待資料";


        const pct =
          quote &&
          quote.ok
            ? (
                quote.changePct >= 0
                  ? "+"
                  : ""
              ) +
              number(
                quote.changePct
              ) +
              "%"
            : "待資料";


        card.innerHTML = `

          <div class="stock-top">

            <div>

              <div class="stock-name">
                ${stock.name}
              </div>

              <div class="stock-symbol">
                ${stock.symbol}
              </div>

            </div>

            <div>

              <div class="stock-price">
                ${price}
              </div>

              <div class="stock-change ${
                quote
                  ? changeClass(
                      quote.changePct
                    )
                  : "gray"
              }">
                ${pct}
              </div>

            </div>

          </div>
        `;


        card.onclick =
          () =>
            openStock(
              stock.symbol
            );


        container.appendChild(
          card
        );
      }
    );

  }catch(error){

    container.innerHTML =
      `<div class="empty">行情暫時無法取得</div>`;
  }
}


/* ==========================
   SEARCH
========================== */

let searchTimer;


document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "input",
    function(){

      clearTimeout(
        searchTimer
      );

      const q =
        this.value
          .trim()
          .toUpperCase();


      if(!q){

        document
          .getElementById(
            "searchResults"
          )
          .innerHTML =
          "";

        return;
      }


      searchTimer =
        setTimeout(
          () =>
            searchStocks(q),
          250
        );
    }
  );


async function searchStocks(
  q
){

  try{

    const data =
      await api(
        "/api/search?q=" +
        encodeURIComponent(q)
      );


    const box =
      document.getElementById(
        "searchResults"
      );


    box.innerHTML =
      "";


    (data.results || [])
      .slice(0,8)
      .forEach(
        stock => {

          const el =
            document.createElement(
              "div"
            );

          el.className =
            "stock-card";


          el.innerHTML = `

            <div class="stock-name">
              ${stock.name}
            </div>

            <div class="stock-symbol">
              ${stock.symbol}
              ·
              ${stock.market}
            </div>
          `;


          el.onclick =
            () =>
              openStock(
                stock.symbol
              );


          box.appendChild(
            el
          );
        }
      );

  }catch(error){

    console.log(
      error
    );
  }
}


/* ==========================
   ALL STOCKS
========================== */

function renderAllStocks(){

  const box =
    document.getElementById(
      "allStocks"
    );


  box.innerHTML =
    "";


  stockDatabase
    .filter(
      s =>
        s.market ===
        currentMarket
    )
    .forEach(
      stock => {

        const el =
          document.createElement(
            "div"
          );

        el.className =
          "stock-card";


        el.innerHTML = `

          <div class="stock-name">
            ${stock.name}
          </div>

          <div class="stock-symbol">
            ${stock.symbol}
          </div>
        `;


        el.onclick =
          () =>
            openStock(
              stock.symbol
            );


        box.appendChild(
          el
        );
      }
    );
}


/* ==========================
   STOCK DETAIL
========================== */

async function openStock(
  symbol
){

  showPage(
    "detail"
  );


  const content =
    document.getElementById(
      "detailContent"
    );


  content.innerHTML =
    `<div class="empty">正在取得 ${symbol} 行情...</div>`;


  try{

    const data =
      await api(
        "/api/stock/" +
        encodeURIComponent(
          symbol
        )
      );


    renderDetail(
      data

  }catch(error){

}

function metric(
  label,
  value,
  volume=false
){

  let display =
    "待資料";


  if(
    value !== null &&
    value !== undefined &&
    Number.isFinite(
      Number(value)
    )
  ){

    display =
      volume
        ? Number(value)
            .toLocaleString(
              "zh-TW"
            )
        : number(value);
  }


  return `

    <div class="metric">

      <div class="metric-label">
        ${label}
      </div>

      <div class="metric-value">
        ${display}
      </div>

    </div>
  `;
}


/* ==========================
   WATCHLIST
========================== */

function toggleWatch(
  symbol
){

  const index =
    watchlist.indexOf(
      symbol
    );


  if(index >= 0){

    watchlist.splice(
      index,
      1
    );

  }else{

    watchlist.push(
      symbol
    );
  }


  save();

  renderWatchlist();

  openStock(
    symbol
  );
}


async function renderWatchlist(){

  const box =
    document.getElementById(
      "watchList"
    );


  if(
    watchlist.length === 0
  ){

    box.innerHTML =
      `<div class="empty">目前還沒有自選股</div>`;

    return;
  }


  box.innerHTML =
    `<div class="empty">載入自選股...</div>`;


  try{

    const data =
      await api(
        "/api/quotes?symbols=" +
        watchlist.join(",")
      );


    box.innerHTML =
      "";


    watchlist.forEach(
      symbol => {

        const quote =
          (
            data.results ||
            []
          ).find(
            x =>
              x.symbol ===
              symbol
          );


        const stock =
          stockDatabase.find(
            s =>
              s.symbol ===
              symbol
          );


        const name =
          stock
            ? stock.name
            : symbol;


        const el =
          document.createElement(
            "div"
          );


        el.className =
          "stock-card";


        el.innerHTML = `

          <div class="stock-top">

            <div>

              <div class="stock-name">
                ${name}
              </div>

              <div class="stock-symbol">
                ${symbol}
              </div>

            </div>

            <div>

              <div class="stock-price">
                ${
                  quote
                    ? number(
                        quote.price
                      )
                    : "待資料"
                }
              </div>

              <div class="${
                quote
                  ? changeClass(
                      quote.changePct
                    )
                  : "gray"
              }">
                ${
                  quote
                    ? number(
                        quote.changePct
                      ) + "%"
                    : "待資料"
                }
              </div>

            </div>

          </div>
        `;


        el.onclick =
          () =>
            openStock(
              symbol
            );


        box.appendChild(
          el
        );
      }
    );

  }catch(error){

    box.innerHTML =
      `<div class="empty">無法取得自選行情</div>`;
  }
}


/* ==========================
   PORTFOLIO
========================== */

function paperBuy(){

  const symbol =
    document
      .getElementById(
        "tradeSymbol"
      )
      .value
      .trim()
      .toUpperCase();


  const shares =
    Number(
      document
        .getElementById(
          "tradeShares"
        )
        .value
    );


  const price =
    Number(
      document
        .getElementById(
          "tradePrice"
        )
        .value
    );


  if(
    !symbol ||
    shares <= 0 ||
    price <= 0
  ){

    alert(
      "請輸入股票代號、股數與價格"
    );

    return;
  }


  const existing =
    positions.find(
      p =>
        p.symbol ===
        symbol
    );


  if(existing){

    const totalCost =
      existing.shares *
      existing.avgPrice;


    existing.shares +=
      shares;


    existing.avgPrice =
      (
        totalCost +
        shares * price
      ) /
      existing.shares;

  }else{

    positions.push({

      symbol,

      shares,

      avgPrice:
        price

    });
  }


  save();

  renderPortfolio();


  document
    .getElementById(
      "tradeSymbol"
    )
    .value =
    "";

  document
    .getElementById(
      "tradeShares"
    )
    .value =
    "";

  document
    .getElementById(
      "tradePrice"
    )
    .value =
    "";
}


async function renderPortfolio(){

  const box =
    document.getElementById(
      "positions"
    );


  if(
    positions.length === 0
  ){

    box.innerHTML =
      `<div class="empty">目前沒有模擬持倉</div>`;

    document
      .getElementById(
        "portfolioValue"
      )
      .textContent =
      "NT$0";

    document
      .getElementById(
        "profit"
      )
      .textContent =
      "NT$0";

    document
      .getElementById(
        "roi"
      )
      .textContent =
      "0%";

    return;
  }


  try{

    const data =
      await api(
        "/api/quotes?symbols=" +
        positions
          .map(
            p =>
              p.symbol
          )
          .join(",")
      );


    box.innerHTML =
      "";


    let value = 0;
    let cost = 0;


    positions.forEach(
      p => {

        const quote =
          (
            data.results ||
            []
          ).find(
            x =>
              x.symbol ===
              p.symbol
          );


        const current =
          quote
            ? quote.price
            : p.avgPrice;


        const positionValue =
          current *
          p.shares;


        const positionCost =
          p.avgPrice *
          p.shares;


        value +=
          positionValue;


        cost +=
          positionCost;


        const pnl =
          positionValue -
          positionCost;


        const el =
          document.createElement(
            "div"
          );


        el.className =
          "stock-card";


        el.innerHTML = `

          <div class="stock-top">

            <div>

              <div class="stock-name">
                ${p.symbol}
              </div>

              <div class="stock-symbol">
                ${p.shares} 股
              </div>

            </div>

            <div>

              <div class="stock-price">
                ${number(positionValue)}
              </div>

              <div class="${changeClass(pnl)}">
                ${
                  pnl >= 0
                    ? "+"
                    : ""
                }${number(pnl)}
              </div>

            </div>

          </div>
        `;


        box.appendChild(
          el
        );
      }
    );


    const profit =
      value -
      cost;


    document
      .getElementById(
        "portfolioValue"
      )
      .textContent =
      money(value);


    document
      .getElementById(
        "profit"
      )
      .textContent =
      money(profit);


    document
      .getElementById(
        "profit"
      )
      .className =
      "big " +
      changeClass(
        profit
      );


    document
      .getElementById(
        "roi"
      )
      .textContent =
      cost
        ? (
            profit /
            cost *
            100
          ).toFixed(2) +
          "%"
        : "0%";

  }catch(error){

    box.innerHTML =
      `<div class="empty">行情暫時無法取得</div>`;
  }
}
