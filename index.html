<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<title>IAN STOCK</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#07090d;color:#f5f7fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding-bottom:90px}
button,input{font:inherit}
button{cursor:pointer}
.app{max-width:820px;margin:auto;padding:18px 16px 110px}

.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.logo{font-size:28px;font-weight:900}
.logo span{color:#37d67a}
.status{padding:7px 11px;border-radius:20px;background:#18201b;color:#37d67a;font-size:11px;font-weight:800}
.status.error{background:#291619;color:#ff5964}

.search{display:flex;gap:8px;margin-bottom:14px}
.search input{flex:1;min-width:0;background:#11151c;border:1px solid #262d38;border-radius:14px;color:white;padding:13px 14px;outline:none}
.search button{border:0;border-radius:14px;background:#37d67a;color:#06100a;padding:0 17px;font-weight:900}

.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:15px}
.tab{border:1px solid #252c37;background:#11151c;color:#8d96a4;border-radius:20px;padding:8px 14px;white-space:nowrap}
.tab.active{background:#37d67a;color:#06100a;border-color:#37d67a}

.section-title{display:flex;justify-content:space-between;align-items:center;margin:22px 0 11px}
.section-title h2{font-size:18px;margin:0}
.section-title small{color:#727b88}

.market-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.market-card,.stock,.card,.tech,.analysis,.score-box,.detail-head,.chart,.portfolio-card{
background:#11151c;border:1px solid #222a35;border-radius:17px
}

.market-card{padding:13px 11px;cursor:pointer}
.market-card .name{color:#8992a0;font-size:12px}
.market-card .price{font-size:18px;font-weight:900;margin-top:5px}
.market-card .change{font-size:12px;margin-top:3px}

.up{color:#37d67a}.down{color:#ff5964}.wait{color:#747d89}

.stock-list{display:flex;flex-direction:column;gap:9px}
.stock{padding:15px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.stock-left{display:flex;flex-direction:column;gap:4px}
.stock-symbol{font-weight:900;font-size:16px}
.stock-name{font-size:12px;color:#808996}
.stock-right{text-align:right}
.stock-price{font-weight:900}
.stock-change{font-size:12px;margin-top:3px}

.hidden{display:none!important}

.back{border:1px solid #28313d;background:#151b23;color:white;border-radius:13px;padding:10px 15px;margin-bottom:15px}

.detail-head{padding:18px}
.detail-symbol{font-size:14px;color:#8a94a2}
.detail-name{font-size:27px;font-weight:900;margin-top:4px}
.detail-price{font-size:36px;font-weight:900;margin-top:14px}
.detail-change{font-size:14px;margin-top:3px}

.score-box{padding:18px;margin-top:12px}
.score-title{color:#858e9b;font-size:12px}
.score{font-size:42px;font-weight:900;margin-top:2px}
.score-note{font-size:11px;color:#69727e;margin-top:5px}

.tech-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.tech{padding:14px;cursor:pointer}
.tech-label{font-size:11px;color:#808996}
.tech-value{font-size:18px;font-weight:900;margin-top:5px}

.analysis{padding:15px}
.analysis-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #252c36}
.analysis-row:last-child{border-bottom:0}
.analysis-label{color:#828b98}

.chart{padding:12px;overflow:hidden}
canvas{width:100%;height:270px;display:block}

.card{padding:16px}
.empty{text-align:center;color:#707986;padding:40px 15px}

.portfolio-total{font-size:29px;font-weight:900;margin-top:4px}
.portfolio-sub{font-size:12px;color:#7d8693;margin-top:5px}

.action-row{display:flex;gap:8px;margin-top:12px}
.action-row button{flex:1;border:0;border-radius:12px;padding:11px;font-weight:800}
.buy{background:#37d67a;color:#06100a}
.sell{background:#ff5964;color:white}
.secondary{background:#202732;color:white}

.form{display:grid;gap:9px;margin-top:12px}
.form input{background:#0c1016;border:1px solid #28313c;color:white;border-radius:11px;padding:11px;outline:none}

.ai-box{padding:17px;background:#11151c;border:1px solid #222a35;border-radius:17px;margin-bottom:10px}
.ai-title{font-weight:900;font-size:17px}
.ai-text{color:#858e9b;font-size:13px;line-height:1.7;margin-top:9px}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.68);display:flex;align-items:flex-end;z-index:100}
.modal{width:min(820px,100%);margin:auto;background:#11151c;border:1px solid #2a323e;border-radius:23px 23px 0 0;padding:20px;max-height:85vh;overflow:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center}
.close{background:#242b35;color:white;border:0;border-radius:50%;width:35px;height:35px}
.modal h2{margin:0}
.modal p{color:#8b94a0;line-height:1.7;font-size:13px}

.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(7,9,13,.97);backdrop-filter:blur(18px);border-top:1px solid #202732;z-index:50}
.bottom-inner{max-width:820px;margin:auto;display:flex;justify-content:space-around;padding:10px 5px calc(10px + env(safe-area-inset-bottom))}
.nav{color:#707986;text-align:center;font-size:10px;cursor:pointer;min-width:55px}
.nav.active{color:#37d67a}
.nav-icon{font-size:20px;margin-bottom:2px}

.toast{position:fixed;left:50%;bottom:95px;transform:translateX(-50%);background:#202732;color:white;border:1px solid #333d4a;border-radius:12px;padding:10px 15px;font-size:12px;z-index:200}

@media(max-width:430px){
.market-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>

<div class="app">

<!-- ================= HOME ================= -->

<section id="homePage">

<div class="header">
<div class="logo">IAN <span>STOCK</span></div>
<div id="apiStatus" class="status">連線中</div>
</div>

<div class="search">
<input id="searchInput" placeholder="搜尋股票代號 / 公司名稱">
<button onclick="searchStock()">搜尋</button>
</div>

<div id="searchResult"></div>

<div class="tabs">
<button class="tab active" onclick="setMarket('ALL',this)">全部</button>
<button class="tab" onclick="setMarket('TW',this)">🇹🇼 台股</button>
<button class="tab" onclick="setMarket('US',this)">🇺🇸 美股</button>
</div>

<div class="section-title">
<h2>市場脈動</h2>
<small id="updateTime">等待資料</small>
</div>

<div id="marketGrid" class="market-grid"></div>

<div class="section-title">
<h2>熱門股票</h2>
<small>LIVE</small>
</div>

<div id="stockList" class="stock-list"></div>

</section>


<!-- ================= DETAIL ================= -->

<section id="detailPage" class="hidden">

<button class="back" onclick="showHome()">← 返回</button>

<div id="detailContent"></div>

</section>


<!-- ================= WATCHLIST ================= -->

<section id="watchPage" class="hidden">

<div class="section-title">
<h2>⭐ 我的自選</h2>
<small id="watchCount"></small>
</div>

<div id="watchList" class="stock-list"></div>

</section>


<!-- ================= PORTFOLIO ================= -->

<section id="portfolioPage" class="hidden">

<div class="section-title">
<h2>💼 投資組合</h2>
<small>模擬交易</small>
</div>

<div class="portfolio-card card">

<div style="color:#858e9b;font-size:12px">
總資產
</div>

<div id="portfolioValue" class="portfolio-total">
NT$0
</div>

<div id="portfolioPnL" class="portfolio-sub">
損益：NT$0
</div>

<div class="action-row">
<button class="buy" onclick="openTrade('BUY')">買入</button>
<button class="sell" onclick="openTrade('SELL')">賣出</button>
</div>

</div>

<div class="section-title">
<h2>持倉</h2>
</div>

<div id="portfolioList" class="stock-list"></div>

</section>


<!-- ================= AI ================= -->

<section id="aiPage" class="hidden">

<div class="section-title">
<h2>✦ IAN AI</h2>
<small>技術分析</small>
</div>

<div class="ai-box">

<div class="ai-title">
IAN AI 技術雷達
</div>

<div class="ai-text">
選擇股票後，IAN AI 會整理目前的趨勢、動能、均線、RSI、MACD、布林通道、VWAP、支撐與壓力等資料。
</div>

</div>

<div id="aiContent">

<div class="empty">
請先選擇一檔股票
</div>

</div>

</section>

</div>


<!-- ================= BOTTOM ================= -->

<div class="bottom">

<div class="bottom-inner">

<div class="nav active" id="navHome" onclick="goPage('home')">
<div class="nav-icon">⌂</div>
首頁
</div>

<div class="nav" id="navSearch" onclick="focusSearch()">
<div class="nav-icon">⌕</div>
搜尋
</div>

<div class="nav" id="navWatch" onclick="goPage('watch')">
<div class="nav-icon">☆</div>
自選
</div>

<div class="nav" id="navPortfolio" onclick="goPage('portfolio')">
<div class="nav-icon">◈</div>
投資組合
</div>

<div class="nav" id="navAI" onclick="goPage('ai')">
<div class="nav-icon">✦</div>
IAN AI
</div>

</div>

</div>


<!-- ================= MODAL ================= -->

<div id="modalBg" class="modal-bg hidden" onclick="closeModal(event)">
<div class="modal" id="modalBox"></div>
</div>

<div id="toast" class="toast hidden"></div>


<script>

/* =====================================================
   IAN STOCK V11
   ===================================================== */

const API_BASE =
"https://ian-stock-api.onrender.com";

const STOCKS = [
{symbol:"2330",name:"台積電",market:"TW"},
{symbol:"2317",name:"鴻海",market:"TW"},
{symbol:"2454",name:"聯發科",market:"TW"},
{symbol:"2303",name:"聯電",market:"TW"},
{symbol:"2382",name:"廣達",market:"TW"},
{symbol:"3711",name:"日月光投控",market:"TW"},
{symbol:"2881",name:"富邦金",market:"TW"},
{symbol:"2882",name:"國泰金",market:"TW"},
{symbol:"2603",name:"長榮",market:"TW"},
{symbol:"2618",name:"長榮航",market:"TW"},
{symbol:"3231",name:"緯創",market:"TW"},
{symbol:"2357",name:"華碩",market:"TW"},
{symbol:"NVDA",name:"NVIDIA",market:"US"},
{symbol:"AAPL",name:"Apple",market:"US"},
{symbol:"MSFT",name:"Microsoft",market:"US"},
{symbol:"AMZN",name:"Amazon",market:"US"},
{symbol:"GOOGL",name:"Alphabet",market:"US"},
{symbol:"META",name:"Meta",market:"US"},
{symbol:"TSLA",name:"Tesla",market:"US"},
{symbol:"AMD",name:"AMD",market:"US"},
{symbol:"AVGO",name:"Broadcom",market:"US"}
];

let quotes=[];
let currentSymbol=null;
let currentMarket="ALL";

let watchlist =
JSON.parse(localStorage.getItem("ian_watchlist")||"[]");

let portfolio =
JSON.parse(localStorage.getItem("ian_portfolio")||"[]");


/* ================= UTIL ================= */

function money(v){
if(v===null||v===undefined||!Number.isFinite(Number(v)))return"--";
return Number(v).toLocaleString("zh-TW",{maximumFractionDigits:2});
}

function percent(v){
if(v===null||v===undefined||!Number.isFinite(Number(v)))return"--";
let n=Number(v);
return (n>=0?"+":"")+n.toFixed(2)+"%";
}

function toast(msg){
let el=document.getElementById("toast");
el.textContent=msg;
el.classList.remove("hidden");
setTimeout(()=>el.classList.add("hidden"),1800);
}

async function api(path){
let r=await fetch(API_BASE+path,{cache:"no-store"});
if(!r.ok)throw new Error("API "+r.status);
return r.json();
}


/* ================= STATUS ================= */

function setStatus(ok){
let el=document.getElementById("apiStatus");

if(ok){
el.textContent="● LIVE DATA";
el.className="status";
}else{
el.textContent="API ERROR";
el.className="status error";
}
}


/* ================= PAGE ================= */

function hidePages(){
["homePage","detailPage","watchPage","portfolioPage","aiPage"]
.forEach(id=>document.getElementById(id).classList.add("hidden"));

document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));
}

function goPage(page){

hidePages();

if(page==="home"){
document.getElementById("homePage").classList.remove("hidden");
document.getElementById("navHome").classList.add("active");
loadQuotes();
}

if(page==="watch"){
document.getElementById("watchPage").classList.remove("hidden");
document.getElementById("navWatch").classList.add("active");
renderWatchlist();
}

if(page==="portfolio"){
document.getElementById("portfolioPage").classList.remove("hidden");
document.getElementById("navPortfolio").classList.add("active");
renderPortfolio();
}

if(page==="ai"){
document.getElementById("aiPage").classList.remove("hidden");
document.getElementById("navAI").classList.add("active");
renderAI();
}

}


/* ================= HOME ================= */

async function loadQuotes(){

try{

let data=await api("/api/quotes");

if(!Array.isArray(data))throw new Error("DATA");

quotes=data;

setStatus(true);
renderMarket();
renderStocks();

document.getElementById("updateTime").textContent=
new Date().toLocaleTimeString("zh-TW");

}catch(e){

console.error(e);
setStatus(false);

}

}


/* ================= MARKET ================= */

function getStock(symbol){
return STOCKS.find(x=>x.symbol===symbol);
}

function getQuote(symbol){
return quotes.find(x=>
String(x.symbol).toUpperCase()===symbol.toUpperCase()
);
}

function setMarket(m,button){

currentMarket=m;

document.querySelectorAll(".tab")
.forEach(x=>x.classList.remove("active"));

button.classList.add("active");

renderMarket();
renderStocks();

}

function renderMarket(){

let box=document.getElementById("marketGrid");
box.innerHTML="";

let list=STOCKS.filter(x=>
currentMarket==="ALL"||x.market===currentMarket
).slice(0,6);

list.forEach(stock=>{

let q=getQuote(stock.symbol);

let ch=q?.changePct;

box.innerHTML+=`

<div class="market-card"
onclick="openStock('${stock.symbol}')">

<div class="name">
${stock.name} · ${stock.symbol}
</div>

<div class="price">
${money(q?.price)}
</div>

<div class="change ${ch>=0?"up":ch===null?"wait":"down"}">
${percent(ch)}
</div>

</div>

`;

});

}


/* ================= STOCK LIST ================= */

function renderStocks(){

let box=document.getElementById("stockList");

let list=STOCKS.filter(x=>
currentMarket==="ALL"||x.market===currentMarket
);

box.innerHTML=list.map(stock=>{

let q=getQuote(stock.symbol);
let ch=q?.changePct;

return `

<div class="stock"
onclick="openStock('${stock.symbol}')">

<div class="stock-left">

<div class="stock-symbol">
${stock.symbol}
</div>

<div class="stock-name">
${stock.name} · ${stock.market}
</div>

</div>

<div class="stock-right">

<div class="stock-price">
${money(q?.price)}
</div>

<div class="stock-change ${ch>=0?"up":ch===null?"wait":"down"}">
${percent(ch)}
</div>

</div>

</div>

`;

}).join("");

}


/* ================= SEARCH ================= */

async function searchStock(){

let q=
document.getElementById("searchInput")
.value.trim();

if(!q){
document.getElementById("searchResult").innerHTML="";
return;
}

try{

let result=await api(
"/api/search?q="+encodeURIComponent(q)
);

document.getElementById("searchResult").innerHTML=

result.length

?

`<div class="section-title">
<h2>搜尋結果</h2>
</div>
<div class="stock-list">

${result.map(x=>`

<div class="stock"
onclick="openStock('${x.symbol}')">

<div class="stock-left">
<div class="stock-symbol">${x.symbol}</div>
<div class="stock-name">${x.name}</div>
</div>

<div>${x.market}</div>

</div>

`).join("")}

</div>`

:

`<div class="empty">找不到股票</div>`;

}catch(e){

toast("搜尋失敗");

}

}

function focusSearch(){

goPage("home");

setTimeout(()=>{
document.getElementById("searchInput").focus();
},100);

}


/* ================= DETAIL ================= */

async function openStock(symbol){

currentSymbol=symbol;

hidePages();

document.getElementById("detailPage")
.classList.remove("hidden");

document.getElementById("detailContent").innerHTML=
`<div class="empty">正在取得 ${symbol} 資料...</div>`;

try{

let data=await api(
"/api/stock/"+encodeURIComponent(symbol)
);

renderDetail(data);

}catch(e){

console.error(e);

document.getElementById("detailContent").innerHTML=
`
<div class="card">
<div class="down">資料取得失敗</div>
<p style="color:#818a97">
${e.message}
</p>
</div>
`;

}

}


function showHome(){
goPage("home");
}


/* ================= DETAIL ================= */

function renderDetail(data){

let q=data.quote||{};
let a=data.analysis||{};
let macd=a.MACD||{};
let bb=a.Bollinger||{};

let favorite=
watchlist.includes(currentSymbol);

document.getElementById("detailContent").innerHTML=

`

<div class="detail-head">

<div class="detail-symbol">
${currentSymbol} · ${q.market||""}
</div>

<div class="detail-name">
${q.name||currentSymbol}
</div>

<div class="detail-price">
${money(q.price)}
</div>

<div class="detail-change ${q.changePct>=0?"up":"down"}">
${percent(q.changePct)}
</div>

<div class="action-row">

<button class="secondary"
onclick="toggleWatch('${currentSymbol}')">
${favorite?"★ 已自選":"☆ 加入自選"}
</button>

<button class="secondary"
onclick="goPage('portfolio')">
💼 投資組合
</button>

</div>

</div>


<div class="score-box">

<div class="score-title">
IAN AI SCORE
</div>

<div class="score">
${a.score??"--"}
<span style="font-size:15px;color:#707986">/100</span>
</div>

<div class="score-note">
資訊整理與技術指標計算，不構成投資建議
</div>

</div>


<div class="section-title">
<h2>技術指標</h2>
</div>

<div class="tech-grid">

${tech("MA5",a.MA5)}
${tech("MA20",a.MA20)}
${tech("MA60",a.MA60)}
${tech("EMA12",a.EMA12)}
${tech("EMA26",a.EMA26)}
${tech("RSI",a.RSI,"RSI")}
${tech("MACD",macd.macd,"MACD")}
${tech("Signal",macd.signal,"MACD")}
${tech("ATR",a.ATR,"ATR")}
${tech("VWAP",a.VWAP,"VWAP")}
${tech("支撐",a.Support)}
${tech("壓力",a.Resistance)}
${tech("布林上軌",bb.upper)}
${tech("布林中軌",bb.middle)}
${tech("布林下軌",bb.lower)}

</div>


<div class="section-title">
<h2>IAN AI 分析</h2>
</div>

<div class="analysis">

${row("趨勢",a.trend)}
${row("動能",a.momentum)}
${row("成交量",money(q.volume))}
${row("歷史資料",`${a.dataPoints||0} 筆`)}

</div>


<div class="section-title">
<h2>價格走勢</h2>
</div>

<div class="chart">
<canvas id="priceCanvas"></canvas>
</div>

`;

drawChart(data.history||[]);

}


function tech(label,value,type){

let text=
value===null||
value===undefined||
!Number.isFinite(Number(value))
?"--"
:Number(value).toLocaleString(
"zh-TW",{maximumFractionDigits:2}
);

return`

<div class="tech"
onclick="indicatorInfo('${label}','${type||label}')">

<div class="tech-label">
${label}
</div>

<div class="tech-value">
${text}
</div>

</div>

`;

}

function row(a,b){

return`

<div class="analysis-row">
<span class="analysis-label">${a}</span>
<strong>${b??"--"}</strong>
</div>

`;


/* ================= INDICATOR INFO ================= */

function indicatorInfo(name,type){

let text={

MA5:"MA5 是最近 5 個交易日收盤價平均值。",
MA20:"MA20 是最近 20 個交易日收盤價平均值，常用於觀察短中期趨勢。",
MA60:"MA60 是最近 60 個交易日收盤價平均值，常用於觀察較長期趨勢。",
EMA12:"EMA12 是 12 日指數移動平均線，比 SMA 更重視近期價格。",
EMA26:"EMA26 是 26 日指數移動平均線。",
RSI:"RSI 用來觀察價格動能。一般常見區間為 0 到 100。",
MACD:"MACD 透過 EMA12 與 EMA26 的差值觀察趨勢動能。",
Signal:"MACD Signal 是 MACD 的訊號線。",
ATR:"ATR 用來衡量價格波動程度。",
VWAP:"VWAP 是成交量加權平均價格。",
支撐:"支撐區代表近期價格曾出現較明顯承接的位置。",
壓力:"壓力區代表近期價格曾出現較明顯賣壓的位置。",
布林上軌:"布林上軌為中軌加上兩倍標準差。",
布林中軌:"布林中軌通常以 20 日均線計算。",
布林下軌:"布林下軌為中軌減去兩倍標準差。"

}[name]||"這項指標目前由 IAN STOCK API 計算。";

showModal(`
<div class="modal-head">
<h2>${name}</h2>
<button class="close" onclick="closeModal()">×</button>
</div>
<p>${text}</p>
`);

}


/* ================= CHART ================= */

function drawChart(history){

let canvas=document.getElementById("priceCanvas");

if(!canvas)return;

let rect=canvas.getBoundingClientRect();
let dpr=window.devicePixelRatio||1;

canvas.width=rect.width*dpr;
canvas.height=270*dpr;

let ctx=canvas.getContext("2d");
ctx.scale(dpr,dpr);

let data=history
.map(x=>Number(x.close))
.filter(Number.isFinite)
.slice(-100);

if(data.length<2)return;

let min=Math.min(...data);
let max=Math.max(...data);
let range=max-min||1;
let w=rect.width;
let h=270;

ctx.beginPath();

data.forEach((v,i)=>{

let x=10+i*((w-20)/(data.length-1));
let y=h-15-((v-min)/range)*(h-30);

if(i===0)ctx.moveTo(x,y);
else ctx.lineTo(x,y);

});

ctx.strokeStyle="#37d67a";
ctx.lineWidth=2;
ctx.stroke();

ctx.fillStyle="#7c8693";
ctx.font="11px sans-serif";

ctx.fillText(money(max),10,15);
ctx.fillText(money(min),10,h-3);

}

/* ================= PORTFOLIO ================= */

function savePortfolio(){

localStorage.setItem(
"ian_portfolio",
JSON.stringify(portfolio)
);

}

function openTrade(type){

let symbol=
currentSymbol||
"2330";

showModal(`

<div class="modal-head">

<h2>${type==="BUY"?"買入":"賣出"}模擬交易</h2>

<button class="close"
onclick="closeModal()">×</button>

</div>

<div class="form">

<input id="tradeSymbol"
value="${symbol}"
placeholder="股票代號">

<input id="tradePrice"
type="number"
placeholder="價格">

<input id="tradeShares"
type="number"
placeholder="股數">

<button
class="${type==="BUY"?"buy":"sell"}"
style="border:0;border-radius:12px;padding:12px"
onclick="executeTrade('${type}')">

確認${type==="BUY"?"買入":"賣出"}

</button>

</div>

`);

}

function executeTrade(type){

let symbol=
document.getElementById("tradeSymbol")
.value.trim().toUpperCase();

let price=
Number(document.getElementById("tradePrice").value);

let shares=
Number(document.getElementById("tradeShares").value);

if(!symbol||!price||!shares){

toast("請輸入完整資料");
return;

}

let item=
portfolio.find(x=>x.symbol===symbol);

if(type==="BUY"){

if(item){

let oldCost=item.price*item.shares;
let newCost=price*shares;

item.shares+=shares;
item.price=(oldCost+newCost)/item.shares;

}else{

portfolio.push({
symbol,
price,
shares
});

}

toast("買入成功");

}else{

if(!item||item.shares<shares){

toast("持股不足");
return;

}

item.shares-=shares;

if(item.shares<=0){

portfolio=
portfolio.filter(x=>x.symbol!==symbol);

}

toast("賣出成功");

}

savePortfolio();
closeModal();
renderPortfolio();

}

function renderPortfolio(){

let box=document.getElementById("portfolioList");

if(!portfolio.length){

document.getElementById("portfolioValue").textContent="NT$0";
document.getElementById("portfolioPnL").textContent="損益：NT$0";

box.innerHTML=
`<div class="empty">
目前沒有持倉<br><br>
按上方「買入」建立模擬持倉
</div>`;

return;

}

let totalCost=0;
let totalValue=0;

let html="";

portfolio.forEach(item=>{

let q=getQuote(item.symbol);
let current=q?.price??item.price;

let cost=item.price*item.shares;
let value=current*item.shares;
let pnl=value-cost;

totalCost+=cost;
totalValue+=value;

html+=`

<div class="stock"
onclick="openStock('${item.symbol}')">

<div class="stock-left">

<div class="stock-symbol">
${item.symbol}
</div>

<div class="stock-name">
成本 ${money(item.price)} × ${item.shares}
</div>

</div>

<div class="stock-right">

<div class="stock-price">
${money(value)}
</div>

<div class="stock-change ${pnl>=0?"up":"down"}">
${pnl>=0?"+":""}${money(pnl)}
</div>

</div>

</div>

`;

});

let pnl=totalValue-totalCost;
let roi=totalCost?((pnl/totalCost)*100):0;

document.getElementById("portfolioValue").textContent=
"NT$"+money(totalValue);

document.getElementById("portfolioPnL").innerHTML=
`損益：
<span class="${pnl>=0?"up":"down"}">
${pnl>=0?"+":""}NT$${money(pnl)}
(${percent(roi)})
</span>`;

box.innerHTML=html;

}

document.getElementById("modalBg").classList.add("hidden");
