<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>IAN STOCK</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:#080a0f;
  color:#f5f7fa;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
  "Noto Sans TC",Arial,sans-serif;
}

body{
  padding-bottom:90px;
}

button{
  font:inherit;
}

.app{
  max-width:900px;
  margin:auto;
  padding:18px 16px 30px;
}

/* Header */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px;
}

.logo{
  font-size:24px;
  font-weight:800;
  letter-spacing:1px;
}

.status{
  font-size:12px;
  color:#7ee2a8;
  display:flex;
  align-items:center;
  gap:6px;
}

.dot{
  width:7px;
  height:7px;
  background:#39d98a;
  border-radius:50%;
}

/* Search */

.search{
  width:100%;
  background:#12151d;
  border:1px solid #242936;
  border-radius:15px;
  padding:15px 16px;
  color:white;
  outline:none;
  font-size:16px;
  margin-bottom:18px;
}

.search::placeholder{
  color:#707784;
}

/* Market */

.market-tabs{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

.market-tab{
  flex:1;
  border:0;
  border-radius:12px;
  padding:13px;
  background:#141821;
  color:#8d95a3;
  font-weight:700;
}

.market-tab.active{
  background:#f5f7fa;
  color:#090b10;
}

/* Cards */

.section-title{
  font-size:18px;
  font-weight:800;
  margin:22px 0 12px;
}

.market-card{
  background:#11141b;
  border:1px solid #202530;
  border-radius:17px;
  padding:17px;
  margin-bottom:10px;
}

.market-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.symbol{
  font-size:17px;
  font-weight:800;
}

.name{
  color:#858d9b;
  font-size:12px;
  margin-top:4px;
}

.price{
  font-size:20px;
  font-weight:800;
  text-align:right;
}

.change{
  font-size:13px;
  margin-top:4px;
  text-align:right;
}

.up{
  color:#42d392;
}

.down{
  color:#ff6575;
}

.waiting{
  color:#737b88;
  font-size:13px;
}

/* Refresh */

.refresh-area{
  margin-top:20px;
}

.refresh-btn{
  width:100%;
  border:0;
  background:#f5f7fa;
  color:#080a0f;
  border-radius:14px;
  padding:15px;
  font-weight:800;
}

.cache{
  text-align:center;
  color:#656d7a;
  font-size:11px;
  margin-top:9px;
}

/* Bottom nav */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:100;
  padding:
    8px
    10px
    calc(8px + env(safe-area-inset-bottom));
  background:rgba(10,12,17,.96);
  backdrop-filter:blur(18px);
  border-top:1px solid #20242d;
}

.nav-inner{
  max-width:650px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:4px;
}

.nav-btn{
  min-height:62px;
  border:0;
  border-radius:13px;
  background:transparent;
  color:#777f8c;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:5px;
  font-size:11px;
  font-weight:600;
}

.nav-icon{
  font-size:21px;
  line-height:1;
}

.nav-btn.active{
  color:white;
  background:#181c25;
}

/* Pages */

.page{
  display:none;
}

.page.active{
  display:block;
}

.empty{
  padding:50px 20px;
  text-align:center;
  color:#6d7582;
}

/* Desktop */

@media(min-width:700px){

  .app{
    padding-top:30px;
  }

  .bottom-nav{
    left:50%;
    right:auto;
    transform:translateX(-50%);
    width:650px;
    border:1px solid #242936;
    border-radius:18px 18px 0 0;
  }

}
</style>
</head>

<body>

<div class="app">

  <!-- HOME -->
  <section id="home" class="page active">

    <div class="header">
      <div class="logo">IAN STOCK</div>

      <div class="status">
        <span class="dot"></span>
        MARKET
      </div>
    </div>

    <input
      id="search"
      class="search"
      placeholder="搜尋股票代號或公司名稱，例如 NVDA、台積電"
      oninput="searchStock()"
    >

    <div class="market-tabs">
      <button
        class="market-tab active"
        onclick="switchMarket('tw',this)"
      >
        🇹🇼 台股
      </button>

      <button
        class="market-tab"
        onclick="switchMarket('us',this)"
      >
        🇺🇸 美股
      </button>
    </div>

    <div class="section-title">
      熱門股票
    </div>

    <div id="stocks"></div>

    <div class="refresh-area">

      <button
        class="refresh-btn"
        onclick="refreshQuotes(true)"
      >
        ↻ 更新行情
      </button>

      <div id="cacheText" class="cache">
        尚未取得行情
      </div>

    </div>

  </section>


  <!-- SEARCH -->
  <section id="searchPage" class="page">

    <div class="section-title">
      🔍 搜尋股票
    </div>

    <input
      class="search"
      placeholder="輸入股票代號或公司名稱"
      oninput="searchStockPage()"
    >

    <div id="searchResults" class="empty">
      輸入股票代號開始搜尋
    </div>

  </section>


  <!-- WATCHLIST -->
  <section id="watchlist" class="page">

    <div class="section-title">
      ⭐ 我的自選
    </div>

    <div class="empty">
      目前還沒有自選股票
    </div>

  </section>


  <!-- PORTFOLIO -->
  <section id="portfolio" class="page">

    <div class="section-title">
      💼 投資組合
    </div>

    <div class="market-card">

      <div class="name">
        模擬資產
      </div>

      <div class="price" style="font-size:30px;margin-top:8px;">
        NT$1,000,000
      </div>

      <div class="change up" style="text-align:left;margin-top:8px;">
        模擬交易模式
      </div>

    </div>

    <div class="empty">
      尚未建立持倉
    </div>

  </section>


  <!-- AI -->
  <section id="ai" class="page">

    <div class="section-title">
      🤖 IAN AI
    </div>

    <div class="market-card">

      <div class="symbol">
        AI 股票分析
      </div>

      <div class="name">
        技術面・基本面・市場情緒・風險
      </div>

      <div style="margin-top:18px;color:#8b93a0;line-height:1.7;">
        輸入股票後，IAN AI 將在後續版本提供完整分析。
      </div>

    </div>

  </section>

</div>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

  <div class="nav-inner">

    <button
      class="nav-btn active"
      onclick="showPage('home',this)"
    >
      <span class="nav-icon">⌂</span>
      首頁
    </button>

    <button
      class="nav-btn"
      onclick="showPage('searchPage',this)"
    >
      <span class="nav-icon">⌕</span>
      搜尋
    </button>

    <button
      class="nav-btn"
      onclick="showPage('watchlist',this)"
    >
      <span class="nav-icon">★</span>
      自選
    </button>

    <button
      class="nav-btn"
      onclick="showPage('portfolio',this)"
    >
      <span class="nav-icon">▣</span>
      投資組合
    </button>

    <button
      class="nav-btn"
      onclick="showPage('ai',this)"
    >
      <span class="nav-icon">AI</span>
      AI
    </button>

  </div>

</nav>


<script>

const API_BASE =
  "https://ian-stock-api.onrender.com";


const TW_STOCKS = [
  {
    symbol:"2330",
    name:"台積電"
  },
  {
    symbol:"2317",
    name:"鴻海"
  },
  {
    symbol:"2454",
    name:"聯發科"
  }
];


const US_STOCKS = [
  {
    symbol:"NVDA",
    name:"NVIDIA"
  },
  {
    symbol:"AAPL",
    name:"Apple"
  },
  {
    symbol:"MSFT",
    name:"Microsoft"
  }
];


let currentMarket = "tw";

let quotes = {};


// =======================
// 頁面切換
// =======================

function showPage(id,button){

  document
    .querySelectorAll(".page")
    .forEach(p => p.classList.remove("active"));

  document
    .getElementById(id)
    .classList.add("active");

  document
    .querySelectorAll(".nav-btn")
    .forEach(b => b.classList.remove("active"));

  button.classList.add("active");

}


// =======================
// 台股 / 美股
// =======================

function switchMarket(market,button){

  currentMarket = market;

  document
    .querySelectorAll(".market-tab")
    .forEach(b => b.classList.remove("active"));

  button.classList.add("active");

  renderStocks();

}


// =======================
// 顯示股票
// =======================

function renderStocks(){

  const container =
    document.getElementById("stocks");

  const stocks =
    currentMarket === "tw"
      ? TW_STOCKS
      : US_STOCKS;

  container.innerHTML = "";

  stocks.forEach(stock => {

    const q =
      quotes[stock.symbol];

    let priceHTML =
      `<div class="waiting">等待行情</div>`;

    if(q){

      const cls =
        q.changePct >= 0
          ? "up"
          : "down";

      const sign =
        q.changePct >= 0
          ? "+"
          : "";

      priceHTML = `
        <div class="price">
          ${q.price}
        </div>

        <div class="change ${cls}">
          ${sign}${q.changePct}%
        </div>
      `;
    }

    container.innerHTML += `

      <div class="market-card">

        <div class="market-top">

          <div>

            <div class="symbol">
              ${stock.symbol}
            </div>

            <div class="name">
              ${stock.name}
            </div>

          </div>

          <div>
            ${priceHTML}
          </div>

        </div>

      </div>

    `;

  });

}


// =======================
// API + 快取
// =======================

async function refreshQuotes(force=false){

  const cached =
    localStorage.getItem("ian_quotes");

  const cacheTime =
    localStorage.getItem("ian_quotes_time");

  const now =
    Date.now();

  const ONE_HOUR =
    60 * 60 * 1000;


  // 如果有快取而且沒有過期
  if(
    !force &&
    cached &&
    cacheTime &&
    now - Number(cacheTime) < ONE_HOUR
  ){

    quotes =
      JSON.parse(cached);

    renderStocks();

    updateCacheText(
      Number(cacheTime)
    );

    return;
  }


  try{

    document.getElementById("cacheText").innerText =
      "正在取得最新行情…";


    const response =
      await fetch(
        API_BASE + "/api/quotes"
      );


    const data =
      await response.json();


    data.forEach(q => {

      quotes[q.symbol] = q;

    });


    localStorage.setItem(
      "ian_quotes",
      JSON.stringify(quotes)
    );


    localStorage.setItem(
      "ian_quotes_time",
      String(now)
    );


    renderStocks();

    updateCacheText(now);


  }catch(error){

    document.getElementById("cacheText").innerText =
      "目前無法取得最新行情，已保留上一筆資料";

  }

}


// =======================
// 快取文字
// =======================

function updateCacheText(time){

  const date =
    new Date(time);

  document.getElementById("cacheText").innerText =
    "行情更新：" +
    date.toLocaleTimeString("zh-TW") +
    " · 快取 1 小時";

}


// =======================
// 搜尋
// =======================

function searchStock(){

  const keyword =
    document
      .getElementById("search")
      .value
      .trim()
      .toUpperCase();

  if(!keyword){

    renderStocks();

    return;

  }

  const all =
    [...TW_STOCKS,...US_STOCKS];

  const results =
    all.filter(stock =>
      stock.symbol
        .toUpperCase()
        .includes(keyword)
      ||
      stock.name
        .toUpperCase()
        .includes(keyword)
    );


  const container =
    document.getElementById("stocks");

  container.innerHTML = "";

  results.forEach(stock => {

    const q =
      quotes[stock.symbol];

    container.innerHTML += `

      <div class="market-card">

        <div class="market-top">

          <div>
            <div class="symbol">
              ${stock.symbol}
            </div>

            <div class="name">
              ${stock.name}
            </div>
          </div>

          <div>
            ${
              q
              ? q.price
              : "等待行情"
            }
          </div>

        </div>

      </div>

    `;

  });

}


function searchStockPage(){

  const input =
    event.target.value
      .trim()
      .toUpperCase();

  const all =
    [...TW_STOCKS,...US_STOCKS];

  const results =
    all.filter(stock =>
      stock.symbol
        .toUpperCase()
        .includes(input)
      ||
      stock.name
        .toUpperCase()
        .includes(input)
    );


  const container =
    document.getElementById("searchResults");


  if(!input){

    container.innerHTML =
      "輸入股票代號開始搜尋";

    return;

  }


  if(!results.length){

    container.innerHTML =
      "找不到符合的股票";

    return;

  }


  container.innerHTML =
    results.map(stock => `

      <div class="market-card">

        <div class="symbol">
          ${stock.symbol}
        </div>

        <div class="name">
          ${stock.name}
        </div>

      </div>

    `).join("");

}


// =======================
// 啟動
// =======================

renderStocks();

refreshQuotes(false);

</script>

</body>
</html>
