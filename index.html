<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<title>IAN STOCK</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:#07090d;
  color:#f5f7fa;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  padding-bottom:90px;
}

button,input{
  font:inherit;
}

.app{
  max-width:760px;
  margin:auto;
  padding:18px 16px 100px;
}

/* HEADER */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.logo{
  font-size:27px;
  font-weight:800;
  letter-spacing:.5px;
}

.logo span{
  color:#37d67a;
}

.status{
  padding:7px 11px;
  border-radius:20px;
  background:#18201b;
  color:#37d67a;
  font-size:12px;
  font-weight:700;
}

.status.error{
  background:#271619;
  color:#ff5964;
}

/* SEARCH */

.search{
  display:flex;
  gap:9px;
  margin-bottom:18px;
}

.search input{
  flex:1;
  min-width:0;
  background:#11151c;
  border:1px solid #242a34;
  color:white;
  border-radius:14px;
  padding:13px 15px;
  outline:none;
}

.search button{
  background:#37d67a;
  color:#06100a;
  border:0;
  border-radius:14px;
  padding:0 17px;
  font-weight:800;
}

/* MARKET */

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:24px 0 11px;
}

.section-title h2{
  font-size:17px;
  margin:0;
}

.section-title small{
  color:#747d89;
}

.market-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.market-card{
  background:#11151c;
  border:1px solid #202631;
  border-radius:15px;
  padding:13px 10px;
}

.market-card .name{
  color:#8e97a5;
  font-size:12px;
}

.market-card .price{
  font-size:18px;
  font-weight:800;
  margin-top:5px;
}

.market-card .change{
  font-size:12px;
  margin-top:4px;
}

.up{
  color:#37d67a;
}

.down{
  color:#ff5964;
}

.wait{
  color:#777f8c;
}

/* STOCK */

.stock-list{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.stock{
  background:#11151c;
  border:1px solid #202631;
  border-radius:16px;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
}

.stock-left{
  display:flex;
  flex-direction:column;
  gap:4px;
}

.stock-symbol{
  font-size:16px;
  font-weight:800;
}

.stock-name{
  color:#818a97;
  font-size:12px;
}

.stock-right{
  text-align:right;
}

.stock-price{
  font-size:17px;
  font-weight:800;
}

.stock-change{
  font-size:12px;
  margin-top:3px;
}

/* DETAIL */

.hidden{
  display:none!important;
}

.back{
  background:#161b23;
  color:white;
  border:1px solid #272e39;
  border-radius:12px;
  padding:9px 13px;
  margin-bottom:16px;
}

.detail-head{
  background:#11151c;
  border:1px solid #202631;
  border-radius:18px;
  padding:18px;
}

.detail-symbol{
  font-size:14px;
  color:#8b94a1;
}

.detail-name{
  font-size:25px;
  font-weight:800;
  margin-top:3px;
}

.detail-price{
  font-size:32px;
  font-weight:850;
  margin-top:15px;
}

.detail-change{
  margin-top:4px;
  font-size:14px;
}

/* SCORE */

.score-box{
  margin-top:12px;
  background:#11151c;
  border:1px solid #202631;
  border-radius:18px;
  padding:17px;
}

.score-title{
  color:#8e97a5;
  font-size:12px;
}

.score{
  font-size:36px;
  font-weight:900;
  margin-top:3px;
}

.score-note{
  color:#707986;
  font-size:11px;
  margin-top:5px;
}

/* TECH */

.tech-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
}

.tech{
  background:#11151c;
  border:1px solid #202631;
  border-radius:15px;
  padding:14px;
}

.tech-label{
  color:#7e8794;
  font-size:11px;
}

.tech-value{
  font-size:17px;
  font-weight:800;
  margin-top:6px;
}

/* ANALYSIS */

.analysis{
  background:#11151c;
  border:1px solid #202631;
  border-radius:17px;
  padding:16px;
}

.analysis-row{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid #202631;
}

.analysis-row:last-child{
  border-bottom:0;
}

.analysis-label{
  color:#858e9b;
}

/* CHART */

.chart{
  background:#11151c;
  border:1px solid #202631;
  border-radius:18px;
  padding:13px;
  overflow:hidden;
}

canvas{
  width:100%;
  height:250px;
  display:block;
}

/* BOTTOM */

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:rgba(8,10,14,.96);
  backdrop-filter:blur(15px);
  border-top:1px solid #202631;
  display:flex;
  justify-content:center;
  z-index:50;
}

.bottom-inner{
  width:min(760px,100%);
  display:flex;
  justify-content:space-around;
  padding:12px 10px calc(12px + env(safe-area-inset-bottom));
}

.nav{
  color:#727b88;
  text-align:center;
  font-size:11px;
}

.nav.active{
  color:#37d67a;
}

.nav-icon{
  font-size:19px;
  margin-bottom:3px;
}

/* LOADING */

.loading{
  text-align:center;
  color:#707986;
  padding:30px 0;
}

/* MOBILE */

@media(max-width:430px){
  .market-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .tech-grid{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- HOME -->

  <div id="homePage">

    <div class="header">
      <div class="logo">IAN <span>STOCK</span></div>
      <div id="apiStatus" class="status">連線中</div>
    </div>

    <div class="search">
      <input
        id="searchInput"
        placeholder="搜尋股票代號 / 公司名稱"
        autocomplete="off"
      >
      <button onclick="searchStock()">搜尋</button>
    </div>

    <div id="searchResult"></div>

    <div class="section-title">
      <h2>市場脈動</h2>
      <small id="updateTime">等待資料</small>
    </div>

    <div id="marketGrid" class="market-grid">
      <div class="market-card">
        <div class="name">台積電</div>
        <div class="price wait">待資料</div>
      </div>

      <div class="market-card">
        <div class="name">鴻海</div>
        <div class="price wait">待資料</div>
      </div>

      <div class="market-card">
        <div class="name">聯發科</div>
        <div class="price wait">待資料</div>
      </div>

      <div class="market-card">
        <div class="name">NVIDIA</div>
        <div class="price wait">待資料</div>
      </div>

      <div class="market-card">
        <div class="name">Apple</div>
        <div class="price wait">待資料</div>
      </div>

      <div class="market-card">
        <div class="name">Microsoft</div>
        <div class="price wait">待資料</div>
      </div>
    </div>

    <div class="section-title">
      <h2>熱門股票</h2>
      <small>LIVE</small>
    </div>

    <div id="stockList" class="stock-list"></div>

  </div>


  <!-- DETAIL -->

  <div id="detailPage" class="hidden">

    <button class="back" onclick="showHome()">
      ← 返回
    </button>

    <div id="detailContent">

      <div class="loading">
        載入股票資料中...
      </div>

    </div>

  </div>

</div>


<!-- BOTTOM NAV -->

<div class="bottom">

  <div class="bottom-inner">

    <div class="nav active" onclick="showHome()">
      <div class="nav-icon">⌂</div>
      首頁
    </div>

    <div class="nav" onclick="focusSearch()">
      <div class="nav-icon">⌕</div>
      搜尋
    </div>

    <div class="nav">
      <div class="nav-icon">☆</div>
      自選
    </div>

    <div class="nav">
      <div class="nav-icon">◈</div>
      投資組合
    </div>

    <div class="nav">
      <div class="nav-icon">✦</div>
      IAN AI
    </div>

  </div>

</div>


<script>

/* =====================================================
   IAN STOCK FRONTEND V10
   ===================================================== */

const API_BASE =
  "https://ian-stock-api.onrender.com";


const STOCKS = [

  {
    symbol:"2330",
    name:"台積電",
    market:"TW"
  },

  {
    symbol:"2317",
    name:"鴻海",
    market:"TW"
  },

  {
    symbol:"2454",
    name:"聯發科",
    market:"TW"
  },

  {
    symbol:"NVDA",
    name:"NVIDIA",
    market:"US"
  },

  {
    symbol:"AAPL",
    name:"Apple",
    market:"US"
  },

  {
    symbol:"MSFT",
    name:"Microsoft",
    market:"US"
  }

];


let quotes = [];
let currentSymbol = null;


/* =====================================================
   API
   ===================================================== */

async function api(path){

  const response =
    await fetch(API_BASE + path, {
      cache:"no-store"
    });

  if(!response.ok){

    throw new Error(
      "API " + response.status
    );

  }

  return response.json();

}


/* =====================================================
   STATUS
   ===================================================== */

function setStatus(ok){

  const el =
    document.getElementById("apiStatus");

  if(ok){

    el.textContent =
      "● LIVE DATA";

    el.className =
      "status";

  }else{

    el.textContent =
      "API ERROR";

    el.className =
      "status error";

  }

}


/* =====================================================
   FORMAT
   ===================================================== */

function money(value){

  if(
    value === null ||
    value === undefined ||
    !Number.isFinite(Number(value))
  ){

    return "待資料";

  }

  return Number(value)
    .toLocaleString(
      "zh-TW",
      {
        maximumFractionDigits:2
      }
    );

}


function percent(value){

  if(
    value === null ||
    value === undefined ||
    !Number.isFinite(Number(value))
  ){

    return "--";

  }

  const n = Number(value);

  return (
    n >= 0 ? "+" : ""
  ) +
  n.toFixed(2) +
  "%";

}


function priceClass(value){

  if(
    value === null ||
    value === undefined
  ){

    return "wait";

  }

  return Number(value) >= 0
    ? "up"
    : "down";

}


/* =====================================================
   HOME
   ===================================================== */

async function loadQuotes(){

  try{

    const data =
      await api("/api/quotes");

    if(!Array.isArray(data)){

      throw new Error(
        "資料格式錯誤"
      );

    }

    quotes = data;

    setStatus(true);

    renderMarket();

    renderStocks();

    document.getElementById(
      "updateTime"
    ).textContent =
      new Date().toLocaleTimeString(
        "zh-TW",
        {
          hour:"2-digit",
          minute:"2-digit",
          second:"2-digit"
        }
      );

  }catch(error){

    console.error(error);

    setStatus(false);

  }

}


/* =====================================================
   MARKET
   ===================================================== */

function renderMarket(){

  const grid =
    document.getElementById(
      "marketGrid"
    );

  grid.innerHTML = "";

  for(const stock of STOCKS){

    const q =
      quotes.find(
        x =>
          String(x.symbol)
            .toUpperCase()
          ===
          stock.symbol
      );

    const price =
      q?.price ?? null;

    const change =
      q?.changePct ?? null;

    grid.innerHTML += `

      <div
        class="market-card"
        onclick="openStock('${stock.symbol}')"
      >

        <div class="name">
          ${stock.name}
        </div>

        <div class="price">
          ${money(price)}
        </div>

        <div
          class="change ${
            change === null
              ? "wait"
              : change >= 0
                ? "up"
                : "down"
          }"
        >
          ${percent(change)}
        </div>

      </div>

    `;

  }

}


/* =====================================================
   STOCK LIST
   ===================================================== */

function renderStocks(){

  const box =
    document.getElementById(
      "stockList"
    );

  box.innerHTML = "";

  for(const stock of STOCKS){

    const q =
      quotes.find(
        x =>
          String(x.symbol)
            .toUpperCase()
          ===
          stock.symbol
      );

    const price =
      q?.price ?? null;

    const change =
      q?.changePct ?? null;

    box.innerHTML += `

      <div
        class="stock"
        onclick="openStock('${stock.symbol}')"
      >

        <div class="stock-left">

          <div class="stock-symbol">
            ${stock.symbol}
          </div>

          <div class="stock-name">
            ${stock.name} · ${stock.market}
          </div>

        </div>

        <div class="stock-right">

          <div class="stock-price">
            ${money(price)}
          </div>

          <div
            class="stock-change ${
              change === null
                ? "wait"
                : change >= 0
                  ? "up"
                  : "down"
            }"
          >
            ${percent(change)}
          </div>

        </div>

      </div>

    `;

  }

}


/* =====================================================
   SEARCH
   ===================================================== */

async function searchStock(){

  const input =
    document.getElementById(
      "searchInput"
    );

  const q =
    input.value.trim();

  if(!q){

    document.getElementById(
      "searchResult"
    ).innerHTML = "";

    return;

  }

  try{

    const result =
      await api(
        "/api/search?q=" +
        encodeURIComponent(q)
      );

    const box =
      document.getElementById(
        "searchResult"
      );

    if(!result.length){

      box.innerHTML = `
        <div class="loading">
          找不到股票
        </div>
      `;

      return;

    }

    box.innerHTML =

      `<div class="stock-list">` +

      result.map(stock => `

        <div
          class="stock"
          onclick="openStock('${stock.symbol}')"
        >

          <div class="stock-left">

            <div class="stock-symbol">
              ${stock.symbol}
            </div>

            <div class="stock-name">
              ${stock.name}
            </div>

          </div>

          <div>
            ${stock.market}
          </div>

        </div>

      `).join("") +

      `</div>`;

  }catch(error){

    console.error(error);

  }

}


function focusSearch(){

  document.getElementById(
    "searchInput"
  ).focus();

}


/* =====================================================
   DETAIL
   ===================================================== */

async function openStock(symbol){

  currentSymbol =
    symbol;

  document.getElementById(
    "homePage"
  ).classList.add(
    "hidden"
  );

  document.getElementById(
    "detailPage"
  ).classList.remove(
    "hidden"
  );

  const box =
    document.getElementById(
      "detailContent"
    );

  box.innerHTML = `
    <div class="loading">
      正在取得 ${symbol} 資料...
    </div>
  `;

  try{

    const data =
      await api(
        "/api/stock/" +
        encodeURIComponent(symbol)
      );

    renderDetail(data);

  }catch(error){

    console.error(error);

    box.innerHTML = `

      <div class="analysis">

        <div class="analysis-row">

          <span>
            資料取得失敗
          </span>

          <span class="down">
            ${error.message}
          </span>

        </div>

        <div
          style="
            color:#7e8794;
            margin-top:12px;
            font-size:12px;
          "
        >
          請確認 Render API 已成功部署。
        </div>

      </div>

    `;

  }

}


/* =====================================================
   DETAIL RENDER
   ===================================================== */

function renderDetail(data){

  const q =
    data.quote || {};

  const a =
    data.analysis || {};

  const name =
    q.name ||
    currentSymbol;

  const change =
    q.changePct;

  const macd =
    a.MACD || {};

  const bb =
    a.Bollinger || {};

  const box =
    document.getElementById(
      "detailContent"
    );

  box.innerHTML = `

    <div class="detail-head">

      <div class="detail-symbol">
        ${currentSymbol}
        ·
        ${q.market || ""}
      </div>

      <div class="detail-name">
        ${name}
      </div>

      <div class="detail-price">
        ${money(q.price)}
      </div>

      <div
        class="detail-change ${
          change >= 0
            ? "up"
            : "down"
        }"
      >
        ${percent(change)}
      </div>

    </div>


    <div class="score-box">

      <div class="score-title">
        IAN AI SCORE
      </div>

      <div class="score">
        ${
          a.score === null ||
          a.score === undefined
            ? "--"
            : a.score
        }

        <span
          style="
            font-size:15px;
            color:#707986;
          "
        >
          /100
        </span>

      </div>

      <div class="score-note">
        技術指標資訊整理，不構成投資建議
      </div>

    </div>


    <div class="section-title">
      <h2>技術指標</h2>
    </div>


    <div class="tech-grid">

      ${tech(
        "MA5",
        a.MA5
      )}

      ${tech(
        "MA20",
        a.MA20
      )}

      ${tech(
        "MA60",
        a.MA60
      )}

      ${tech(
        "EMA12",
        a.EMA12
      )}

      ${tech(
        "EMA26",
        a.EMA26
      )}

      ${tech(
        "RSI",
        a.RSI,
        2
      )}

      ${tech(
        "MACD",
        macd.macd,
        3
      )}

      ${tech(
        "MACD Signal",
        macd.signal,
        3
      )}

      ${tech(
        "ATR",
        a.ATR,
        2
      )}

      ${tech(
        "VWAP",
        a.VWAP,
        2
      )}

      ${tech(
        "支撐",
        a.Support
      )}

      ${tech(
        "壓力",
        a.Resistance
      )}

      ${tech(
        "布林上軌",
        bb.upper
      )}

      ${tech(
        "布林中軌",
        bb.middle
      )}

      ${tech(
        "布林下軌",
        bb.lower
      )}

    </div>


    <div class="section-title">
      <h2>IAN AI 技術分析</h2>
    </div>


    <div class="analysis">

      <div class="analysis-row">

        <span class="analysis-label">
          趨勢
        </span>

        <strong>
          ${a.trend || "--"}
        </strong>

      </div>


      <div class="analysis-row">

        <span class="analysis-label">
          動能
        </span>

        <strong>
          ${a.momentum || "--"}
        </strong>

      </div>


      <div class="analysis-row">

        <span class="analysis-label">
          成交量
        </span>

        <strong>
          ${money(q.volume)}
        </strong>

      </div>


      <div class="analysis-row">

        <span class="analysis-label">
          歷史資料
        </span>

        <strong>
          ${a.dataPoints || 0} 筆
        </strong>

      </div>


    </div>


    <div class="section-title">
      <h2>價格走勢</h2>
    </div>


    <div class="chart">

      <canvas id="priceCanvas"></canvas>

    </div>

  `;

  drawChart(
    data.history || []
  );

}


/* =====================================================
   TECH CARD
   ===================================================== */

function tech(
  label,
  value,
  decimals=2
){

  let text = "--";

  if(
    value !== null &&
    value !== undefined &&
    Number.isFinite(Number(value))
  ){

    text =
      Number(value)
        .toLocaleString(
          "zh-TW",
          {
            maximumFractionDigits:
              decimals
          }
        );

  }

  return `

    <div class="tech">

      <div class="tech-label">
        ${label}
      </div>

      <div class="tech-value">
        ${text}
      </div>

    </div>

  `;

}


/* =====================================================
   SIMPLE CHART
   ===================================================== */

function drawChart(history){

  const canvas =
    document.getElementById(
      "priceCanvas"
    );

  if(!canvas) return;

  const ctx =
    canvas.getContext("2d");

  const rect =
    canvas.getBoundingClientRect();

  const dpr =
    window.devicePixelRatio || 1;

  canvas.width =
    rect.width * dpr;

  canvas.height =
    250 * dpr;

  ctx.scale(dpr,dpr);

  const width =
    rect.width;

  const height =
    250;

  const data =
    history
      .map(x => Number(x.close))
      .filter(Number.isFinite)
      .slice(-100);

  if(data.length < 2){

    ctx.fillStyle =
      "#777f8c";

    ctx.font =
      "14px sans-serif";

    ctx.fillText(
      "歷史資料不足",
      20,
      40
    );

    return;

  }

  const min =
    Math.min(...data);

  const max =
    Math.max(...data);

  const range =
    max - min || 1;

  ctx.beginPath();

  data.forEach(
    (value,index) => {

      const x =
        10 +
        index *
        ((width - 20) /
        (data.length - 1));

      const y =
        height -
        15 -
        ((value-min) /
        range) *
        (height-30);

      if(index === 0){

        ctx.moveTo(x,y);

      }else{

        ctx.lineTo(x,y);

      }

    }
  );

  ctx.strokeStyle =
    "#37d67a";

  ctx.lineWidth =
    2;

  ctx.stroke();


  ctx.fillStyle =
    "#777f8c";

  ctx.font =
    "11px sans-serif";

  ctx.fillText(
    money(max),
    10,
    15
  );

  ctx.fillText(
    money(min),
    10,
    height - 3
  );

}
