<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>IAN STOCK</title>
<style>
:root{--bg:#07111f;--panel:#0d1b2d;--line:#1d3552;--text:#eef5ff;--muted:#8fa5c0;--blue:#56a8ff;--green:#2bd9a0;--red:#ff5c78;--gold:#d9b24c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",Arial,sans-serif;padding-bottom:76px}
header{position:sticky;top:0;z-index:10;background:#07111fee;border-bottom:1px solid var(--line);padding:16px 18px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:24px;font-weight:900;letter-spacing:.5px}.logo span{color:var(--blue)}.demo{border:1px solid #8b6d24;color:#e9c75d;border-radius:20px;padding:7px 11px;font-size:12px}
main{padding:16px;max-width:900px;margin:auto}.hero,.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:14px;box-shadow:0 10px 30px #0002}.hero h1{font-size:32px;margin:8px 0}.hero p{color:var(--muted);line-height:1.6}.row{display:flex;gap:10px;align-items:center}.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:800;background:#17304d;color:#fff}.btn.primary{background:var(--blue);color:#06101d}.btn.buy{background:#124e43;color:#65efc0}.btn.sell{background:#5b1d2c;color:#ff9db0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.metric{font-size:25px;font-weight:900}.muted{color:var(--muted)}.green{color:var(--green)}.red{color:var(--red)}
.search{width:100%;background:#091728;border:1px solid var(--line);color:#fff;padding:14px;border-radius:14px;font-size:16px;outline:none}.stock{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid var(--line)}.stock:last-child{border-bottom:0}.ticker{font-weight:900}.price{font-weight:900}.mini{font-size:12px;color:var(--muted)}
canvas{width:100%;height:260px;background:#091728;border-radius:16px;border:1px solid var(--line)}
input,select{width:100%;background:#091728;color:#fff;border:1px solid var(--line);padding:12px;border-radius:12px;font-size:16px}label{font-size:13px;color:var(--muted);display:block;margin:10px 0 6px}
.bottom{position:fixed;bottom:0;left:0;right:0;height:70px;background:#07111ff5;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:20}.nav{background:none;border:0;color:#7e94ae;font-size:12px}.nav.active{color:#fff}.nav b{display:block;font-size:22px;margin-bottom:2px}
.notice{padding:12px;border-radius:12px;background:#0b2336;color:#9fc8f5;font-size:13px;line-height:1.5}.hide{display:none!important}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.hero h1{font-size:40px}}
</style>
</head>
<body>
<header><div class="logo">IAN <span>STOCK</span></div><div class="demo">DEMO DATA・模擬環境</div></header>
<main>
<section id="home" class="page">
<div class="hero"><div class="muted">IAN AI 市場脈動</div><h1>看懂市場，不只看價格</h1><p>趨勢、技術指標與模擬投資集中在同一個面板。</p><div class="row"><button class="btn primary" onclick="go('search')">搜尋股票</button><button class="btn" onclick="go('trade')">模擬交易</button></div></div>
<div class="card"><div class="muted">模擬總資產</div><div id="total" class="metric">$1,000,000</div><div id="pnl" class="green">+$0</div></div>
<div class="card"><h2>市場焦點 <span class="muted" style="float:right;font-size:15px">TW / US</span></h2><div id="market"></div></div>
<div class="notice">目前使用 DEMO DATA。正式上線前，真實行情需接合法授權的市場資料來源。</div>
</section>

<section id="search" class="page hide"><div class="card"><h2>搜尋股票</h2><input id="q" class="search" placeholder="輸入代號或公司名稱，例如 2330 / 台積電 / AAPL" oninput="renderSearch()"><div id="results"></div></div></section>

<section id="detail" class="page hide"><div class="card"><div class="row" style="justify-content:space-between"><div><div id="dname" class="muted"></div><h1 id="dticker" style="margin:4px 0"></h1></div><button class="btn" onclick="go('search')">返回</button></div><div class="metric" id="dprice"></div><div id="dchange"></div><br><canvas id="chart" width="900" height="300"></canvas><div class="grid" style="margin-top:12px" id="indicators"></div></div>
<div class="card"><h2>模擬下單</h2><div class="grid"><div><label>股數</label><input id="qty" type="number" value="100" min="1"></div><div><label>價格</label><input id="orderPrice" type="number"></div></div><div class="row" style="margin-top:12px"><button class="btn buy" onclick="order('buy')">模擬買入</button><button class="btn sell" onclick="order('sell')">模擬賣出</button><button class="btn" onclick="toggleWatch()">☆ 自選</button></div></div></section>

<section id="portfolio" class="page hide"><div class="card"><h2>投資組合</h2><div class="grid"><div><div class="muted">現金</div><div class="metric" id="cash"></div></div><div><div class="muted">持倉市值</div><div class="metric" id="holdValue"></div></div><div><div class="muted">總資產</div><div class="metric" id="pTotal"></div></div><div><div class="muted">總損益</div><div class="metric" id="pPnl"></div></div></div></div><div class="card"><h2>持股</h2><div id="positions"></div></div><div class="card"><h2>交易紀錄</h2><div id="history"></div></div></section>

<section id="trade" class="page hide"><div class="card"><h2>模擬交易</h2><div class="notice">這裡是紙上交易，不會連接銀行或券商，也不會真的扣款。</div><br><button class="btn primary" onclick="go('search')">選擇股票開始交易</button></div></section>
</main>
<nav class="bottom"><button class="nav active" data-page="home" onclick="go('home')"><b>⌂</b>首頁</button><button class="nav" data-page="search" onclick="go('search')"><b>⌕</b>搜尋</button><button class="nav" data-page="watch" onclick="showWatch()"><b>☆</b>自選</button><button class="nav" data-page="portfolio" onclick="go('portfolio')"><b>◉</b>投資組合</button><button class="nav" data-page="trade" onclick="go('trade')"><b>↕</b>模擬交易</button></nav>

<script>
const stocks=[
{t:'2330',n:'台積電',p:1120,c:2.1,m:'TW',pe:22.4,eps:50.0,rsi:64,ma5:1108,ma20:1085,ma60:1020},
{t:'2317',n:'鴻海',p:211,c:-1.4,m:'TW',pe:14.8,eps:14.3,rsi:48,ma5:214,ma20:218,ma60:205},
{t:'2454',n:'聯發科',p:1385,c:1.1,m:'TW',pe:19.2,eps:72.1,rsi:59,ma5:1370,ma20:1330,ma60:1250},
{t:'AAPL',n:'Apple',p:226.5,c:.8,m:'US',pe:34.1,eps:6.64,rsi:61,ma5:224,ma20:219,ma60:205},
{t:'NVDA',n:'NVIDIA',p:141.2,c:1.9,m:'US',pe:38.2,eps:3.69,rsi:67,ma5:139,ma20:132,ma60:118},
{t:'TSLA',n:'Tesla',p:338.4,c:-.7,m:'US',pe:155,eps:2.18,rsi:52,ma5:340,ma20:331,ma60:305}
];
let state=JSON.parse(localStorage.ianState||'null')||{cash:1000000,pos:{},hist:[],watch:['2330']};
let current=null;
const money=n=>'$'+Math.round(n).toLocaleString();
function save(){localStorage.ianState=JSON.stringify(state)}
function stock(t){return stocks.find(x=>x.t===t)}
function go(id){document.querySelectorAll('.page').forEach(x=>x.classList.add('hide'));document.getElementById(id).classList.remove('hide');document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===id));if(id==='home')renderHome();if(id==='portfolio')renderPortfolio()}
function renderHome(){document.getElementById('market').innerHTML=stocks.slice(0,4).map(s=>`<div class="stock" onclick="openStock('${s.t}')"><div><div class="ticker">${s.t} <span class="muted">${s.n}</span></div><div class="mini">${s.m}</div></div><div style="text-align:right"><div class="price">${s.m==='US'?'$':''}${s.p.toLocaleString()}</div><div class="${s.c>=0?'green':'red'}">${s.c>=0?'+':''}${s.c}%</div></div></div>`).join('');calc()}
function renderSearch(){let q=document.getElementById('q').value.toLowerCase();let a=stocks.filter(s=>(s.t+s.n).toLowerCase().includes(q));document.getElementById('results').innerHTML=a.map(s=>`<div class="stock" onclick="openStock('${s.t}')"><div><div class="ticker">${s.t} ${s.n}</div><div class="mini">${s.m}</div></div><div class="${s.c>=0?'green':'red'}">${s.c>=0?'+':''}${s.c}%</div></div>`).join('')||'<p class="muted">找不到示範股票。</p>'}
function openStock(t){current=stock(t);document.getElementById('dname').textContent=current.n+' · '+current.m;document.getElementById('dticker').textContent=current.t;document.getElementById('dprice').textContent=(current.m==='US'?'$':'NT$')+current.p.toLocaleString();document.getElementById('dchange').innerHTML=`<span class="${current.c>=0?'green':'red'}">${current.c>=0?'+':''}${current.c}%</span>`;document.getElementById('orderPrice').value=current.p;document.getElementById('indicators').innerHTML=[['MA5',current.ma5],['MA20',current.ma20],['MA60',current.ma60],['RSI',current.rsi],['P/E',current.pe],['EPS',current.eps]].map(x=>`<div class="card" style="margin:0"><div class="muted">${x[0]}</div><b>${x[1]}</b></div>`).join('');go('detail');drawChart()}
function drawChart(){let c=document.getElementById('chart'),x=c.getContext('2d'),w=c.width,h=c.height;x.clearRect(0,0,w,h);x.strokeStyle='#1d3552';for(let i=1;i<6;i++){x.beginPath();x.moveTo(0,i*h/6);x.lineTo(w,i*h/6);x.stroke()}let base=current.p*(1-current.c/100),pts=[];for(let i=0;i<45;i++){let v=base*(1+Math.sin(i/5)*.025+Math.sin(i/2.7)*.012+(i/44)*(current.p/base-1));pts.push([i*(w-30)/44+15,v])}let min=Math.min(...pts.map(p=>p[1])),max=Math.max(...pts.map(p=>p[1]));x.strokeStyle='#56a8ff';x.lineWidth=4;x.beginPath();pts.forEach((p,i)=>{let y=h-20-(p[1]-min)/(max-min)*(h-40);i?x.lineTo(p[0],y):x.moveTo(p[0],y)});x.stroke()}
function calc(){let hv=0, invested=0;Object.entries(state.pos).forEach(([t,p])=>{let s=stock(t);hv+=p.qty*s.p;invested+=p.qty*p.avg});let total=state.cash+hv,pnl=hv-invested+(total-(state.cash+invested));document.getElementById('total').textContent=money(total);document.getElementById('pnl').textContent=(pnl>=0?'+':'')+money(pnl)}
function order(side){let q=Math.max(1,parseInt(document.getElementById('qty').value)||1),price=parseFloat(document.getElementById('orderPrice').value)||current.p, cost=q*price;let p=state.pos[current.t]||{qty:0,avg:0};if(side==='buy'){if(cost>state.cash)return alert('模擬現金不足');p.avg=(p.qty*p.avg+cost)/(p.qty+q);p.qty+=q;state.cash-=cost}else{if(q>p.qty)return alert('持股不足');state.cash+=cost;p.qty-=q;if(!p.qty)delete state.pos[current.t]}if(p.qty)state.pos[current.t]=p;state.hist.unshift({time:new Date().toLocaleString(),side,t:current.t,qty:q,price});save();renderPortfolio();calc();alert(`已完成模擬${side==='buy'?'買入':'賣出'} ${current.t} ${q} 股`)}
function renderPortfolio(){let hv=0,inv=0;Object.entries(state.pos).forEach(([t,p])=>{let s=stock(t);hv+=p.qty*s.p;inv+=p.qty*p.avg});let total=state.cash+hv,pnl=hv-inv;document.getElementById('cash').textContent=money(state.cash);document.getElementById('holdValue').textContent=money(hv);document.getElementById('pTotal').textContent=money(total);document.getElementById('pPnl').textContent=(pnl>=0?'+':'')+money(pnl);document.getElementById('pPnl').className='metric '+(pnl>=0?'green':'red');document.getElementById('positions').innerHTML=Object.entries(state.pos).map(([t,p])=>{let s=stock(t),v=p.qty*s.p,pl=v-p.qty*p.avg;return `<div class="stock"><div><b>${t} ${s.n}</b><div class="mini">${p.qty} 股 · 成本 ${p.avg.toFixed(2)}</div></div><div class="${pl>=0?'green':'red'}">${pl>=0?'+':''}${Math.round(pl).toLocaleString()}</div></div>`}).join('')||'<p class="muted">目前沒有持股。</p>';document.getElementById('history').innerHTML=state.hist.slice(0,10).map(h=>`<div class="stock"><div>${h.side==='buy'?'買入':'賣出'} ${h.t} ${h.qty}股</div><div class="mini">${h.price} · ${h.time}</div></div>`).join('')||'<p class="muted">尚無交易紀錄。</p>'}
function toggleWatch(){let i=state.watch.indexOf(current.t);i>=0?state.watch.splice(i,1):state.watch.push(current.t);save();alert(i>=0?'已移除自選':'已加入自選')}
function showWatch(){go('search');document.getElementById('q').value='';let a=stocks.filter(s=>state.watch.includes(s.t));document.getElementById('results').innerHTML='<h2>我的自選</h2>'+a.map(s=>`<div class="stock" onclick="openStock('${s.t}')"><b>${s.t} ${s.n}</b><span class="${s.c>=0?'green':'red'}">${s.c}%</span></div>`).join('')||'<p class="muted">尚無自選股。</p>'}
renderHome();
</script>
</body>
</html>
